name: Aplicar auditoria segura

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - .github/workflows/aplicar-auditoria-segura.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento
          fetch-depth: 0

      - name: Baixar lote auditado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/60fb389ac48b88cf869e19d571028dec38482d8d" \
            > /tmp/audit-blob.json
          jq -r '.content' /tmp/audit-blob.json | tr -d '\n' | base64 -d > /tmp/audit-fixes.tgz
          unexpected="$(tar -tzf /tmp/audit-fixes.tgz | grep -Ev '^(bootstrap\.js|cloud-adapter\.js|cloud-client-status-fix\.js|cloud-client-store-v2\.js|cloud-state-store\.js|lib/cloud-data-handler\.js|ui-runtime-fixes\.js|packed/bridgegz-0[1-4]\.txt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Pacote contém arquivos não autorizados:"
            echo "$unexpected"
            exit 1
          fi
          tar -xzf /tmp/audit-fixes.tgz

      - name: Validar JavaScript
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check cloud-adapter.js
          node --check cloud-client-status-fix.js
          node --check cloud-client-store-v2.js
          node --check cloud-state-store.js
          node --check lib/cloud-data-handler.js
          node --check ui-runtime-fixes.js
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p=Path('.')
          raw=''.join((p/'packed'/f'bridgegz-{i:02d}.txt').read_text().strip() for i in range(1,5))
          Path('/tmp/bridge-audit.js').write_text(gzip.decompress(base64.b64decode(raw)).decode())
          PY
          node --check /tmp/bridge-audit.js

      - name: Registrar correções auditadas
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bootstrap.js \
            cloud-adapter.js \
            cloud-client-status-fix.js \
            cloud-client-store-v2.js \
            cloud-state-store.js \
            lib/cloud-data-handler.js \
            ui-runtime-fixes.js \
            packed/bridgegz-01.txt \
            packed/bridgegz-02.txt \
            packed/bridgegz-03.txt \
            packed/bridgegz-04.txt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração funcional pendente."
            exit 0
          fi
          git commit -m "Auditoria geral: corrige fluxos cloud críticos"
          git push origin HEAD:desenvolvimento
