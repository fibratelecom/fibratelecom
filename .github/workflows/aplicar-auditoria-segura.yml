name: Aplicar auditoria segura

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - .github/workflows/aplicar-auditoria-segura.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento
          fetch-depth: 0

      - name: Recuperar e validar lote auditado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/60fb389ac48b88cf869e19d571028dec38482d8d" \
            > /tmp/audit-blob.json
          jq -r '.content' /tmp/audit-blob.json | tr -d '\n' | base64 -d > /tmp/stage1
          if gzip -t /tmp/stage1 2>/dev/null; then
            cp /tmp/stage1 /tmp/audit-fixes.tgz
          elif base64 -d /tmp/stage1 > /tmp/stage2 2>/dev/null && gzip -t /tmp/stage2 2>/dev/null; then
            cp /tmp/stage2 /tmp/audit-fixes.tgz
          else
            echo "O blob do lote não pôde ser recuperado como gzip íntegro."
            file /tmp/stage1 || true
            sha256sum /tmp/stage1 || true
            exit 1
          fi
          echo "PACOTE_GZIP_OK"
          sha256sum /tmp/audit-fixes.tgz
          unexpected="$(tar -tzf /tmp/audit-fixes.tgz | grep -Ev '^(bootstrap\.js|cloud-adapter\.js|cloud-client-status-fix\.js|cloud-client-store-v2\.js|cloud-state-store\.js|lib/cloud-data-handler\.js|ui-runtime-fixes\.js|packed/bridgegz-0[1-4]\.txt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Pacote contém arquivos não autorizados:"
            echo "$unexpected"
            exit 1
          fi
          tar -xzf /tmp/audit-fixes.tgz

      - name: Validar JavaScript e cenários críticos
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check cloud-adapter.js
          node --check cloud-client-status-fix.js
          node --check cloud-client-store-v2.js
          node --check cloud-state-store.js
          node --check lib/cloud-data-handler.js
          node --check ui-runtime-fixes.js
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          raw=''.join((Path('packed')/f'bridgegz-{i:02d}.txt').read_text().strip() for i in range(1,5))
          src=gzip.decompress(base64.b64decode(raw)).decode()
          Path('/tmp/bridge-audit.js').write_text(src)
          assert 'function addMonths(date,n)' in src
          assert "for(const invoice of s.invoices)if(Number(invoice.client_id)===Number(i))invoice.client_id=null" in src
          assert 'cancelIssued' in src
          print('BRIDGE_CRITICAL_GUARDS_OK')
          PY
          node --check /tmp/bridge-audit.js
          grep -q "const existing=state.clients.find" cloud-client-store-v2.js
          grep -q "pppoe_password:existing?.pppoe_password" cloud-client-store-v2.js
          grep -q "localMonthKey" cloud-adapter.js
          echo "VALIDACAO_AUDITORIA_OK"

      - name: Registrar correções auditadas e limpar workflow temporário
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/aplicar-auditoria-segura.yml
          git add -A \
            bootstrap.js \
            cloud-adapter.js \
            cloud-client-status-fix.js \
            cloud-client-store-v2.js \
            cloud-state-store.js \
            lib/cloud-data-handler.js \
            ui-runtime-fixes.js \
            packed/bridgegz-01.txt \
            packed/bridgegz-02.txt \
            packed/bridgegz-03.txt \
            packed/bridgegz-04.txt \
            .github/workflows/aplicar-auditoria-segura.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Auditoria geral: corrige fluxos cloud críticos"
          git push origin HEAD:desenvolvimento
