name: Aplicar correcoes auditoria

on:
  push:
    branches: [desenvolvimento]
    paths: [.github/workflows/aplicar-correcoes-auditoria.yml]

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento

      - name: Aplicar somente substituicoes validadas
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path); s=p.read_text()
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: esperado 1 trecho, encontrado {count}')
              p.write_text(s.replace(old,new))

          replace_exact('lib/cloud-data-handler.js',
              "const nullableText=v=>{const s=text(v);return s||null};",
              "const nullableText=v=>{const s=text(v);return s||null};\nconst bool=(v,fallback=false)=>{if(v===undefined||v===null||v==='')return fallback;if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;const s=text(v).toLowerCase();if(['true','1','sim','yes','on'].includes(s))return true;if(['false','0','nao','não','no','off'].includes(s))return false;return fallback};")
          replace_exact('lib/cloud-data-handler.js',
              "allow_self_signed:Boolean(data.allow_self_signed),\n    active:data.active===undefined?true:Boolean(data.active),",
              "allow_self_signed:bool(data.allow_self_signed,false),\n    active:bool(data.active,true),")
          replace_exact('lib/cloud-data-handler.js',
              "auto_block:Boolean(data.auto_block),",
              "auto_block:bool(data.auto_block,false),")

          replace_exact('cloud-adapter.js',
              "  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));",
              "  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));\n  const bool=(v,fallback=false)=>{if(v===undefined||v===null||v==='')return fallback;if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;const s=String(v).trim().toLowerCase();if(['true','1','sim','yes','on'].includes(s))return true;if(['false','0','nao','não','no','off'].includes(s))return false;return fallback};")
          replace_exact('cloud-adapter.js',
              "allow_self_signed:Boolean(r?.allow_self_signed)",
              "allow_self_signed:bool(r?.allow_self_signed,false)")

          replace_exact('bootstrap.js',
              ")().catch(err=>{console.error(err);const root=document.getElementById('root')||document.body;root.innerHTML=`<div style=\"font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:60px auto;padding:24px;border:1px solid #e5e7eb;border-radius:14px\"><h2>Provedor Plus</h2><p>Não foi possível carregar o painel.</p><pre style=\"white-space:pre-wrap;color:#b91c1c\">${String(err&&err.message||err)}</pre><button onclick=\"location.reload()\">Tentar novamente</button></div>`});",
              ")().catch(err=>{console.error(err);const root=document.getElementById('root')||document.body,message=String(err&&err.message||err);root.innerHTML='<div style=\"font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:60px auto;padding:24px;border:1px solid #e5e7eb;border-radius:14px\"><h2>Provedor Plus</h2><p>Não foi possível carregar o painel.</p><pre id=\"pp-startup-error\" style=\"white-space:pre-wrap;color:#b91c1c\"></pre><button id=\"pp-startup-retry\">Tentar novamente</button></div>';const pre=root.querySelector('#pp-startup-error'),button=root.querySelector('#pp-startup-retry');if(pre)pre.textContent=message;if(button)button.addEventListener('click',()=>location.reload())});")
          PY
          node --check lib/cloud-data-handler.js
          node --check cloud-adapter.js
          node --check bootstrap.js

      - name: Commit das correcoes validadas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cloud-data-handler.js cloud-adapter.js bootstrap.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Auditoria: corrige booleanos e mensagem segura de inicializacao"
          git push origin HEAD:desenvolvimento
