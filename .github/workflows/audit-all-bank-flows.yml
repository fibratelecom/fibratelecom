name: Audit All Bank Flows

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect Pix Automatic and audit every billing flow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('billing-bank-selector.js')
          s=p.read_text()
          marker="  const invoiceSave=api.invoices.save.bind(api.invoices);"
          block="""  if(typeof api?.banks?.createEfiPixAutomatic==='function'){
            const createEfiPixAutomatic=api.banks.createEfiPixAutomatic.bind(api.banks);
            api.banks.createEfiPixAutomatic=async values=>{
              await refreshBillingClient(values?.clientId);
              try{return await createEfiPixAutomatic(values)}catch(error){throw explainBankError(error)}
            };
          }

          """
          if "api.banks.createEfiPixAutomatic=async" not in s:
              if marker not in s: raise SystemExit('Invoice wrapper marker not found')
              s=s.replace(marker,block+marker,1)
              p.write_text(s)
          PY
          node --check billing-bank-selector.js
          grep -Fq "api.banks.createEfiPixAutomatic=async" billing-bank-selector.js
          grep -Fq "await refreshBillingClient(values?.clientId)" billing-bank-selector.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/proxy.js
          grep -Fq "const freshClient=await refreshBillingClient" billing-bank-selector.js
          grep -Fq "api.invoices.save=async" billing-bank-selector.js
          grep -Fq "api.invoices.generateInstallments=async" billing-bank-selector.js
          git fetch origin main
          git diff --quiet origin/main -- packed/appgz-*.txt packed/bridgegz-*.txt packed/proxygz-*.txt
          if ! git diff --quiet -- billing-bank-selector.js; then
            git config user.name fibratelecom
            git config user.email lanconta2015@gmail.com
            git add billing-bank-selector.js
            git commit -m 'Protege Pix Automático com cliente atualizado'
            git push origin HEAD:fix/global-navigation-duplication
          fi
