name: Audit All Bank Flows

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit every billing flow
        run: |
          set -euo pipefail
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/proxy.js
          node --check billing-bank-selector.js
          python - <<'PY'
          from pathlib import Path
          files={
            'BRIDGE':Path('/tmp/bridge.js').read_text(),
            'APP':Path('/tmp/app.js').read_text(),
            'PROXY':Path('/tmp/proxy.js').read_text(),
            'SELECTOR':Path('billing-bank-selector.js').read_text(),
          }
          terms={
            'BRIDGE':['saveInvoiceWeb','installmentsWeb','syncInvoicesWeb','markPaidWeb','deleteInvoiceWeb','deleteClientInvoicesWeb','pixAutomatic','pixAuto','recurrence','recorrencia','bankCall'],
            'APP':['generateInstallments','Pix com vencimento','Pix Automático','Boleto avulso','Gerar carnê','invoices.save','pixAutomatic','recorrência','recorrencia'],
            'PROXY':['issueEfi','issueEfiCarnet','issueEfiPixDue','issueEfiPixAuto','issueMp','syncInvoice','cancelInvoice','pixAuto','recurrence','recorrencia'],
            'SELECTOR':['refreshBillingClient','api.invoices.save=async','api.invoices.generateInstallments=async','explainBankError']
          }
          for label,text in files.items():
            print('\n###',label)
            for term in terms[label]:
              start=0;hits=0
              while True:
                idx=text.find(term,start)
                if idx<0 or hits>=6: break
                print('\nTERM',term,'INDEX',idx)
                print(text[max(0,idx-1000):min(len(text),idx+3200)])
                hits+=1;start=idx+len(term)
          PY
          grep -Fq "const freshClient=await refreshBillingClient" billing-bank-selector.js
          grep -Fq "api.invoices.save=async" billing-bank-selector.js
          grep -Fq "api.invoices.generateInstallments=async" billing-bank-selector.js
