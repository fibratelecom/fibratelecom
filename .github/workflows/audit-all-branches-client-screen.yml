name: Auditar origem real da tela client
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-all-branches-client-screen.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Procurar tela em todas as branches
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import subprocess,tempfile,os,glob,base64,gzip,re
          from pathlib import Path
          needles=['Sua internet Fibra+','na palma da sua mão','Conectando','Acessar com','Esqueci meus dados','Instalar Cliente Fibra+']
          branches=subprocess.check_output(['git','for-each-ref','--format=%(refname:short)','refs/remotes/origin']).decode().splitlines()
          branches=[b for b in branches if b!='origin/HEAD']
          found=[]
          for branch in branches:
              name=branch.removeprefix('origin/')
              with tempfile.TemporaryDirectory() as td:
                  try:
                      subprocess.run(['git','worktree','add','--detach',td,branch],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      root=Path(td)
                      # plain text files
                      for p in root.rglob('*'):
                          if not p.is_file() or '.git' in p.parts or 'packed' in p.parts: continue
                          if p.stat().st_size>2_000_000: continue
                          try:s=p.read_text(errors='ignore')
                          except:continue
                          hits=[n for n in needles if n.lower() in s.lower()]
                          if hits:
                              found.append((name,str(p.relative_to(root)),hits))
                      files=sorted(glob.glob(str(root/'packed'/'appgz-*.txt')))
                      if files:
                          raw=''.join(Path(f).read_text() for f in files)
                          try:src=gzip.decompress(base64.b64decode(''.join(raw.split()))).decode('utf-8','replace')
                          except:src=''
                          hits=[n for n in needles if n.lower() in src.lower()]
                          if hits: found.append((name,'packed/appgz-*',hits))
                  finally:
                      subprocess.run(['git','worktree','remove','--force',td],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('MATCH_COUNT',len(found))
          for branch,path,hits in found:
              print('MATCH',branch,'::',path,'::',hits)
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-all-branches-client-screen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-all-branches-client-screen.yml
          git commit -m 'Remove auditor temporario de origem do client' || true
          git push origin HEAD:cloudflare-provedor-plus
