name: Apply Startup Root Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar e validar
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_startup_root_fix.py
          node --check bootstrap.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          node --check /tmp/app.js
          grep -Fq 'return i?null:c?' /tmp/app.js
          grep -Fq 'onUncaughtError' /tmp/app.js
          grep -Fq 'pp-startup-screen-new' bootstrap.js
          grep -Fq 'shellDeadline=Date.now()+10000' bootstrap.js
          ! grep -Fq 'startup-loader.js' index.html
          ! grep -Fq 'Abrindo banco de dados...' /tmp/app.js
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap.js index.html packed/appgz-*.txt
          git rm -f startup-loader.js || true
          git commit -m 'Corrige controlador unico da abertura'
          git rm -f .github/workflows/audit-api-boot-root.yml .github/workflows/audit-bootstrap-order.yml .github/workflows/browser-runtime-diagnosis.yml .github/workflows/audit-initial-render.yml .github/workflows/fix-startup-root-controller.yml .github/scripts/apply_startup_root_fix.py || true
          git commit -m 'Remove diagnosticos temporarios da abertura' || true
          git push origin HEAD:cloudflare-provedor-plus
