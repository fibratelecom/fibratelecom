name: Audit Auto Block Release

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build concise automation report
        run: |
          set -euo pipefail
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/proxy.js
          python - <<'PY'
          from pathlib import Path
          import re

          sources={
            'APP':Path('/tmp/app.js').read_text(errors='replace'),
            'BRIDGE':Path('/tmp/bridge.js').read_text(errors='replace'),
            'PROXY':Path('/tmp/proxy.js').read_text(errors='replace'),
            'CLOUD_ADAPTER':Path('cloud-adapter.js').read_text(errors='replace'),
            'CLIENT_STORE':Path('cloud-client-store-v2.js').read_text(errors='replace'),
          }
          if Path('vercel.json').exists(): sources['VERCEL']=Path('vercel.json').read_text(errors='replace')

          terms=[
            'syncInvoicesWeb','markPaidWeb','client.block','client.unblock','clients.block','clients.unblock',
            'blocked:true','blocked:false','paid_at','payment_date','payment_status','overdue','atraso','carencia','carência',
            '7 dias','7 days','604800','604800000','webhook','cron','setInterval','scheduler','schedule'
          ]
          out=[]
          for label,text in sources.items():
            out.append(f'===== {label} =====')
            low=text.lower()
            for term in terms:
              t=term.lower(); positions=[]; start=0
              while len(positions)<6:
                i=low.find(t,start)
                if i<0: break
                positions.append(i); start=i+len(t)
              if positions:
                out.append(f'\nTERM {term!r} COUNT_SHOWN {len(positions)}')
                for i in positions:
                  snippet=text[max(0,i-700):min(len(text),i+1800)].replace('\x00','')
                  out.append(snippet)
            out.append('')

          Path('.audit-auto-block-release-report.txt').write_text('\n'.join(out))
          PY
          git add .audit-auto-block-release-report.txt
          if ! git diff --cached --quiet; then
            git config user.name fibratelecom
            git config user.email lanconta2015@gmail.com
            git commit -m 'Registra relatório temporário de automação financeira'
            git push origin HEAD:fix/global-navigation-duplication
          fi
