name: Audit Auto Block Release

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit automatic payment release and overdue block
        run: |
          set -euo pipefail
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/proxy.js
          python - <<'PY'
          from pathlib import Path
          files={
            'APP':Path('/tmp/app.js').read_text(errors='replace'),
            'BRIDGE':Path('/tmp/bridge.js').read_text(errors='replace'),
            'PROXY':Path('/tmp/proxy.js').read_text(errors='replace'),
            'CLOUD_ADAPTER':Path('cloud-adapter.js').read_text(errors='replace'),
            'CLIENT_STORE':Path('cloud-client-store-v2.js').read_text(errors='replace'),
          }
          terms=[
            'syncInvoicesWeb','markPaidWeb','invoice','Pendente','Pago','Em atraso',
            'client.block','client.unblock','clients.block','clients.unblock','block(','unblock(',
            'grace','carencia','carência','7 days','7 dias','overdue','atraso','vencimento',
            'setInterval','setTimeout','cron','scheduler','automatic'
          ]
          for label,text in files.items():
            print('\n===== '+label+' =====')
            low=text.lower()
            for term in terms:
              start=0;hits=0;t=term.lower()
              while hits<8:
                idx=low.find(t,start)
                if idx<0: break
                print(f'\n--- TERM {term!r} @ {idx} ---')
                print(text[max(0,idx-1200):min(len(text),idx+3200)])
                start=idx+len(t);hits+=1
          PY
