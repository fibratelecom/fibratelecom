name: audit-bank-cutover
on:
  push:
    paths:
      - '.github/workflows/audit-bank-cutover.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract current bank engine
        run: |
          git fetch origin main
          for n in 01 02 03; do git show origin/main:packed/proxygz-$n.txt; done > /tmp/proxy.b64
          base64 -d /tmp/proxy.b64 | gzip -dc > /tmp/bank-proxy-current.js
          node --check /tmp/bank-proxy-current.js
          grep -Eo "'(efi|mp)-[a-z0-9-]+|'payment-[a-z0-9-]+|'[a-z0-9-]+-payment'" /tmp/bank-proxy-current.js | sort -u || true
      - uses: actions/upload-artifact@v4
        with:
          name: bank-proxy-current
          path: /tmp/bank-proxy-current.js
          retention-days: 1
      - name: Cleanup workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/audit-bank-cutover.yml
          git commit -m 'Remove auditor temporario do motor bancario'
          git push origin HEAD:cloudflare-provedor-plus
