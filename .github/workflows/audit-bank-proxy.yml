name: Implement Bank API
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-bank-proxy.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Implementar API Bancos no painel e portal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('worker.js')
          s=p.read_text()

          old="""function emptyBankSettings(){
            return {
              efi:{enabled:false,environment:'sandbox',clientId:'',clientSecret:'',certificatePassword:'',pixKey:'',pixAutoReceiverAgency:'',pixAutoReceiverAccount:'',webhookUrl:''},
              mercadoPago:{enabled:false,environment:'sandbox',publicKey:'',accessToken:''}
            };
          }"""
          new="""function emptyBankSettings(){
            return {
              efi:{enabled:false,environment:'sandbox',clientId:'',clientSecret:'',certificatePassword:'',certificateBase64:'',certificateName:'',pixKey:'',pixAutoReceiverAgency:'',pixAutoReceiverAccount:'',webhookUrl:'',lastTestStatus:'',lastTestMessage:'',lastTestAt:'',webhookConfiguredAt:''},
              mercadoPago:{enabled:false,environment:'sandbox',publicKey:'',accessToken:'',lastTestStatus:'',lastTestMessage:'',lastTestAt:''}
            };
          }"""
          assert old in s, 'emptyBankSettings não localizado'
          s=s.replace(old,new,1)

          start=s.index('function mergeEfiBank(current,data={}){')
          end=s.index('\n\nasync function handleBankSettings',start)
          replacement="""function mergeEfiBank(current,data={}){
            const previous=current?.efi||emptyBankSettings().efi;
            const certBase64=data.removeCertificate===true?'':data.certificateBase64===undefined?String(previous.certificateBase64||''):String(data.certificateBase64||'');
            if(certBase64.length>2500000)throw Object.assign(new Error('Certificado Efí muito grande. Selecione o arquivo P12/PFX original.'),{statusCode:400});
            return {
              enabled:data.enabled===undefined?Boolean(previous.enabled):Boolean(data.enabled),
              environment:data.environment==='production'?'production':data.environment==='sandbox'?'sandbox':text(previous.environment)||'sandbox',
              clientId:text(data.clientId)||text(previous.clientId),
              clientSecret:text(data.clientSecret)||text(previous.clientSecret),
              certificatePassword:data.certificatePassword===undefined?String(previous.certificatePassword||''):String(data.certificatePassword||''),
              certificateBase64:certBase64,
              certificateName:data.removeCertificate===true?'':data.certificateName===undefined?text(previous.certificateName):text(data.certificateName),
              pixKey:data.pixKey===undefined?text(previous.pixKey):text(data.pixKey),
              pixAutoReceiverAgency:data.pixAutoReceiverAgency===undefined?text(previous.pixAutoReceiverAgency):digits(data.pixAutoReceiverAgency),
              pixAutoReceiverAccount:data.pixAutoReceiverAccount===undefined?text(previous.pixAutoReceiverAccount):digits(data.pixAutoReceiverAccount),
              webhookUrl:data.webhookUrl===undefined?text(previous.webhookUrl):text(data.webhookUrl),
              lastTestStatus:text(previous.lastTestStatus),lastTestMessage:text(previous.lastTestMessage),lastTestAt:text(previous.lastTestAt),webhookConfiguredAt:text(previous.webhookConfiguredAt)
            };
          }

          function mergeMercadoPagoBank(current,data={}){
            const previous=current?.mercadoPago||emptyBankSettings().mercadoPago;
            return {
              enabled:data.enabled===undefined?Boolean(previous.enabled):Boolean(data.enabled),
              environment:data.environment==='production'?'production':data.environment==='sandbox'?'sandbox':text(previous.environment)||'sandbox',
              publicKey:data.publicKey===undefined?text(previous.publicKey):text(data.publicKey),
              accessToken:text(data.accessToken)||text(previous.accessToken),
              lastTestStatus:text(previous.lastTestStatus),lastTestMessage:text(previous.lastTestMessage),lastTestAt:text(previous.lastTestAt)
            };
          }

          function safeBankSettings(value){
            const efi=value?.efi||{},mp=value?.mercadoPago||{};
            return {
              efi:{enabled:Boolean(efi.enabled),environment:text(efi.environment)||'sandbox',clientIdConfigured:Boolean(text(efi.clientId)),clientSecretConfigured:Boolean(text(efi.clientSecret)),certificatePasswordConfigured:Boolean(String(efi.certificatePassword||'')),certificateConfigured:Boolean(String(efi.certificateBase64||'')),certificateName:text(efi.certificateName),pixKey:text(efi.pixKey),pixAutoReceiverAgency:text(efi.pixAutoReceiverAgency),pixAutoReceiverAccount:text(efi.pixAutoReceiverAccount),webhookUrl:text(efi.webhookUrl),lastTestStatus:text(efi.lastTestStatus),lastTestMessage:text(efi.lastTestMessage),lastTestAt:text(efi.lastTestAt),webhookConfiguredAt:text(efi.webhookConfiguredAt)},
              mercadoPago:{enabled:Boolean(mp.enabled),environment:text(mp.environment)||'sandbox',publicKey:text(mp.publicKey),accessTokenConfigured:Boolean(text(mp.accessToken)),lastTestStatus:text(mp.lastTestStatus),lastTestMessage:text(mp.lastTestMessage),lastTestAt:text(mp.lastTestAt)}
            };
          }

          async function handleBankSettings(request,env){
            if(request.method!=='POST')return json({ok:false,error:'Método não permitido.'},405,{'x-provedor-plus-edge':'cloudflare-bank-settings'});
            try{
              await requireBankAdmin(request,env);
              let body={};try{body=await request.json()}catch{}
              const action=text(body?.action),data=body?.data||{};let result;
              if(action==='get')result=await readBankSettings(env);
              else if(action==='get-safe')result=safeBankSettings(await readBankSettings(env));
              else if(action==='save-efi'){
                const current=await readBankSettings(env),next={...current,efi:mergeEfiBank(current,data)};
                result=await writeBankSettings(env,next);
              }else if(action==='save-mercado-pago'){
                const current=await readBankSettings(env),next={...current,mercadoPago:mergeMercadoPagoBank(current,data)};
                result=await writeBankSettings(env,next);
              }else if(action==='save-default'){
                if(!env.DATABASE_URL)throw Object.assign(new Error('Conexão com o Neon não configurada.'),{statusCode:503});
                const provider=['efi','mercadoPago'].includes(text(data.provider))?text(data.provider):'';
                const sql=neon(env.DATABASE_URL),state=await loadState(sql);state.banks={...(state.banks||{}),defaultProvider:provider};await saveState(sql,state);result={defaultProvider:provider};
              }else if(action==='test-efi'||action==='test-mercado-pago'||action==='configure-efi-webhooks'){
                if(!env.DATABASE_URL)throw Object.assign(new Error('Conexão com o Neon não configurada.'),{statusCode:503});
                const sql=neon(env.DATABASE_URL),current=await readBankSettings(env),secrets=bankSecretsFromVault(current),isEfi=action!=='test-mercado-pago';
                try{
                  const proxyAction=action==='test-efi'?'efi-test':action==='test-mercado-pago'?'mp-test':'efi-webhooks';
                  const tested=await bankProxyAsService(env,sql,{action:proxyAction,efi:secrets.efi,mercadoPago:secrets.mercadoPago});
                  const now=new Date().toISOString();
                  if(isEfi){current.efi={...current.efi,lastTestStatus:'success',lastTestMessage:text(tested?.message)||'Conexão Efí confirmada.',lastTestAt:now,...(action==='configure-efi-webhooks'?{webhookConfiguredAt:now}:{})};}
                  else current.mercadoPago={...current.mercadoPago,lastTestStatus:'success',lastTestMessage:text(tested?.message)||'Conexão Mercado Pago confirmada.',lastTestAt:now};
                  await writeBankSettings(env,current);result={test:tested,settings:safeBankSettings(current)};
                }catch(error){
                  const now=new Date().toISOString(),message=error instanceof Error?error.message:String(error);
                  if(isEfi)current.efi={...current.efi,lastTestStatus:'error',lastTestMessage:message,lastTestAt:now};else current.mercadoPago={...current.mercadoPago,lastTestStatus:'error',lastTestMessage:message,lastTestAt:now};
                  try{await writeBankSettings(env,current)}catch{}
                  throw error;
                }
              }else throw Object.assign(new Error('Ação bancária não permitida.'),{statusCode:400});
              return json({ok:true,data:result},200,{'x-provedor-plus-edge':'cloudflare-bank-settings'});
            }catch(error){
              return json({ok:false,error:error instanceof Error?error.message:String(error)},Number(error?.statusCode)||500,{'x-provedor-plus-edge':'cloudflare-bank-settings'});
            }
          }"""
          s=s[:start]+replacement+s[end+2+len('async function handleBankSettings'):]
          # The slice above intentionally replaced through the old function name marker; repair any accidental leftover signature.
          s=s.replace("(request,env){\n  if(request.method!=='POST')return json({ok:false,error:'Método não permitido.'},405,{'x-provedor-plus-edge':'cloudflare-bank-settings'});\n  try{\n    await requireBankAdmin(request,env);", "", 1) if s.count("async function handleBankSettings(request,env)")>1 else s

          # Improve invoice mapping with bank-native fields.
          s=s.replace("pixPaymentUrl:text(row?.pix_payment_url||row?.pixPaymentUrl||row?.pix_url||row?.pixUrl),", "pixPaymentUrl:text(row?.pix_payment_url||row?.pixPaymentUrl||row?.pix_url||row?.pixUrl||row?.bank_ticket_url),",1)
          s=s.replace("pixCopyPaste:text(row?.pix_copy_paste||row?.pixCopyPaste||row?.pix_payload||row?.pixPayload),", "pixCopyPaste:text(row?.pix_copy_paste||row?.pixCopyPaste||row?.pix_payload||row?.pixPayload||row?.bank_pix_code),",1)
          s=s.replace("pdfUrl:text(row?.pdf_url||row?.invoice_pdf_url||row?.boleto_pdf_url||row?.bank_slip_pdf_url),", "pdfUrl:text(row?.pdf_url||row?.invoice_pdf_url||row?.boleto_pdf_url||row?.bank_slip_pdf_url||row?.bank_pdf_url),",1)
          s=s.replace("digitableLine:text(row?.digitable_line||row?.linha_digitavel),", "digitableLine:text(row?.digitable_line||row?.linha_digitavel||row?.bank_digitable_line||row?.bank_barcode),",1)
          s=s.replace("installmentTotal:number(row?.installment_total)??null", "installmentTotal:number(row?.installment_total)??null,\n    bankProvider:text(row?.bank_provider),\n    bankStatus:text(row?.bank_status),\n    paymentMethod:text(row?.payment_method),\n    paidAt:text(row?.paid_at)",1)

          payment_code=r'''function portalPaymentInactiveStatus(value){
            const status=text(value).toLowerCase();
            return ['pago','paid','baixado','cancelado','canceled','renegociado','renegotiated','substituido','substituida'].some(item=>status.includes(item));
          }

          function portalPaymentInvoice(state,client,invoiceId){
            const row=(Array.isArray(state?.invoices)?state.invoices:[]).find(item=>String(item?.id)===String(invoiceId)&&Number(item?.client_id)===Number(client.id));
            if(!row)throw Object.assign(new Error('Fatura não encontrada para este cliente.'),{statusCode:404});
            if(portalPaymentInactiveStatus(row.status))throw Object.assign(new Error('Esta fatura não está disponível para pagamento.'),{statusCode:409});
            if(invoiceCents(row)<=0)throw Object.assign(new Error('A fatura não possui valor válido para pagamento.'),{statusCode:409});
            return row;
          }

          function portalBankAvailability(state,client,vault){
            const local=stateClient(state,client),efi=vault?.efi||{},mp=vault?.mercadoPago||{};
            const ready={
              efi:Boolean(efi.enabled&&text(efi.clientId)&&text(efi.clientSecret)),
              efiPix:Boolean(efi.enabled&&text(efi.clientId)&&text(efi.clientSecret)&&String(efi.certificateBase64||'')&&text(efi.pixKey)),
              mercadoPago:Boolean(mp.enabled&&text(mp.accessToken)),
              mercadoPagoCard:Boolean(mp.enabled&&text(mp.accessToken)&&text(mp.publicKey))
            };
            const preferred=[text(local.billing_bank_provider),text(state?.banks?.defaultProvider)].find(value=>value==='efi'||value==='mercadoPago')||'';
            let pixProvider='';
            if(preferred==='efi'&&ready.efiPix)pixProvider='efi';else if(preferred==='mercadoPago'&&ready.mercadoPago)pixProvider='mercadoPago';else if(ready.efiPix)pixProvider='efi';else if(ready.mercadoPago)pixProvider='mercadoPago';
            return {ready,preferred,pixProvider,cardProvider:ready.mercadoPagoCard?'mercadoPago':'',secrets:bankSecretsFromVault(vault)};
          }

          async function portalPaymentContext(env,data){
            if(!env.DATABASE_URL)throw Object.assign(new Error('Conexão nativa com o Neon não configurada na Cloudflare.'),{statusCode:503});
            const session=await verifyPortalSession(data?.session,env),sql=neon(env.DATABASE_URL),client=await portalClientById(sql,session.clientId);
            if(!client)throw Object.assign(new Error('Cliente da sessão não foi encontrado.'),{statusCode:404});
            const state=await loadState(sql),vault=await readBankSettings(env),banks=portalBankAvailability(state,client,vault);
            return {session,sql,client,state,vault,banks};
          }

          async function paymentConfigForSession(env,data){
            const ctx=await portalPaymentContext(env,data),mp=ctx.vault?.mercadoPago||{};
            return {pixEnabled:Boolean(ctx.banks.pixProvider),pixProvider:ctx.banks.pixProvider,pixProviderLabel:ctx.banks.pixProvider==='efi'?'Efí Bank':ctx.banks.pixProvider==='mercadoPago'?'Mercado Pago':'',cardEnabled:Boolean(ctx.banks.cardProvider),cardProvider:'mercadoPago',cardProviderLabel:'Mercado Pago',mercadoPagoPublicKey:ctx.banks.cardProvider?text(mp.publicKey):'',defaultProvider:ctx.banks.preferred,efiConfigured:ctx.banks.ready.efiPix,mercadoPagoConfigured:ctx.banks.ready.mercadoPago};
          }

          async function paymentPrepareForSession(env,data){
            const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId),amount=invoiceCents(invoice)/100;
            return {invoiceId:invoice.id,reference:invoiceReference(invoice),dueDate:formatDate(invoice.due_date||invoice.dueDate),amount,payer:{name:text(ctx.client.name),email:text(ctx.client.email),identification:{type:digits(ctx.client.document).length===14?'CNPJ':'CPF',number:digits(ctx.client.document)}}};
          }

          function mpPaid(value){const s=text(value).toLowerCase();return ['approved','paid','pago','concluido','concluído'].some(item=>s.includes(item));}
          function mpRejected(value){const s=text(value).toLowerCase();return ['rejected','cancelled','canceled','recusado','cancelado','refunded','charged_back'].some(item=>s.includes(item));}
          function markPortalInvoicePaid(invoice,method,paidAt=''){
            invoice.status='Pago';invoice.payment_method=method;invoice.paid_by='Área do Cliente';invoice.paid_at=text(paidAt)||new Date().toISOString();invoice.bank_last_sync_at=new Date().toISOString();
          }

          async function mercadoPagoRequest(vault,path,{method='GET',body=null,idempotencyKey=''}={}){
            const token=text(vault?.mercadoPago?.accessToken);if(!token)throw Object.assign(new Error('Mercado Pago não está configurado para este pagamento.'),{statusCode:409});
            const headers={Authorization:`Bearer ${token}`,Accept:'application/json'};if(body!==null)headers['Content-Type']='application/json';if(idempotencyKey)headers['X-Idempotency-Key']=idempotencyKey;
            const response=await fetch(`https://api.mercadopago.com${path}`,{method,headers,body:body===null?undefined:JSON.stringify(body)});let result={};try{result=await response.json()}catch{}
            if(!response.ok)throw Object.assign(new Error(text(result?.message||result?.error)||`Mercado Pago retornou HTTP ${response.status}.`),{statusCode:response.status>=400&&response.status<500?409:502});
            return result;
          }

          function mpPaymentFields(remote,detail){
            const tx=remote?.point_of_interaction?.transaction_data||{};
            return {bank_provider:'mercadoPago',bank_environment:'production',bank_charge_id:text(remote?.id),bank_order_id:'',bank_payment_id:text(remote?.id),bank_external_reference:text(remote?.external_reference),bank_status:text(remote?.status),bank_status_detail:detail,bank_ticket_url:text(tx?.ticket_url),bank_pix_code:text(tx?.qr_code),bank_last_sync_at:new Date().toISOString(),pix_payment_url:text(tx?.ticket_url),pix_copy_paste:text(tx?.qr_code),pix_qr_image:tx?.qr_code_base64?`data:image/png;base64,${text(tx.qr_code_base64)}`:''};
          }

          async function paymentPixForSession(env,data){
            const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId),provider=ctx.banks.pixProvider;
            if(!provider)throw Object.assign(new Error('Nenhum banco está pronto para gerar Pix. Configure Efí ou Mercado Pago em API Bancos.'),{statusCode:409});
            let remote={};
            if(provider==='efi'){
              if(text(invoice.bank_provider)==='efi'&&text(invoice.bank_status_detail)==='efi_pix_cobv'&&text(invoice.bank_charge_id)){
                remote=await bankProxyAsService(env,ctx.sql,{action:'sync',invoice:bankInvoice(invoice,ctx.client,ctx.state),efi:ctx.banks.secrets.efi,mercadoPago:ctx.banks.secrets.mercadoPago});Object.assign(invoice,remote||{});
              }
              if(!text(invoice.bank_pix_code)){
                const source={...invoice,billing_type:'Pix com vencimento'};
                remote=await bankProxyAsService(env,ctx.sql,{action:'issue',provider:'efi',invoice:bankInvoice(source,ctx.client,ctx.state),client:bankClient(ctx.client,ctx.state),efi:ctx.banks.secrets.efi,mercadoPago:ctx.banks.secrets.mercadoPago,pixAutoRecord:null});Object.assign(invoice,remote||{});
              }
              invoice.pix_copy_paste=text(invoice.bank_pix_code);invoice.pix_payment_url=text(invoice.bank_ticket_url);invoice.payment_origin='area-cliente';
            }else{
              let mp=null;
              if(text(invoice.bank_provider)==='mercadoPago'&&text(invoice.bank_status_detail)==='mercado_pago_pix'&&text(invoice.bank_payment_id)){
                try{mp=await mercadoPagoRequest(ctx.vault,`/v1/payments/${encodeURIComponent(invoice.bank_payment_id)}`)}catch{}
              }
              if(!mp||mpRejected(mp.status)){
                const name=text(ctx.client.name),parts=name.split(/\s+/).filter(Boolean),first=parts.shift()||name,last=parts.join(' ')||first;
                const payload={transaction_amount:invoiceCents(invoice)/100,description:text(invoice.description)||`Fatura ${invoiceReference(invoice)}`,payment_method_id:'pix',external_reference:`PP-INV-${invoice.id}-CLI-${ctx.client.id}`,payer:{email:text(ctx.client.email),first_name:first,last_name:last,identification:{type:digits(ctx.client.document).length===14?'CNPJ':'CPF',number:digits(ctx.client.document)}}};
                mp=await mercadoPagoRequest(ctx.vault,'/v1/payments',{method:'POST',body:payload,idempotencyKey:crypto.randomUUID()});
              }
              Object.assign(invoice,mpPaymentFields(mp,'mercado_pago_pix'));invoice.payment_origin='area-cliente';
              if(mpPaid(mp.status))markPortalInvoicePaid(invoice,'Pix Mercado Pago',mp.date_approved||mp.date_last_updated);
            }
            await saveState(ctx.sql,ctx.state);const portal=await portalSnapshot(ctx.client,ctx.state,env,ctx.session.token);
            return {provider,providerLabel:provider==='efi'?'Efí Bank':'Mercado Pago',paymentId:text(invoice.bank_payment_id||invoice.bank_charge_id),status:text(invoice.bank_status||invoice.status),qrCode:text(invoice.pix_copy_paste||invoice.bank_pix_code),qrCodeBase64:text(invoice.pix_qr_image).replace(/^data:image\/[^;]+;base64,/,''),paymentUrl:text(invoice.pix_payment_url||invoice.bank_ticket_url),portal};
          }

          async function paymentCardForSession(env,data){
            const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId);
            if(!ctx.banks.cardProvider)throw Object.assign(new Error('Mercado Pago não está pronto para cartão. Configure Public Key e Access Token em API Bancos.'),{statusCode:409});
            const pd=data?.paymentData&&typeof data.paymentData==='object'?data.paymentData:{};if(!text(pd.token)||!text(pd.payment_method_id))throw Object.assign(new Error('Os dados tokenizados do cartão não foram recebidos.'),{statusCode:400});
            const payer={...(pd.payer&&typeof pd.payer==='object'?pd.payer:{}),email:text(pd?.payer?.email||ctx.client.email)};
            if(!payer.identification?.number&&digits(ctx.client.document))payer.identification={type:digits(ctx.client.document).length===14?'CNPJ':'CPF',number:digits(ctx.client.document)};
            const payload={token:text(pd.token),transaction_amount:invoiceCents(invoice)/100,installments:Math.max(1,Number(pd.installments)||1),payment_method_id:text(pd.payment_method_id),description:text(invoice.description)||`Fatura ${invoiceReference(invoice)}`,external_reference:`PP-INV-${invoice.id}-CLI-${ctx.client.id}`,payer};
            if(pd.issuer_id)payload.issuer_id=String(pd.issuer_id);
            const idem=(await sha256Hex(`card|${ctx.client.id}|${invoice.id}|${text(pd.token)}`)).slice(0,64),mp=await mercadoPagoRequest(ctx.vault,'/v1/payments',{method:'POST',body:payload,idempotencyKey:idem});
            Object.assign(invoice,mpPaymentFields(mp,'mercado_pago_card'));invoice.payment_method='Cartão Mercado Pago';invoice.payment_origin='area-cliente';if(mpPaid(mp.status))markPortalInvoicePaid(invoice,'Cartão Mercado Pago',mp.date_approved||mp.date_last_updated);
            await saveState(ctx.sql,ctx.state);const portal=await portalSnapshot(ctx.client,ctx.state,env,ctx.session.token);
            return {provider:'mercadoPago',providerLabel:'Mercado Pago',paymentId:text(mp.id),status:text(mp.status),statusDetail:text(mp.status_detail),message:text(mp.status_detail),portal};
          }

          async function paymentStatusForSession(env,data){
            const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId);let changed=false,provider=text(invoice.bank_provider),status=text(invoice.bank_status||invoice.status),paidAt='';
            if(provider==='mercadoPago'&&text(invoice.bank_payment_id||data?.paymentId)){
              const mp=await mercadoPagoRequest(ctx.vault,`/v1/payments/${encodeURIComponent(invoice.bank_payment_id||data.paymentId)}`);Object.assign(invoice,mpPaymentFields(mp,text(invoice.bank_status_detail)||'mercado_pago_payment'));status=text(mp.status);paidAt=text(mp.date_approved||mp.date_last_updated);changed=true;if(mpPaid(status))markPortalInvoicePaid(invoice,text(invoice.bank_status_detail)==='mercado_pago_card'?'Cartão Mercado Pago':'Pix Mercado Pago',paidAt);
            }else if(provider==='efi'&&text(invoice.bank_charge_id)){
              const remote=await bankProxyAsService(env,ctx.sql,{action:'sync',invoice:bankInvoice(invoice,ctx.client,ctx.state),efi:ctx.banks.secrets.efi,mercadoPago:ctx.banks.secrets.mercadoPago});Object.assign(invoice,remote||{});status=text(remote?.bank_status||invoice.bank_status);paidAt=text(remote?.paidAt);changed=true;const paid=Boolean(paidAt)||['paid','pago','settled','concluida','concluída','concluido','concluído'].some(value=>status.toLowerCase().includes(value));if(paid)markPortalInvoicePaid(invoice,'Pix Efí',paidAt);
            }
            if(changed)await saveState(ctx.sql,ctx.state);const portal=await portalSnapshot(ctx.client,ctx.state,env,ctx.session.token);
            return {provider,status:portalPaymentInactiveStatus(invoice.status)&&text(invoice.status).toLowerCase().includes('pago')?'approved':status,state:text(invoice.status),paymentId:text(invoice.bank_payment_id||invoice.bank_charge_id),portal};
          }

          async function refreshPortalForSession(env,data){
            const ctx=await portalPaymentContext(env,data);return portalSnapshot(ctx.client,ctx.state,env,ctx.session.token);
          }

          '''
          marker='async function handleNativeCustomerPortal(request,env){'
          assert marker in s, 'handler customer portal não localizado'
          s=s.replace(marker,payment_code+marker,1)
          old_actions="""if(action==='login')result=await nativePortalLogin(env,data);
              else if(action==='negotiation-options')result=await negotiationOptionsForSession(env,data);
              else if(action==='negotiate')result=await negotiateForSession(env,data);
              else throw Object.assign(new Error('Ação não permitida.'),{statusCode:400});"""
          new_actions="""if(action==='login')result=await nativePortalLogin(env,data);
              else if(action==='refresh')result=await refreshPortalForSession(env,data);
