name: Audit Billing Bank Flow

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit billing to bank integration
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
          node --check /tmp/proxy.js
          python - <<'PY'
          from pathlib import Path
          import re
          files={'APP':Path('/tmp/app.js').read_text(),'BRIDGE':Path('/tmp/bridge.js').read_text(),'PROXY':Path('/tmp/proxy.js').read_text()}
          terms=[
            'bank_provider','/api/bank-proxy','invoices.save','invoice.save','banks.get','banks.saveEfi','banks.saveMercadoPago',
            'efi','mercadoPago','mercado pago','boleto','pix_due','pix_auto','pix automatico','pix com vencimento','carne'
          ]
          for label,text in files.items():
            print(f'===== {label} =====')
            low=text.lower()
            for term in terms:
              t=term.lower()
              idx=low.find(t)
              print(f'{term}:', 'FOUND' if idx>=0 else 'NOT_FOUND')
              if idx>=0:
                start=max(0,idx-450);end=min(len(text),idx+900)
                snippet=text[start:end].replace('\n',' ')
                print(snippet)
                print('---')
          PY
