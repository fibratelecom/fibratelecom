name: Auditar ponte do boleto
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-boleto-bridge.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Auditar bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob,base64,gzip,re
          files=sorted(glob.glob('packed/bridgegz-*.txt'))
          raw=''.join(Path(f).read_text() for f in files)
          src=gzip.decompress(base64.b64decode(''.join(raw.split()))).decode('utf-8','replace')
          print('BRIDGE_SOURCE_LENGTH',len(src))
          needles=['invoices:', 'preview:', 'download:', 'preview(', 'download(', 'window.open', 'createObjectURL', 'pdf', 'boleto', 'bank_ticket_url']
          for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),src,re.I)]
              print('\n===',needle,'count',len(positions),'===')
              for pos in positions[:15]:
                  print(src[max(0,pos-700):min(len(src),pos+1200)].replace('\n',' '))
                  print('---')
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-boleto-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-boleto-bridge.yml
          git commit -m 'Remove auditor temporario da ponte do boleto' || true
          git push origin HEAD:cloudflare-provedor-plus
