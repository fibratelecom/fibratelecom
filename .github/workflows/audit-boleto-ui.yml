name: Auditar boleto no modelo antigo
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-boleto-ui.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Auditar pacote antigo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob,base64,gzip,re
          files=sorted(glob.glob('packed/appgz-*.txt'))
          raw=''.join(Path(f).read_text() for f in files)
          packed=base64.b64decode(''.join(raw.split()))
          src=gzip.decompress(packed).decode('utf-8','replace')
          print('APP_SOURCE_LENGTH',len(src))
          needles=['bank_ticket_url','bank_pdf_url','boleto_pdf_url','pdf_url','invoice_pdf_url','bank_slip_pdf_url','digitable_line','linha_digitavel','Visualizar','Download','Baixar','boleto']
          for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),src,re.I)]
              print('\n===',needle,'count',len(positions),'===')
              for pos in positions[:12]:
                  print(src[max(0,pos-450):min(len(src),pos+800)].replace('\n',' '))
                  print('---')
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-boleto-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-boleto-ui.yml
          git commit -m 'Remove auditor temporario do boleto' || true
          git push origin HEAD:cloudflare-provedor-plus
