name: Audit Client Flow
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/audit-client-flow.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Auditar bundle atual
        shell: bash
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          node --check /tmp/app.js
          node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('/tmp/app.js','utf8');
          const needles=['[`Clientes`','clients.save','savePppoe','Cadastrar cliente','Novo cliente','pppoe_password','mikrotik_profile'];
          for(const needle of needles){
            console.log('\n### '+needle);
            let i=0,count=0;
            while((i=s.indexOf(needle,i))>=0&&count<8){console.log(s.slice(Math.max(0,i-900),Math.min(s.length,i+1800)));i+=needle.length;count++}
            console.log('COUNT',count);
          }
          NODE