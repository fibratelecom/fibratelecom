name: Auditar fluxo atual da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-customer-portal-flow.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Auditar funções exatas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('worker.js').read_text()
          def function_block(name):
              token=f'function {name}'
              pos=src.find(token)
              if pos<0:
                  token=f'async function {name}'
                  pos=src.find(token)
              if pos<0:
                  print(f'=== {name}: NAO ENCONTRADA ===')
                  return
              start=src.find('{',pos)
              depth=0
              quote=None
              esc=False
              i=start
              while i<len(src):
                  ch=src[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              print(f'=== {name} ===')
                              print(src[pos:i+1])
                              return
                  i+=1
              print(f'=== {name}: BLOCO INCOMPLETO ===')
          for name in ['mapInvoice','sameClient','nativePortalLogin','handleCustomerPortal','portalSnapshot']:
              function_block(name)
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-customer-portal-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-customer-portal-flow.yml
          git commit -m 'Remove auditor temporario da Area do Cliente' || true
          git push origin HEAD:cloudflare-provedor-plus
