name: Auditar histórico da Área do Cliente existente
on:
  push:
    branches: [fix/status-cliente-visual-unico]
    paths: ['.github/workflows/audit-customer-ui-history.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-cliente-visual-unico
          fetch-depth: 0
      - name: Procurar tela no histórico completo
        shell: bash
        run: |
          git fetch --all --prune
          python3 - <<'PY'
          import subprocess
          phrases=['Verificando sua conexão','Verificar minha conexão','Problemas na região','Verificação real pelo Provedor Plus','Aguardando dados da conexão']
          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          print('COMMITS',len(commits))
          found=set()
          for sha in commits:
              for phrase in phrases:
                  key=(sha,phrase)
                  if key in found: continue
                  p=subprocess.run(['git','grep','-Il','-F',phrase,sha,'--',':(exclude).github/workflows/*'],text=True,capture_output=True)
                  if p.returncode==0 and p.stdout.strip():
                      print('\nMATCH',phrase,'COMMIT',sha)
                      print('FILES',p.stdout.strip())
                      try:
                          print(subprocess.check_output(['git','show','-s','--format=%h %ad %s','--date=iso',sha],text=True).strip())
                      except: pass
                      found.add(key)
          if not found: print('NO_HISTORY_MATCH')
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-customer-ui-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-customer-ui-history.yml
          git commit -m 'Remove auditor temporario do historico da Area do Cliente' || true
          git push origin HEAD:fix/status-cliente-visual-unico
