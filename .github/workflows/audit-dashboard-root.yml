name: Audit Dashboard Root
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/audit-dashboard-root.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Localizar Dashboard antigo no bundle
        shell: bash
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          node --check /tmp/app.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/app.js','utf8');
          for(const needle of ['Visão geral','Dashboard','Visao geral']){
            let from=0,count=0;
            while(true){const i=s.indexOf(needle,from);if(i<0)break;count++;console.log(`--- ${needle} #${count} @${i} ---`);console.log(s.slice(Math.max(0,i-650),Math.min(s.length,i+950)));from=i+needle.length;}
            console.log(`COUNT ${needle}: ${count}`);
          }
          NODE
      - name: Remover auditoria temporária
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-dashboard-root.yml
          git commit -m 'Remove auditoria temporária do Dashboard'
          git push origin HEAD:cloudflare-provedor-plus
