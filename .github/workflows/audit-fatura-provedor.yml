name: Audit Provedor Plus Fatura
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/audit-fatura-provedor.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
          fetch-depth: 0
      - name: Reconstruir pacotes e validar sintaxe
        run: |
          set -euo pipefail
          git fetch origin main
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
          node --check /tmp/proxy.js
          node --check bootstrap.js
          node --check dashboard-transition-guard.js
          node --check staff-access.js
          node --check ticket-enhancements.js
          node --check billing-bank-selector.js
          node --check billing-action-ui.js
          node --check bank-enabled-persistence.js
          node --check api/cloud-state.js
          node --check api/automation.js
          node --check lib/automation-handler.js
          node --check lib/automation-overlay.js
          node --check lib/cloud-data-handler.js
          node --check lib/github-actions-oidc.js
      - name: Testar fatura em cenários simulados
        run: |
          set -euo pipefail
          cat > /tmp/test-invoice.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const bridge=fs.readFileSync('/tmp/bridge.js','utf8');
          const start=bridge.indexOf('  function safeInvoiceUrl');
          const end=bridge.indexOf('  const SECURE_DB',start);
          if(start<0||end<0)throw new Error('Bloco da fatura não encontrado.');
          const block=bridge.slice(start,end)+'\nthis.invoiceHtml=invoiceHtml;this.itfBarcodeSvg=itfBarcodeSvg;';
          const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          let state={settings:{company_name:'Fibra+',document:'12.345.678/0001-90',phone:'(11) 3333-4444',email:'financeiro@fibra.test'}};
          const ctx={URL,Intl,Date,console,location:{origin:'https://fibratelecom.vercel.app'},htmlEscape:escape,load:()=>state,inv:i=>i};
          vm.createContext(ctx);vm.runInContext(block,ctx);
          const base={id:50,client_id:7,client_name:'JOÃO DA SILVA',client_document:'123.456.789-00',client_contract_number:'CTR-2026-000007',client_plan:'Fibra 600 Mega',client_street:'Rua das Flores',client_address_number:'120',client_neighborhood:'Centro',client_city:'Manaus',client_state:'AM',client_cep:'69000-000',due_date:'2026-09-10',amount_cents:11900,status:'Pendente',document_type:'Boleto',billing_type:'Mensalidade'};
          const barcode='00193373700000001000500940144816060680935031';
          if(barcode.length!==44)throw new Error('Fixture bancária inválida.');
          let html=ctx.invoiceHtml({...base,bank_provider:'mercadoPago',bank_digitable_line:'00190.00009 01234.567890 12345.678901 1 99990000011900',bank_barcode:barcode,bank_pdf_url:'https://bank.example/boleto.pdf',bank_charge_id:'MP-123'});
          for(const expected of ['CTR-2026-000007','123.456.789-00','Fibra 600 Mega','(92) 98486-7428','Linha digitável oficial','bank.example/boleto.pdf','bank-barcode-svg','/assets/fibra-plus-logo.webp'])if(!html.includes(expected))throw new Error('Boleto sem '+expected);
          if(/TV PLUS|TELEFONE FIXO/i.test(html))throw new Error('Fatura incluiu serviço não permitido.');
          if(!html.includes('R$ 119,00')&&!html.includes('R$ 119,00'))throw new Error('Valor não renderizado.');
          html=ctx.invoiceHtml({...base,document_type:'Pix',billing_type:'Pix com vencimento',bank_provider:'efi',bank_pix_code:'00020101021226890014br.gov.bcb.pix...',bank_charge_id:'PIX-123'});
          if(!html.includes('PIX')||!html.includes('00020101021226890014br.gov.bcb.pix...'))throw new Error('Pix oficial não renderizado.');
          html=ctx.invoiceHtml({...base,bank_provider:'',bank_barcode:'',bank_digitable_line:'',bank_pdf_url:'',bank_ticket_url:''});
          if(!html.includes('A linha digitável aparecerá aqui'))throw new Error('Fallback sem banco ausente.');
          if(html.includes('03399.')||html.includes('23793.'))throw new Error('Fatura inventou linha bancária.');
          html=ctx.invoiceHtml({...base,amount_cents:11305,cashback_discount_cents:595,bank_provider:'mercadoPago'});
          if(!html.includes('Benefício por pontualidade')||!html.includes('Cashback Pix'))throw new Error('Campo de cashback futuro não renderizado.');
          if(!ctx.itfBarcodeSvg(barcode).includes('<svg')||ctx.itfBarcodeSvg('123').includes('<svg'))throw new Error('Validação do código de barras falhou.');
          console.log('INVOICE_SCENARIOS_OK');
          NODE
          node /tmp/test-invoice.cjs
      - name: Confirmar integração sem duplicidade financeira
        run: |
          set -euo pipefail
          test "$(grep -o 'function invoiceHtml(i)' /tmp/bridge.js | wc -l)" -eq 1
          test "$(grep -o 'async function previewInvoiceWeb(i)' /tmp/bridge.js | wc -l)" -eq 1
          test "$(grep -o 'async function downloadInvoiceWeb(i)' /tmp/bridge.js | wc -l)" -eq 1
          grep -q 'invoices:{list:async' /tmp/bridge.js
          grep -q 'save:saveInvoiceWeb' /tmp/bridge.js
          grep -q 'generateInstallments:installmentsWeb' /tmp/bridge.js
          grep -q 'preview:previewInvoiceWeb' /tmp/bridge.js
          grep -q 'download:downloadInvoiceWeb' /tmp/bridge.js
          grep -q 'attachRemote(x,remote)' /tmp/bridge.js
          grep -q 'bank_digitable_line' /tmp/proxy.js
          grep -q 'bank_barcode' /tmp/proxy.js
          grep -q 'bank_pix_code' /tmp/proxy.js
          ! grep -q "if(url){open(url,'_blank'" /tmp/bridge.js
          ! grep -q 'client-area' /tmp/bridge.js
      - name: Confirmar que app, proxy e telas corrigidas não foram alterados pela fatura
        run: |
          set -euo pipefail
          git diff --quiet origin/main...HEAD -- 'packed/appgz-*'
          git diff --quiet origin/main...HEAD -- 'packed/proxygz-*'
          grep -q 'aside.sidebar nav\[aria-label="Menu principal"\]' dashboard-transition-guard.js
          ! grep -q 'characterData' dashboard-transition-guard.js
          grep -q 'aside.sidebar nav\[aria-label="Menu principal"\]' staff-access.js
          grep -q 'aside.sidebar nav\[aria-label="Menu principal"\]' ticket-enhancements.js
          grep -q 'pp-startup-shell' index.html
          grep -q 'refreshBillingClient' billing-bank-selector.js
          grep -q 'automation_ack_clients' api/cloud-state.js
          grep -q "text(autoRecord.automation_reason)==='overdue_7d'" lib/automation-handler.js
          grep -q 'BANK_BATCH_SIZE=8' lib/automation-handler.js
          grep -q 'ACCESS_BATCH_SIZE=4' lib/automation-handler.js
          node -e "const v=require('./vercel.json');if(v.crons)process.exit(1);if(v.functions?.['api/automation.js']?.maxDuration!==60)process.exit(1)"
      - name: Validar logo e escopo
        run: |
          set -euo pipefail
          test -s assets/fibra-plus-logo.webp
          test "$(stat -c%s assets/fibra-plus-logo.webp)" -gt 5000
          head -c 4 assets/fibra-plus-logo.webp | grep -q 'RIFF'
          grep -q '/assets/fibra-plus-logo.webp' /tmp/bridge.js
          echo FATURA_AUDIT_OK
