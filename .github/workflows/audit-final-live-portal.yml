name: Validar portal publicado após correções
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-final-live-portal.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Validar login real sem expor dados pessoais
        shell: bash
        run: |
          curl -sS --max-time 25 -D /tmp/h.txt \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -X POST 'https://painel.fibramais.workers.dev/api/customer-portal' \
            -H 'Origin: https://client.fibramais.workers.dev' \
            -H 'Referer: https://client.fibramais.workers.dev/' \
            -H 'Content-Type: application/json' \
            --data '{"action":"login","data":{"contract":"CTR-2026-000004"}}' \
            -o /tmp/b.json -w 'HTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}\n'
          grep -iE '^(access-control-allow-origin|x-provedor-plus-edge|content-type):' /tmp/h.txt || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/b.json').read_text(errors='replace')
          try: body=json.loads(raw)
          except Exception:
              print('JSON_VALID',False); print('RAW_PREFIX',repr(raw[:80])); raise SystemExit(1)
          print('JSON_VALID',True,'OK',body.get('ok'))
          if not body.get('ok'):
              print('ERROR',body.get('error')); raise SystemExit(1)
          d=body.get('data') or {}; c=d.get('client') or {}; inv=d.get('invoices') if isinstance(d.get('invoices'),list) else []; cur=d.get('invoice') or {}
          print('SESSION_PRESENT',bool(d.get('session')))
          print('CLIENT_ID',c.get('id'))
          print('DOCUMENT_LAST4',''.join(ch for ch in str(c.get('document') or '') if ch.isdigit())[-4:])
          print('INVOICE_COUNT',len(inv))
          print('CURRENT_INVOICE_ID',cur.get('id'))
          print('CURRENT_STATUS',cur.get('status'))
          print('BANK_PROVIDER',cur.get('bankProvider'))
          print('BANK_STATUS',cur.get('bankStatus'))
          print('TICKET_URL_PRESENT',bool(cur.get('ticketUrl')))
          print('PDF_URL_PRESENT',bool(cur.get('pdfUrl')))
          print('DIGITABLE_LINE_PRESENT',bool(cur.get('digitableLine')))
          print('BARCODE_PRESENT',bool(cur.get('barcode')))
          print('PLANS_COUNT',len(d.get('plans') or []))
          print('PROTOCOLS_COUNT',len(d.get('protocols') or []))
          print('NEGOTIATIONS_COUNT',len(d.get('negotiations') or []))
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-final-live-portal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-final-live-portal.yml
          git commit -m 'Remove auditor temporario final do portal' || true
          git push origin HEAD:cloudflare-provedor-plus
