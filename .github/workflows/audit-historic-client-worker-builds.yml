name: Auditar builds históricos do Worker cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-historic-client-worker-builds.yml']
permissions:
  contents: write
  checks: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Procurar check-runs históricos do client
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,time
          repo='fibratelecom/fibratelecom'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          matches=[]; commits=[]
          for page in range(1,9):
              arr=get(f'https://api.github.com/repos/{repo}/commits?per_page=100&page={page}')
              if not arr: break
              commits.extend(arr)
          print('COMMITS_SCANNED',len(commits))
          for i,c in enumerate(commits,1):
              sha=c['sha']
              try:data=get(f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100')
              except Exception as e:
                  print('CHECK_ERROR',sha,str(e));continue
              for run in data.get('check_runs',[]):
                  name=(run.get('name') or '').lower();summary=((run.get('output') or {}).get('summary') or '')
                  details=run.get('details_url') or ''
                  hay=' '.join([name,summary.lower(),details.lower()])
                  if 'workers builds:' in hay and any(k in hay for k in ['cliente','client']):
                      matches.append({
                          'sha':sha,'date':c['commit']['committer']['date'],'message':c['commit']['message'].splitlines()[0],
                          'name':run.get('name'),'status':run.get('status'),'conclusion':run.get('conclusion'),'external_id':run.get('external_id'),'details_url':details,'summary':summary
                      })
              if i%100==0: print('SCANNED',i)
          print('MATCH_COUNT',len(matches))
          for m in matches:
              print('MATCH',json.dumps(m,ensure_ascii=False))
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-historic-client-worker-builds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-historic-client-worker-builds.yml
          git commit -m 'Remove auditor temporario dos builds do cliente' || true
          git push origin HEAD:cloudflare-provedor-plus
