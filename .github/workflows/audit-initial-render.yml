name: Audit Initial Render
on: push
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar primeira renderizacao
        shell: bash
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          node --check /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text()
          for n in ['function se(','function A(){','e===`Clientes`','clients.map','clients.filter','function k(','function O(']:
              print('\n###',n)
              start=0;c=0
              while True:
                  i=s.find(n,start)
                  if i<0 or c>=8: break
                  print('INDEX',i)
                  print(s[max(0,i-1800):min(len(s),i+7000)])
                  start=i+1;c+=1
          PY
