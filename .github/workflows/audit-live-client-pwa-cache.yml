name: Auditar PWA e cache do client ao vivo
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-live-client-pwa-cache.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Verificar rotas PWA do client
        shell: bash
        run: |
          set -u
          for path in / /index.html /sw.js /service-worker.js /serviceworker.js /manifest.json /manifest.webmanifest /favicon.ico /app.js /main.js /assets/manifest.json; do
            echo "=== $path ==="
            curl -sS -i --max-time 15 "https://client.fibramais.workers.dev$path" | sed -n '1,80p' || true
            echo
          done
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-client-pwa-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-client-pwa-cache.yml
          git commit -m 'Remove auditor temporario do PWA client' || true
          git push origin HEAD:cloudflare-provedor-plus
