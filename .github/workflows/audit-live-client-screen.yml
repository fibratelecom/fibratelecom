name: Auditar origem da tela atual do cliente
on:
  push:
    branches: [fix/status-cliente-visual-unico]
    paths: ['.github/workflows/audit-live-client-screen.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-cliente-visual-unico
      - name: Localizar tela e login
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob,base64,gzip,re
          needles=['Sua internet Fibra+','na palma da sua mão','Conectando','Acessar com','Esqueci meus dados','Instalar Cliente Fibra+','customer-portal','portal-login','login']
          print('=== ARQUIVOS TEXTO ===')
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.parts[:1]==('packed',): continue
              try:s=p.read_text(errors='ignore')
              except:continue
              hits=[n for n in needles if n.lower() in s.lower()]
              if hits:
                  print('\nFILE',p,'HITS',hits)
                  for n in hits:
                      pos=s.lower().find(n.lower())
                      print(s[max(0,pos-800):min(len(s),pos+2200)].replace('\n',' '))
                      print('---')
          files=sorted(glob.glob('packed/appgz-*.txt'))
          if files:
              raw=''.join(Path(f).read_text() for f in files)
              try:src=gzip.decompress(base64.b64decode(''.join(raw.split()))).decode('utf-8','replace')
              except Exception as e:
                  print('PACK_ERROR',e);src=''
              print('\n=== PACKED APP ===',len(src))
              for n in needles:
                  positions=[m.start() for m in re.finditer(re.escape(n),src,re.I)]
                  print('\nNEEDLE',n,'COUNT',len(positions))
                  for pos in positions[:8]:
                      print(src[max(0,pos-1200):min(len(src),pos+3200)].replace('\n',' '))
                      print('---')
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-client-screen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-client-screen.yml
          git commit -m 'Remove auditor temporario da tela do cliente' || true
          git push origin HEAD:fix/status-cliente-visual-unico
