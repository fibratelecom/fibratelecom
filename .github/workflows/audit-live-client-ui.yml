name: Auditar frontend atual da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-live-client-ui.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Ler HTML e scripts publicados do client
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://client.fibramais.workers.dev'
          curl -fsSL --max-time 30 "$BASE/" -o /tmp/client-root.html
          echo '=== ROOT MATCHES ==='
          grep -nE -C 6 'Verificando sua conexão|Verificar minha conexão|Diagnóstico da conexão|Última conexão|lastConnection|connection-test|diagnostic|customer-portal' /tmp/client-root.html || true
          python3 - <<'PY' > /tmp/scripts.txt
          import re
          from pathlib import Path
          html=Path('/tmp/client-root.html').read_text(errors='ignore')
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',html,re.I):
              print(src)
          PY
          echo '=== SCRIPTS ==='
          cat /tmp/scripts.txt
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="$BASE$src" ;;
              *) url="$BASE/$src" ;;
            esac
            echo "=== SCRIPT $url ==="
            curl -fsSL --max-time 30 "$url" -o /tmp/client-script.js || continue
            grep -nE -C 8 'Verificando sua conexão|Verificar minha conexão|Diagnóstico da conexão|Última conexão|lastConnection|connection-test|test-connection|connection-status|diagnostic|customer-portal' /tmp/client-script.js || true
          done < /tmp/scripts.txt
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-client-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-client-ui.yml
          git commit -m 'Remove auditor temporario do frontend cliente' || true
          git push origin HEAD:cloudflare-provedor-plus
