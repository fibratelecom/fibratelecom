name: Validar cliente real após correção do estado
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-live-client3-after-state-fix.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Testar portal publicado sem expor dados pessoais
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://painel.fibramais.workers.dev/api/customer-portal'
          payload=json.dumps({'action':'login','data':{'contract':'CTR-2026-000004'}}).encode()
          req=urllib.request.Request(url,data=payload,method='POST',headers={'Origin':'https://client.fibramais.workers.dev','Content-Type':'application/json'})
          start=time.time()
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  status=r.status; headers=dict(r.headers); raw=r.read().decode('utf-8','replace')
          except urllib.error.HTTPError as e:
              status=e.code; headers=dict(e.headers); raw=e.read().decode('utf-8','replace')
          print('HTTP_STATUS',status)
          print('ELAPSED_SECONDS',round(time.time()-start,3))
          print('ALLOW_ORIGIN',headers.get('Access-Control-Allow-Origin'))
          try: body=json.loads(raw)
          except Exception:
              print('JSON_VALID',False); print('RAW_PREFIX',repr(raw[:80])); raise SystemExit(1)
          print('JSON_VALID',True)
          print('OK',body.get('ok'))
          if not body.get('ok'):
              print('ERROR',body.get('error')); raise SystemExit(1)
          data=body.get('data') or {}; client=data.get('client') or {}; invoices=data.get('invoices') if isinstance(data.get('invoices'),list) else []
          current=data.get('invoice') or {}
          print('SESSION_PRESENT',bool(data.get('session')))
          print('CLIENT_ID',client.get('id'))
          print('CLIENT_DOCUMENT_LAST4',''.join(ch for ch in str(client.get('document') or '') if ch.isdigit())[-4:])
          print('INVOICE_COUNT',len(invoices))
          print('CURRENT_INVOICE_ID',current.get('id'))
          print('CURRENT_STATUS',current.get('status'))
          print('CURRENT_BANK_PROVIDER',current.get('bankProvider'))
          print('CURRENT_BANK_STATUS',current.get('bankStatus'))
          print('TICKET_URL_PRESENT',bool(current.get('ticketUrl')))
          print('PDF_URL_PRESENT',bool(current.get('pdfUrl')))
          print('DIGITABLE_LINE_PRESENT',bool(current.get('digitableLine')))
          print('BARCODE_PRESENT',bool(current.get('barcode')))
          print('PLANS_COUNT',len(data.get('plans') or []))
          print('PROTOCOLS_COUNT',len(data.get('protocols') or []))
          print('NEGOTIATIONS_COUNT',len(data.get('negotiations') or []))
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-client3-after-state-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-client3-after-state-fix.yml
          git commit -m 'Remove auditor temporario apos correcao do portal' || true
          git push origin HEAD:cloudflare-provedor-plus
