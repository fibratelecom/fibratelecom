name: Validar portal real com requisição de navegador
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-live-client3-browser-curl.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Testar cliente real e resumir resposta
        shell: bash
        run: |
          curl -sS --max-time 25 -D /tmp/headers.txt \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -X POST 'https://painel.fibramais.workers.dev/api/customer-portal' \
            -H 'Origin: https://client.fibramais.workers.dev' \
            -H 'Referer: https://client.fibramais.workers.dev/' \
            -H 'Content-Type: application/json' \
            --data '{"action":"login","data":{"contract":"CTR-2026-000004"}}' \
            -o /tmp/body.json \
            -w 'HTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}\n'
          grep -iE '^(access-control-allow-origin|x-provedor-plus-edge|content-type):' /tmp/headers.txt || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/body.json').read_text(errors='replace')
          try: body=json.loads(raw)
          except Exception:
              print('JSON_VALID',False); print('RAW_PREFIX',repr(raw[:80])); raise SystemExit(1)
          print('JSON_VALID',True,'OK',body.get('ok'))
          if not body.get('ok'):
              print('ERROR',body.get('error')); raise SystemExit(1)
          data=body.get('data') or {}; client=data.get('client') or {}; invoices=data.get('invoices') if isinstance(data.get('invoices'),list) else []; current=data.get('invoice') or {}
          print('SESSION_PRESENT',bool(data.get('session')))
          print('CLIENT_ID',client.get('id'))
          print('DOCUMENT_LAST4',''.join(ch for ch in str(client.get('document') or '') if ch.isdigit())[-4:])
          print('INVOICE_COUNT',len(invoices))
          print('CURRENT_INVOICE_ID',current.get('id'))
          print('CURRENT_STATUS',current.get('status'))
          print('BANK_PROVIDER',current.get('bankProvider'))
          print('BANK_STATUS',current.get('bankStatus'))
          print('TICKET_URL_PRESENT',bool(current.get('ticketUrl')))
          print('PDF_URL_PRESENT',bool(current.get('pdfUrl')))
          print('DIGITABLE_LINE_PRESENT',bool(current.get('digitableLine')))
          print('BARCODE_PRESENT',bool(current.get('barcode')))
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-client3-browser-curl.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-client3-browser-curl.yml
          git commit -m 'Remove auditor temporario do portal navegador' || true
          git push origin HEAD:cloudflare-provedor-plus
