name: Auditar conexão real publicada da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-live-customer-connection.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Testar login e diagnóstico real
        shell: bash
        run: |
          set -euo pipefail
          API='https://painel.fibramais.workers.dev/api/customer-portal'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -sS --max-time 30 -A "$UA" -X POST "$API" \
            -H 'Origin: https://client.fibramais.workers.dev' \
            -H 'Referer: https://client.fibramais.workers.dev/' \
            -H 'Content-Type: application/json' \
            --data '{"action":"login","data":{"contract":"CTR-2026-000004"}}' \
            -o /tmp/login.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('/tmp/login.json').read_text())
          print('LOGIN_OK',bool(b.get('ok')))
          if not b.get('ok'):
              print('LOGIN_ERROR',b.get('error')); raise SystemExit(1)
          d=b.get('data') or {}
          print('SESSION_PRESENT',bool(d.get('session')))
          print('CLIENT_ID',(d.get('client') or {}).get('id'))
          Path('/tmp/session.txt').write_text(str(d.get('session') or ''))
          if not d.get('session'): raise SystemExit('Sessão não retornada')
          PY
          SESSION="$(cat /tmp/session.txt)"
          python3 - <<'PY' > /tmp/diag-payload.json
          import json
          from pathlib import Path
          print(json.dumps({'action':'connection-test','data':{'session':Path('/tmp/session.txt').read_text()}}))
          PY
          curl -sS --max-time 40 -D /tmp/headers.txt -A "$UA" -X POST "$API" \
            -H 'Origin: https://client.fibramais.workers.dev' \
            -H 'Referer: https://client.fibramais.workers.dev/' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/diag-payload.json \
            -o /tmp/diag.json \
            -w 'HTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}\n'
          grep -iE '^(access-control-allow-origin|x-provedor-plus-edge|content-type):' /tmp/headers.txt || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('/tmp/diag.json').read_text())
          print('DIAG_API_OK',bool(b.get('ok')))
          if not b.get('ok'):
              print('DIAG_API_ERROR',b.get('error')); raise SystemExit(1)
          d=b.get('data') or {}; c=d.get('connection') or {}; x=d.get('diagnostic') or {}
          print('SOURCE',c.get('source'))
          print('STATUS',c.get('status'))
          print('ONLINE',c.get('online'))
          ip=str(c.get('ip') or '')
          print('IP_PRESENT',bool(ip and ip!='Aguardando dados'))
          print('UPTIME',c.get('uptime') or '')
          print('DOWNLOAD_BPS',c.get('downloadBps'))
          print('UPLOAD_BPS',c.get('uploadBps'))
          print('LIVE_RATES_AVAILABLE',c.get('liveRatesAvailable'))
          print('LATENCY_MS',c.get('latencyMs'))
          print('PACKET_LOSS',c.get('packetLoss'))
          print('QUALITY',c.get('quality'))
          print('LAST_CONNECTION_LABEL',c.get('lastConnectionLabel') or '')
          print('CONNECTION_ERROR',c.get('connectionError') or '')
          print('DIAGNOSTIC_OK',x.get('ok'))
          print('DIAGNOSTIC_STATUS',x.get('status'))
          print('DIAGNOSTIC_MESSAGE',x.get('message') or '')
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-live-customer-connection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-live-customer-connection.yml
          git commit -m 'Remove auditor temporario da conexao do cliente' || true
          git push origin HEAD:cloudflare-provedor-plus
