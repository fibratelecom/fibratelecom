name: Confirmar 403 do login real do portal
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-panel-403-body.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Ler corpo bruto sem dados pessoais
        shell: bash
        run: |
          curl -sS -i --max-time 20 -X POST 'https://painel.fibramais.workers.dev/api/customer-portal' \
            -H 'Origin: https://client.fibramais.workers.dev' \
            -H 'Content-Type: application/json' \
            --data '{"action":"login","data":{"contract":"CTR-2026-000004"}}' | sed -n '1,80p'
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-panel-403-body.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-panel-403-body.yml
          git commit -m 'Remove auditor temporario do 403 do portal' || true
          git push origin HEAD:cloudflare-provedor-plus
