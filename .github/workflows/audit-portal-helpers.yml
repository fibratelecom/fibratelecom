name: Auditar auxiliares do portal atual
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-portal-helpers.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Auditar auxiliares
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('worker.js').read_text()
          for needle in ['mapInvoice','sameClient','Conectando','customer-portal']:
              print('\n===',needle,'===')
              start=0
              found=0
              while True:
                  pos=src.find(needle,start)
                  if pos<0: break
                  found+=1
                  print(src[max(0,pos-1400):min(len(src),pos+3000)])
                  print('\n---')
                  start=pos+len(needle)
                  if found>=6: break
              print('COUNT_SHOWN',found)
          print('\n=== REPO FILES WITH CONECTANDO / CUSTOMER-PORTAL ===')
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try:s=p.read_text(errors='ignore')
              except:continue
              if 'Conectando' in s or 'customer-portal' in s:
                  print(p)
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-portal-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-portal-helpers.yml
          git commit -m 'Remove auditor temporario dos auxiliares do portal' || true
          git push origin HEAD:cloudflare-provedor-plus
