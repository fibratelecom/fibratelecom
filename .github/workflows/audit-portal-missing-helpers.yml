name: Confirmar helpers ausentes da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-portal-missing-helpers.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Conferir símbolos do portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('worker.js').read_text()
          names=['sameClient','mapInvoice','mapPlan','invoiceCents','formatMoney','formatDate','portalClientData','safeNegotiation','portalSession']
          for name in names:
              refs=len(re.findall(r'\b'+re.escape(name)+r'\b',src))
              defs=[]
              for pat in [rf'function\s+{name}\b',rf'async\s+function\s+{name}\b',rf'(?:const|let|var)\s+{name}\s*=',rf'{name}\s*=\s*']:
                  defs.extend(m.start() for m in re.finditer(pat,src))
              print(name,'refs=',refs,'defs=',len(set(defs)))
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-portal-missing-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-portal-missing-helpers.yml
          git commit -m 'Remove auditor temporario de helpers do portal' || true
          git push origin HEAD:cloudflare-provedor-plus
