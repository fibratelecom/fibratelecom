name: Audit React Boot State
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-react-boot-state.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar estado e efeito de abertura
        shell: bash
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          node --check /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text()
          for needle in ['function A(){','async function Se(){','useEffect)(()=>{Se()}']:
              i=s.find(needle)
              print('\n===', needle, i, '===')
              if i>=0: print(s[max(0,i-1200):min(len(s),i+5000)])
          PY
