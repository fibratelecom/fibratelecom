name: Auditar caminho 1042 após cliente válido
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/audit-valid-client-1042-path.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Mapear fluxo do portal e fetches internos
        shell: bash
        run: |
          echo '=== REFERENCIAS DO PORTAL ==='
          grep -nE 'nativePortal|handleCustomerPortal|portalSnapshot|customer-portal|portalClientById|sameClient|fetch\(' worker.js || true
          echo
          echo '=== FUNCOES AO REDOR DO LOGIN ==='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          for needle in ['nativePortalLogin','handleCustomerPortal','portalSnapshot(','portalClientById(','fetch(']:
              print('\n###',needle)
              start=0
              shown=0
              while True:
                  p=s.find(needle,start)
                  if p<0: break
                  print(s[max(0,p-1800):min(len(s),p+4200)])
                  print('\n---')
                  start=p+len(needle); shown+=1
                  if shown>=12: break
          PY
      - name: Remover auditor temporário
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/audit-valid-client-1042-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-valid-client-1042-path.yml
          git commit -m 'Remove auditor temporario do caminho 1042' || true
          git push origin HEAD:cloudflare-provedor-plus
