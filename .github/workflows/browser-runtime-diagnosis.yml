name: Browser Runtime Diagnosis
on: push
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar painel publicado no Chrome
        shell: bash
        run: |
          set -euo pipefail
          echo 'Chrome:'
          which google-chrome || which chromium || which chromium-browser || true
          google-chrome --version || true
          timeout 35s google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --enable-logging=stderr \
            --v=0 \
            --virtual-time-budget=20000 \
            --dump-dom \
            'https://painel.fibramais.workers.dev/?ppdiag=runtime1' \
            > /tmp/dom.txt 2> /tmp/chrome.txt || true
          echo '=== DOM INICIO ==='
          head -c 12000 /tmp/dom.txt || true
          echo
          echo '=== ERROS CHROME ==='
          grep -Ei 'error|uncaught|exception|failed|TypeError|ReferenceError|RangeError|SyntaxError|ERR_' /tmp/chrome.txt | tail -200 || true
          echo '=== CHROME FINAL ==='
          tail -120 /tmp/chrome.txt || true
