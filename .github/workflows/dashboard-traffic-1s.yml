name: Dashboard Traffic 1s
'on':
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/dashboard-traffic-1s.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Ajustar intervalo do trafego
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('dashboard-enhancements.js')
          s=p.read_text()
          old="setInterval(()=>{const active=Boolean(layer?.isConnected&&contentRoot()?.classList.contains('pp-dashboard-root-active'));if(!active){stopRouterPolling();return}void loadRouterStatus()},5000)"
          new="setInterval(()=>{const active=Boolean(layer?.isConnected&&contentRoot()?.classList.contains('pp-dashboard-root-active'));if(!active){stopRouterPolling();return}void loadRouterStatus()},1000)"
          if old not in s:
              raise SystemExit('intervalo de 5 segundos nao encontrado')
          s=s.replace(old,new,1)
          s=s.replace('atualização a cada 5 segundos.','atualização a cada 1 segundo.',1)
          s=s.replace("CSS_VERSION='20260831-dashboard-mikrotik1'","CSS_VERSION='20260831-dashboard-mikrotik2'",1)
          p.write_text(s)

          p=Path('bootstrap.js')
          b=p.read_text()
          b=b.replace("const BUILD_TOKEN='20260831-dashboard-mikrotik1'","const BUILD_TOKEN='20260831-dashboard-mikrotik2'",1)
          b=b.replace('/dashboard-enhancements.js?v=20260831-dashboard-mikrotik1','/dashboard-enhancements.js?v=20260831-dashboard-mikrotik2',1)
          p.write_text(b)

          p=Path('index.html')
          h=p.read_text()
          h=h.replace('/bootstrap.js?v=20260831-dashboard-mikrotik1','/bootstrap.js?v=20260831-dashboard-mikrotik2',1)
          p.write_text(h)
          PY
          node --check dashboard-enhancements.js
          node --check bootstrap.js
          grep -q "},1000)" dashboard-enhancements.js
          grep -q "atualização a cada 1 segundo" dashboard-enhancements.js
          grep -q "20260831-dashboard-mikrotik2" bootstrap.js
          grep -q "20260831-dashboard-mikrotik2" index.html
      - name: Publicar e remover aplicador
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-enhancements.js bootstrap.js index.html
          git commit -m 'Atualiza trafego MikroTik a cada 1 segundo'
          git rm .github/workflows/dashboard-traffic-1s.yml
          git commit -m 'Remove aplicador temporario do trafego 1s'
          git push origin HEAD:cloudflare-provedor-plus