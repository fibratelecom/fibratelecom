name: diagnose-ui-js
on:
  push:
    paths:
      - '.github/workflows/diagnose-ui-js.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply stability correction
        run: python .github/scripts/fix-base-ui-stability.py
      - name: Validate correction
        run: |
          node --check bootstrap.js
          grep -q "const BUILD_TOKEN='20260831-uiatomic5'" bootstrap.js
          grep -q "baseUiDeadline=Date.now()+8000" bootstrap.js
          grep -q "Date.now()-baseUiStableSince>=700" bootstrap.js
          grep -q "dashboard-transition-guard.js?v=20260831-uiatomic5" bootstrap.js
          grep -q "dashboard-enhancements.js?v=20260831-uiatomic5" bootstrap.js
          grep -q "bootstrap.js?v=20260831-uiatomic5" index.html
      - name: Commit correction
        run: |
          git add bootstrap.js index.html
          git commit -m 'Aguarda interface base estabilizar antes dos módulos atuais'
          git push origin HEAD:cloudflare-provedor-plus
      - name: Remove temporary diagnostics
        run: |
          git pull --rebase origin cloudflare-provedor-plus
          git rm .github/scripts/fix-base-ui-stability.py .github/workflows/diagnose-ui-js.yml
          git commit -m 'Remove diagnóstico temporário da montagem inicial'
          git push origin HEAD:cloudflare-provedor-plus
