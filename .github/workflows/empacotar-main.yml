name: Empacotar main

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - .github/workflows/empacotar-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Baixar desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento
          path: meta

      - name: Gerar pacote da main
        run: |
          mkdir -p /tmp/pacote
          tar --exclude=.git --exclude=.github -C source -czf /tmp/pacote/fibratelecom-main.tar.gz .

      - name: Guardar pacote temporario na branch desenvolvimento
        run: |
          mkdir -p meta/deploy
          cp /tmp/pacote/fibratelecom-main.tar.gz meta/deploy/fibratelecom-main.tar.gz
          cd meta
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fibratelecom-main.tar.gz
          if git diff --cached --quiet; then
            echo "Pacote sem alteracoes."
          else
            git commit -m "Atualiza pacote temporario da main"
            git push origin HEAD:desenvolvimento
          fi

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: fibratelecom-main
          path: /tmp/pacote/fibratelecom-main.tar.gz
          if-no-files-found: error
          retention-days: 1
