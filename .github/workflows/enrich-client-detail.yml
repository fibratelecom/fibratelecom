name: enrich-client-detail
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/enrich-client-detail.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Completar ficha do cliente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard-transition-guard.js')
          text=p.read_text(encoding='utf-8')
          css_anchor=".ppc-detail-section.full{grid-column:1/-1}"
          css_extra=r'''
    .ppc-detail-modern{width:min(1020px,calc(100vw - 28px))}.ppc-client-live-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.ppc-client-live-box{padding:10px;border:1px solid #e6efec;border-radius:10px;background:#f9fcfb}.ppc-client-live-box small{display:block;color:#869691;font-size:8px}.ppc-client-live-box strong{display:block;margin-top:5px;color:#2f544b;font-size:10px;overflow-wrap:anywhere}.ppc-client-live-state{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#f1f5f4;color:#6c7e79;font-size:8px;font-weight:850}.ppc-client-live-state.online{background:#e8f7f1;color:#08735d}.ppc-client-live-state.offline{background:#fff0ed;color:#a84c3c}.ppc-client-toolrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.ppc-client-toolrow .ppc-action{height:33px}.ppc-client-toolrow .ppc-action:disabled{opacity:.48;cursor:not-allowed}.ppc-bills-wrap{overflow:auto;border:1px solid #e5eeeb;border-radius:10px}.ppc-bills-table{width:100%;min-width:720px;border-collapse:collapse}.ppc-bills-table th{padding:8px 9px;background:#f8fbfa;color:#81918d;font-size:7.5px;text-align:left}.ppc-bills-table td{padding:9px;border-top:1px solid #edf2f0;color:#49635d;font-size:8.5px;vertical-align:middle}.ppc-bills-table input[type=date]{height:31px;padding:0 7px;border:1px solid #d5e3df;border-radius:7px;color:#405853;font-size:8.5px}.ppc-bills-actions{display:flex;gap:5px;white-space:nowrap}.ppc-bills-actions button,.ppc-bills-actions a{display:inline-flex;align-items:center;justify-content:center;height:29px;padding:0 8px;border:1px solid #d5e3df;border-radius:7px;background:#fff;color:#49635d;text-decoration:none;font:800 8px Segoe UI,Arial;cursor:pointer}.ppc-bills-actions .primary{border-color:#c8e4dd;background:#edf8f5;color:#087866}.ppc-bills-empty{padding:16px;color:#7e8f8a;font-size:9px;text-align:center}.ppc-edit-card{width:min(900px,calc(100vw - 28px))}.ppc-edit-section-title{grid-column:1/-1;margin-top:4px;padding:9px 0 3px;border-top:1px solid #edf2f0;color:#25705f;font-size:9px;font-weight:900;letter-spacing:.04em}.ppc-edit-section-title:first-child{margin-top:0;border-top:0}.ppc-edit-help{grid-column:1/-1;margin:-2px 0 2px;color:#7d8f8a;font-size:8px}.ppc-edit-grid label.full{grid-column:1/-1}
          '''
          if 'ppc-client-live-grid' not in text:
              if css_anchor not in text: raise SystemExit('âncora CSS da ficha não encontrada')
              text=text.replace(css_anchor,css_anchor+css_extra,1)

          start=text.find('  function closeClientDetails()')
          end=text.find('  function drawClientRows()',start)
          if start<0 or end<0: raise SystemExit('bloco da ficha/edição do cliente não encontrado')
          new=r'''  const clientNum=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const clientFmtBytes=v=>{let n=Math.max(0,clientNum(v)),i=0,u=['B','KB','MB','GB','TB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${new Intl.NumberFormat('pt-BR',{maximumFractionDigits:i<2?0:1}).format(n)} ${u[i]}`};
  const clientFmtRate=v=>{let n=Math.max(0,clientNum(v)),i=0,u=['bps','Kbps','Mbps','Gbps'];while(n>=1000&&i<u.length-1){n/=1000;i++}return `${new Intl.NumberFormat('pt-BR',{maximumFractionDigits:i<2?0:1}).format(n)} ${u[i]}`};
  const clientFmtMoney=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Math.max(0,clientNum(v))/100);
  const clientFmtDate=v=>{const raw=String(v||'').slice(0,10),m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—'};
  const clientInvoiceId=i=>Number(i?.id??i?.invoice_id??i?.invoiceId)||0;
  const clientInvoiceOwner=i=>Number(i?.client_id??i?.clientId??i?.customer_id)||0;
  const clientInvoiceStatus=i=>String(i?.status||'Pendente').trim()||'Pendente';
  const clientInvoiceUrl=i=>{for(const k of ['pdf_url','pdfUrl','boleto_pdf_url','boletoPdfUrl','boleto_url','boletoUrl','bank_slip_url','bankSlipUrl','payment_url','paymentUrl','external_url','externalUrl','url']){const v=String(i?.[k]||'').trim();if(/^https?:\/\//i.test(v))return v}return''};
  function clientRemoteUrl(c,status={}){let host=String(c?.device_ip||'').trim();if(!host)return'';if(/^https?:\/\//i.test(host))return host;const port=Math.max(1,Math.min(65535,Number(c?.device_port)||80)),proto=port===443?'https':'http';return `${proto}://${host}${(proto==='http'&&port===80)||(proto==='https'&&port===443)?'':`:${port}`}`}
  function closeClientDetails(){document.querySelector('.ppc-detail-layer')?.remove()}
  async function refreshClientLive(d,c){const host=d.querySelector('[data-client-live]');if(!host)return;host.innerHTML='<div class="ppc-bills-empty">Consultando sessão PPPoE e consumo no MikroTik...</div>';try{const s=await api()?.clients?.status?.(Number(c?.id));if(!host.isConnected)return;const current=s?.traffic?.current||{},online=s?.connectionState==='online'||s?.online===true,remote=clientRemoteUrl(c,s);host.innerHTML=`<div class="ppc-client-live-grid"><div class="ppc-client-live-box"><small>CONEXÃO</small><strong><span class="ppc-client-live-state ${online?'online':'offline'}">${online?'Online':'Offline'}</span></strong></div><div class="ppc-client-live-box"><small>IP DA SESSÃO</small><strong>${esc(s?.ip||c?.ip||'—')}</strong></div><div class="ppc-client-live-box"><small>TEMPO CONECTADO</small><strong>${esc(s?.uptime||'—')}</strong></div><div class="ppc-client-live-box"><small>PROFILE</small><strong>${esc(s?.profile||c?.mikrotik_profile||'—')}</strong></div><div class="ppc-client-live-box"><small>DOWNLOAD AGORA</small><strong>${clientFmtRate(s?.downloadBps)}</strong></div><div class="ppc-client-live-box"><small>UPLOAD AGORA</small><strong>${clientFmtRate(s?.uploadBps)}</strong></div><div class="ppc-client-live-box"><small>DOWNLOAD NO MÊS</small><strong>${clientFmtBytes(current?.download_bytes)}</strong></div><div class="ppc-client-live-box"><small>UPLOAD NO MÊS</small><strong>${clientFmtBytes(current?.upload_bytes)}</strong></div><div class="ppc-client-live-box"><small>VLAN / PORTA</small><strong>${esc(s?.vlanId?`VLAN ${s.vlanId} · ${s?.accessPort||'—'}`:(s?.accessPort||'—'))}</strong></div><div class="ppc-client-live-box"><small>MAC / CALLER ID</small><strong>${esc(s?.callerId||c?.mac_address||'—')}</strong></div><div class="ppc-client-live-box"><small>ROTEADOR / ONU</small><strong>${esc(c?.device_ip||'—')}</strong></div><div class="ppc-client-live-box"><small>PORTA REMOTA</small><strong>${esc(c?.device_port||'—')}</strong></div></div><div class="ppc-client-toolrow"><button type="button" class="ppc-action primary" data-client-remote ${remote?'':'disabled'}>Acesso remoto</button><button type="button" class="ppc-action" data-client-live-refresh>↻ Atualizar conexão</button></div>`;host.querySelector('[data-client-remote]')?.addEventListener('click',()=>{if(remote)window.open(remote,'_blank','noopener,noreferrer')});host.querySelector('[data-client-live-refresh]')?.addEventListener('click',()=>refreshClientLive(d,c))}catch(err){host.innerHTML=`<div class="ppc-message error">Não foi possível consultar o consumo agora: ${esc(err?.message||err)}</div><div class="ppc-client-toolrow"><button type="button" class="ppc-action" data-client-live-refresh>↻ Tentar novamente</button></div>`;host.querySelector('[data-client-live-refresh]')?.addEventListener('click',()=>refreshClientLive(d,c))}}
  async function refreshClientBills(d,c){const host=d.querySelector('[data-client-bills]');if(!host)return;host.innerHTML='<div class="ppc-bills-empty">Carregando boletos deste cliente...</div>';try{const rows=await api()?.invoices?.list?.(),items=(Array.isArray(rows)?rows:[]).filter(x=>clientInvoiceOwner(x)===Number(c?.id)).sort((a,b)=>String(b?.due_date||'').localeCompare(String(a?.due_date||''))).slice(0,24);if(!items.length){host.innerHTML='<div class="ppc-bills-empty">Nenhum boleto encontrado para este cliente.</div>';return}host.innerHTML=`<div class="ppc-bills-wrap"><table class="ppc-bills-table"><thead><tr><th>VENCIMENTO</th><th>VALOR</th><th>STATUS</th><th>TIPO</th><th>ALTERAR VENCIMENTO</th><th>AÇÕES</th></tr></thead><tbody>${items.map(i=>{const id=clientInvoiceId(i),url=clientInvoiceUrl(i),due=String(i?.due_date||'').slice(0,10);return `<tr data-invoice-row="${id}"><td>${clientFmtDate(due)}</td><td>${clientFmtMoney(i?.amount_cents??i?.value_cents??0)}</td><td>${esc(clientInvoiceStatus(i))}</td><td>${esc(i?.billing_type||i?.document_type||'Boleto')}</td><td><input type="date" value="${esc(due)}" data-invoice-due="${id}"> <button type="button" class="ppc-action" data-invoice-save="${id}">Salvar</button></td><td><div class="ppc-bills-actions">${url?`<a class="primary" href="${esc(url)}" target="_blank" rel="noopener">Visualizar</a><a href="${esc(url)}" target="_blank" rel="noopener" download>Download</a>`:'<span>Sem link bancário</span>'}</div></td></tr>`}).join('')}</tbody></table></div>`;host.querySelectorAll('[data-invoice-save]').forEach(btn=>btn.onclick=async()=>{const id=Number(btn.dataset.invoiceSave),invoice=items.find(x=>clientInvoiceId(x)===id),input=host.querySelector(`[data-invoice-due="${id}"]`),due=String(input?.value||'');if(!invoice||!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('Informe uma data de vencimento válida.');btn.disabled=true;btn.textContent='Salvando...';try{await api().invoices.save({...invoice,due_date:due});await refreshClientBills(d,c)}catch(err){btn.disabled=false;btn.textContent='Salvar';alert(err?.message||String(err))}})}catch(err){host.innerHTML=`<div class="ppc-message error">Não foi possível carregar os boletos: ${esc(err?.message||err)}</div>`}}
  function openClientDetails(c){closeClientDetails();const d=document.createElement('div');d.className='ppc-detail-layer';d.innerHTML=`<section class="ppc-detail ppc-detail-modern"><div class="ppc-detail-hero"><span class="ppc-detail-avatar">${esc(clientInitials(c))}</span><div class="ppc-detail-id"><h2>${esc(c?.name||'Cliente')}</h2><p>${esc(c?.contract_number?`Contrato ${c.contract_number}`:'Cadastro sem número de contrato')} · ${esc(c?.document||'Documento não informado')}</p></div><span class="ppc-status ${statusKind(c?.status)}">${esc(clientStatusLabel(c))}</span><div class="ppc-detail-actions"><button type="button" class="ppc-action primary" data-detail-edit>Editar</button><button type="button" class="ppc-detail-close">×</button></div></div><div class="ppc-detail-body"><section class="ppc-detail-section"><h3>Dados do cliente</h3><div class="ppc-detail-list"><div class="ppc-detail-item"><small>CPF / CNPJ</small><strong>${esc(c?.document||'—')}</strong></div><div class="ppc-detail-item"><small>Telefone</small><strong>${esc(c?.phone||c?.whatsapp||'—')}</strong></div><div class="ppc-detail-item"><small>WhatsApp</small><strong>${esc(c?.whatsapp||c?.phone||'—')}</strong></div><div class="ppc-detail-item"><small>E-mail</small><strong>${esc(c?.email||'—')}</strong></div></div></section><section class="ppc-detail-section"><h3>Contrato e cobrança</h3><div class="ppc-detail-list"><div class="ppc-detail-item"><small>Contrato</small><strong>${esc(c?.contract_number||'—')}</strong></div><div class="ppc-detail-item"><small>Plano</small><strong>${esc(planName(c))}</strong></div><div class="ppc-detail-item"><small>Vencimento padrão</small><strong>${c?.due_day?`Dia ${esc(c.due_day)}`:'—'}</strong></div><div class="ppc-detail-item"><small>Status</small><strong>${esc(clientStatusLabel(c))}</strong></div></div></section><section class="ppc-detail-section"><h3>Conexão</h3><div class="ppc-detail-list"><div class="ppc-detail-item"><small>Tipo</small><strong>${esc(c?.connection_type||'Sem integração')}</strong></div><div class="ppc-detail-item"><small>MikroTik</small><strong>${esc(routerName(c))}</strong></div><div class="ppc-detail-item"><small>Usuário PPPoE</small><strong>${esc(c?.pppoe_username||c?.pppoe_user||'—')}</strong></div><div class="ppc-detail-item"><small>Profile</small><strong>${esc(c?.mikrotik_profile||'—')}</strong></div><div class="ppc-detail-item"><small>IP configurado</small><strong>${esc(c?.ip||'—')}</strong></div></div></section><section class="ppc-detail-section"><h3>Endereço</h3><div class="ppc-detail-list"><div class="ppc-detail-item"><small>Endereço</small><strong>${esc(clientAddress(c))}</strong></div><div class="ppc-detail-item"><small>CEP</small><strong>${esc(c?.cep||c?.zip_code||'—')}</strong></div><div class="ppc-detail-item"><small>Referência</small><strong>${esc(c?.address_reference||'—')}</strong></div><div class="ppc-detail-item"><small>MAC / Caller ID</small><strong>${esc(c?.mac_address||'—')}</strong></div></div></section><section class="ppc-detail-section full"><h3>Conexão em tempo real, consumo e acesso remoto</h3><div data-client-live></div></section><section class="ppc-detail-section full"><h3>Boletos do cliente</h3><div data-client-bills></div></section></div></section>`;d.querySelector('.ppc-detail-close').onclick=()=>d.remove();d.querySelector('[data-detail-edit]').onclick=()=>{d.remove();openClientEdit(c)};d.addEventListener('mousedown',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);void refreshClientLive(d,c);void refreshClientBills(d,c)}
  async function openClientEdit(c){document.querySelector('.ppc-edit-layer')?.remove();const d=document.createElement('div');d.className='ppc-edit-layer';const statuses=['Ativo','Em atraso','Bloqueado','Suspenso'];if(c?.status&&!statuses.some(x=>norm(x)===norm(c.status)))statuses.push(String(c.status));const planOptions=clientData.plans.filter(p=>p?.active!==0&&p?.active!==false).map(p=>`<option value="${Number(p.id)||0}">${esc(p.name||'Plano')}${p.speed?` · ${esc(p.speed)}`:''}</option>`).join(''),routerOptions=clientData.routers.map(r=>`<option value="${Number(r?.id)||0}">${esc(r?.name||'MikroTik')}</option>`).join('');d.innerHTML=`<section class="ppc-edit-card"><div class="ppc-edit-head"><div><h2>Editar cliente</h2><p>${esc(c?.contract_number?`Contrato ${c.contract_number}`:'Atualização cadastral')} · cadastro, cobrança e PPPoE podem ser atualizados nesta tela.</p></div><button type="button" class="ppc-detail-close">×</button></div><form class="ppc-edit-form"><div class="ppc-edit-grid"><div class="ppc-edit-section-title">DADOS DO CLIENTE E COBRANÇA</div><label class="full">Nome / Razão social<input name="name" required value="${esc(c?.name||'')}"></label><label>Nome fantasia<input name="trade_name" value="${esc(c?.trade_name||'')}"></label><label>CPF / CNPJ<input name="document" value="${esc(c?.document||'')}"></label><label>Telefone<input name="phone" value="${esc(c?.phone||'')}"></label><label>WhatsApp<input name="whatsapp" value="${esc(c?.whatsapp||'')}"></label><label class="full">E-mail<input name="email" type="email" value="${esc(c?.email||'')}"></label><label>Plano<select name="plan_id"><option value="">Sem plano</option>${planOptions}</select></label><label>Dia do vencimento padrão<input name="due_day" type="number" min="1" max="31" value="${esc(c?.due_day||'10')}"></label><label>Status<select name="status">${statuses.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><div class="ppc-edit-section-title">PPPoE E MIKROTIK</div><div class="ppc-edit-help">Ao alterar estes dados, o acesso PPPoE será sincronizado com o MikroTik selecionado.</div><label>Tipo de conexão<select name="connection_type"><option value="PPPoE">PPPoE</option><option value="">Sem integração</option></select></label><label>MikroTik<select name="router_id"><option value="">Selecione o MikroTik</option>${routerOptions}</select></label><label>Usuário PPPoE<input name="pppoe_username" value="${esc(c?.pppoe_username||c?.pppoe_user||'')}"></label><label>Senha PPPoE<input name="pppoe_password" type="password" placeholder="Deixe em branco para manter a atual"></label><label>Profile<select name="mikrotik_profile"><option value="">Carregando profiles...</option></select></label><label>IP fixo / remoto<input name="ip" value="${esc(c?.ip||'')}"></label><label>MAC / Caller ID<input name="mac_address" value="${esc(c?.mac_address||'')}"></label><div class="ppc-edit-section-title">ACESSO REMOTO DO EQUIPAMENTO</div><label>IP do roteador / ONU<input name="device_ip" value="${esc(c?.device_ip||'')}"></label><label>Porta remota<input name="device_port" type="number" min="1" max="65535" value="${esc(c?.device_port||80)}"></label></div><div class="ppc-edit-note">O vencimento acima define o padrão das próximas cobranças. O vencimento de um boleto já emitido pode ser alterado individualmente na ficha “Visualizar”.</div><div class="ppc-edit-actions"><button type="button" class="ppc-button" data-edit-cancel>Cancelar</button><button type="submit" class="ppc-button primary">Salvar alterações</button></div></form></section>`;const form=d.querySelector('form');form.elements.plan_id.value=String(Number(c?.plan_id)||'');form.elements.status.value=statuses.find(x=>norm(x)===norm(c?.status))||'Ativo';form.elements.connection_type.value=String(c?.connection_type||'PPPoE')==='PPPoE'?'PPPoE':'';form.elements.router_id.value=String(Number(c?.router_id)||'');const syncProfiles=async()=>{const current=String(c?.mikrotik_profile||'');if(form.elements.connection_type.value==='PPPoE'&&Number(form.elements.router_id.value)){await loadProfiles(Number(form.elements.router_id.value),form.elements.mikrotik_profile);if(current&&[...form.elements.mikrotik_profile.options].some(o=>o.value===current))form.elements.mikrotik_profile.value=current}else form.elements.mikrotik_profile.innerHTML='<option value="">Sem integração</option>'};form.elements.router_id.onchange=()=>loadProfiles(Number(form.elements.router_id.value),form.elements.mikrotik_profile);form.elements.connection_type.onchange=()=>{toggleConnectionFields(form);void syncProfiles()};toggleConnectionFields(form);void syncProfiles();d.querySelector('.ppc-detail-close').onclick=()=>d.remove();d.querySelector('[data-edit-cancel]').onclick=()=>d.remove();d.addEventListener('mousedown',e=>{if(e.target===d)d.remove()});form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('[type="submit"]');submit.disabled=true;submit.textContent='Salvando...';try{const fd=new FormData(form),planId=Number(fd.get('plan_id'))||null,plan=clientData.plans.find(p=>Number(p?.id)===planId),routerId=Number(fd.get('router_id'))||null,newPass=String(fd.get('pppoe_password')||'').trim(),payload={...c,name:String(fd.get('name')||'').trim(),trade_name:String(fd.get('trade_name')||'').trim(),document:String(fd.get('document')||'').trim(),phone:String(fd.get('phone')||'').trim(),whatsapp:String(fd.get('whatsapp')||'').trim(),email:String(fd.get('email')||'').trim(),plan_id:planId,plan:plan?.name||'',plan_name:plan?.name||'',due_day:Number(fd.get('due_day'))||10,status:String(fd.get('status')||'Ativo'),connection_type:String(fd.get('connection_type')||''),router_id:routerId,pppoe_username:String(fd.get('pppoe_username')||'').trim(),pppoe_password:newPass||String(c?.pppoe_password||''),mikrotik_profile:String(fd.get('mikrotik_profile')||'').trim(),ip:String(fd.get('ip')||'').trim(),mac_address:String(fd.get('mac_address')||'').trim(),device_ip:String(fd.get('device_ip')||'').trim(),device_port:Number(fd.get('device_port'))||80};const oldRouter=Number(c?.router_id)||0,oldUser=String(c?.pppoe_username||c?.pppoe_user||'').trim(),newUser=payload.pppoe_username,networkChanged=payload.connection_type==='PPPoE'&&(oldRouter!==Number(routerId)||oldUser!==newUser||newPass||String(c?.mikrotik_profile||'')!==payload.mikrotik_profile||String(c?.ip||'')!==payload.ip||String(c?.mac_address||'')!==payload.mac_address||String(c?.status||'')!==payload.status);if(payload.connection_type==='PPPoE'){if(!routerId)throw new Error('Selecione o MikroTik responsável.');if(!newUser)throw new Error('Informe o usuário PPPoE.');if(networkChanged)await api().mikrotik.savePppoe(routerId,payload)}const saved=await api().clients.save(payload);if(networkChanged&&oldRouter&&oldUser&&(oldRouter!==Number(routerId)||oldUser!==newUser)){try{await api().mikrotik.deletePppoe(oldRouter,{...c,pppoe_username:oldUser})}catch(err){console.warn('Provedor Plus: o novo PPPoE foi salvo, mas o acesso antigo não pôde ser removido.',err)}}const index=clientData.clients.findIndex(x=>Number(x?.id)===Number(saved?.id));if(index>=0)clientData.clients[index]=saved;d.remove();await renderClientConsult(`Cliente ${saved?.name||c?.name||''} atualizado com sucesso.`)}catch(err){submit.disabled=false;submit.textContent='Salvar alterações';alert(err?.message||String(err))}};document.body.appendChild(d)}
'''
          text=text[:start]+new+text[end:]
          p.write_text(text,encoding='utf-8')
          wf=Path('.github/workflows/enrich-client-detail.yml')
          if wf.exists(): wf.unlink()
          PY
          node --check dashboard-transition-guard.js
          grep -q 'Conexão em tempo real, consumo e acesso remoto' dashboard-transition-guard.js
          grep -q 'Boletos do cliente' dashboard-transition-guard.js
          grep -q 'PPPoE E MIKROTIK' dashboard-transition-guard.js
          grep -q 'data-invoice-save' dashboard-transition-guard.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js .github/workflows/enrich-client-detail.yml
          git commit -m 'Completa ficha, PPPoE, consumo e boletos do cliente'
          git push origin HEAD:cloudflare-provedor-plus
