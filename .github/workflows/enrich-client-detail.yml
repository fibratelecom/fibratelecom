name: enrich-client-detail
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/enrich-client-detail.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Aplicar e validar ficha completa do cliente
        shell: bash
        run: |
          python .github/scripts/enrich-client-detail.py
          node --check dashboard-transition-guard.js
          grep -q 'Conexão em tempo real, consumo e acesso remoto' dashboard-transition-guard.js
          grep -q 'Boletos do cliente' dashboard-transition-guard.js
          grep -q 'PPPoE E MIKROTIK' dashboard-transition-guard.js
          grep -q 'data-invoice-save' dashboard-transition-guard.js
          grep -q 'api().clients.openRouter' dashboard-transition-guard.js
          rm -f .github/scripts/enrich-client-detail.py .github/workflows/enrich-client-detail.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js .github/scripts/enrich-client-detail.py .github/workflows/enrich-client-detail.yml
          git commit -m 'Completa ficha, PPPoE, consumo, acesso remoto e boletos do cliente'
          git push origin HEAD:cloudflare-provedor-plus
