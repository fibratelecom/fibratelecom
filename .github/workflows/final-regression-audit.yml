name: Final Regression Audit

on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/final-regression-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
          fetch-depth: 0
      - name: Rebuild packed sources
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          test -s /tmp/app.js && test -s /tmp/bridge.js
      - name: Syntax
        run: |
          set -euo pipefail
          for f in api/automation.js api/cloud-state.js bank-enabled-persistence.js billing-action-ui.js billing-bank-selector.js bootstrap.js cloud-client-store-v2.js dashboard-transition-guard.js lib/automation-handler.js lib/automation-overlay.js lib/cloud-data-handler.js lib/github-actions-oidc.js; do node --check "$f"; done
          node --check /tmp/app.js
          node --check /tmp/bridge.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Duplication and transition protections
        run: |
          set -euo pipefail
          grep -q 'aside.sidebar nav\[aria-label="Menu principal"\]' dashboard-transition-guard.js
          ! grep -q '\.sidebar nav button,nav button' dashboard-transition-guard.js
          ! grep -q 'characterData' dashboard-transition-guard.js
          grep -q 'pp-ticket-layer' dashboard-transition-guard.js
          grep -q 'pp-dashboard-v2' dashboard-transition-guard.js
          grep -q '.pp-ticket-layer{position:absolute;inset:0' ticket-enhancements.css
          grep -q '.pp-staff-layer{position:absolute;inset:0' staff-access.css
          grep -q '.pp-dashboard-host>:not(.pp-dashboard-v2){display:none!important}' dashboard-enhancements.css
          test ! -e client-status-stable-view.css
          test ! -e client-status-transition-fix.js
      - name: F5 and billing protections
        run: |
          set -euo pipefail
          grep -q 'pp-startup-shell' index.html
          grep -q 'finishStartup' bootstrap.js
          grep -q "input.name!=='enabled'" bank-enabled-persistence.js
          grep -q 'form.requestSubmit' bank-enabled-persistence.js
          grep -q 'readyBanks' billing-bank-selector.js
          grep -q 'api?.clients?.list' billing-bank-selector.js
          grep -q 'pp-bill-action-button' billing-action-ui.js
          grep -q 'automation.bank.save' /tmp/bridge.js
          grep -q 'ProvedorPlusSyncAutomationBankVault' /tmp/bridge.js
          ! grep -q 'slice(0,100)' /tmp/bridge.js
      - name: Automatic and manual access-state protections
        run: |
          set -euo pipefail
          grep -q 'AUTO_BLOCK_DAYS=7' lib/automation-handler.js
          grep -q "mikrotikAction('client.block'" lib/automation-handler.js
          grep -q "mikrotikAction('client.unblock'" lib/automation-handler.js
          grep -q 'paidClientIds' lib/automation-handler.js
          grep -q 'automation_ack_clients' api/cloud-state.js
          grep -q 'clientAcks.has(String(id))' api/cloud-state.js
          grep -q "writeState(state,\[Number(remote.id)\])" cloud-client-store-v2.js
          grep -q 'writeState(state,\[id\])' cloud-client-store-v2.js
          grep -q 'return save({...client,status:statusAfterEnable(state,id)' cloud-client-store-v2.js
          grep -q "cloudCall('client.unblock'" cloud-adapter.js
          grep -q 'base.clients.trustRelease(id,hours)' cloud-adapter.js
          grep -q 'applyAutomationOverlay' api/cloud-state.js
          grep -q 'pruneAcknowledged' api/cloud-state.js
      - name: Scheduler and scope
        run: |
          set -euo pipefail
          ! grep -q '"crons"' vercel.json
          grep -q "cron: '2-59/5 \* \* \* \*'" .github/workflows/provedor-plus-automation.yml
          grep -q 'id-token: write' .github/workflows/provedor-plus-automation.yml
          grep -q 'provedor-plus-automation.yml@refs/heads/main' lib/github-actions-oidc.js
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          ! grep -Eq '^packed/appgz-' /tmp/changed.txt
          ! grep -Eq '^packed/proxygz-' /tmp/changed.txt
          ! grep -Eq '^client-status-(enhancements|layout-cleanup|loader-cover)' /tmp/changed.txt
          echo FINAL_AUDIT_OK
