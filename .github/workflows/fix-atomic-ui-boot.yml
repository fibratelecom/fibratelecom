name: fix-atomic-ui-boot
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/fix-atomic-ui-boot.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Apply patch
        run: python3 .github/scripts/fix-atomic-ui-boot.py
      - name: Validate files
        run: |
          node --check bootstrap.js
          node --check dashboard-transition-guard.js
          node --check dashboard-enhancements.js
          grep -q pp-atomic-ui-mounting bootstrap.js
          grep -q data-pp-client-hub bootstrap.js
          grep -q data-pp-integration-hub bootstrap.js
          grep -q data-pp-dashboard-root bootstrap.js
          ! grep -q 'fibratelecom.vercel.app\|SPECIALIZED_UPSTREAM' worker.js
          ! git diff --name-only | grep '^packed/appgz-'
      - name: Commit correction
        run: |
          git add bootstrap.js dashboard-transition-guard.js dashboard-enhancements.js index.html
          git commit -m 'Corrige montagem duplicada da interface na abertura'
          git push origin HEAD:cloudflare-provedor-plus
      - name: Remove temporary files
        run: |
          git pull --rebase origin cloudflare-provedor-plus
          git rm .github/scripts/fix-atomic-ui-boot.py .github/workflows/fix-atomic-ui-boot.yml
          git commit -m 'Remove aplicador temporario da montagem da interface'
          git push origin HEAD:cloudflare-provedor-plus
