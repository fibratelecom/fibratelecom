name: Fix Bank Enabled Switches

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bank switches in packed application
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          files=[Path(f'packed/appgz-{i:02d}.txt') for i in range(1,34)]
          pieces=[''.join(p.read_text().split()) for p in files]
          original_lengths=[len(x) for x in pieces]
          raw=gzip.decompress(base64.b64decode(''.join(pieces)))
          text=raw.decode('utf-8')

          old_efi='(0,p.jsx)(`input`,{name:`enabled`,type:`checkbox`,defaultChecked:Boolean(l.enabled)})'
          new_efi='(0,p.jsx)(`input`,{name:`enabled`,type:`checkbox`,checked:Boolean(l.enabled),onChange:n=>{const i=n.currentTarget.checked,d=new FormData(n.currentTarget.form);t({...e,efi:{...l,enabled:i}});void c(()=>g().banks.saveEfi({enabled:i,environment:String(d.get(`environment`)||`sandbox`),clientId:String(d.get(`client_id`)||``),clientSecret:String(d.get(`client_secret`)||``),certificatePassword:String(d.get(`certificate_password`)||``),pixKey:String(d.get(`pix_key`)||``),pixAutoReceiverAgency:String(d.get(`pix_auto_agency`)||``),pixAutoReceiverAccount:String(d.get(`pix_auto_account`)||``),webhookUrl:String(d.get(`webhook_url`)||``)}),i?`Efí Bank ativada.`:`Efí Bank desativada.`)}})'
          old_mp='(0,p.jsx)(`input`,{name:`enabled`,type:`checkbox`,defaultChecked:Boolean(u.enabled)})'
          new_mp='(0,p.jsx)(`input`,{name:`enabled`,type:`checkbox`,checked:Boolean(u.enabled),onChange:n=>{const i=n.currentTarget.checked,d=new FormData(n.currentTarget.form);t({...e,mercadoPago:{...u,enabled:i}});void c(()=>g().banks.saveMercadoPago({enabled:i,environment:String(d.get(`environment`)||`sandbox`),publicKey:String(d.get(`public_key`)||``),accessToken:String(d.get(`access_token`)||``)}),i?`Mercado Pago ativado.`:`Mercado Pago desativado.`)}})'

          if text.count(old_efi)!=1:
              if new_efi not in text: raise SystemExit(f'Efí switch pattern count={text.count(old_efi)}')
          else:
              text=text.replace(old_efi,new_efi,1)
          if text.count(old_mp)!=1:
              if new_mp not in text: raise SystemExit(f'Mercado Pago switch pattern count={text.count(old_mp)}')
          else:
              text=text.replace(old_mp,new_mp,1)

          Path('/tmp/app-patched.js').write_text(text)
          packed=base64.b64encode(gzip.compress(text.encode('utf-8'),compresslevel=9,mtime=0)).decode('ascii')
          pos=0
          for idx,p in enumerate(files):
              if idx<len(files)-1:
                  size=original_lengths[idx]
                  chunk=packed[pos:pos+size]
                  pos+=size
              else:
                  chunk=packed[pos:]
              p.write_text(chunk+'\n')
          if pos>len(packed): raise SystemExit('Invalid packed split')
          PY
          node --check /tmp/app-patched.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-verify.js
          node --check /tmp/app-verify.js
          grep -Fq 'checked:Boolean(l.enabled),onChange:' /tmp/app-verify.js
          grep -Fq 'Efí Bank ativada.' /tmp/app-verify.js
          grep -Fq 'checked:Boolean(u.enabled),onChange:' /tmp/app-verify.js
          grep -Fq 'Mercado Pago ativado.' /tmp/app-verify.js
      - name: Commit packed application correction
        run: |
          set -euo pipefail
          if git diff --quiet -- packed/appgz-*.txt; then
            echo 'Bank switch correction already applied.'
            exit 0
          fi
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add packed/appgz-*.txt
          git commit -m 'Persiste ativação da Efí e Mercado Pago'
          git push origin HEAD:fix/global-navigation-duplication
