name: Fix Bank Mask Runtime
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-bank-mask-runtime.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Corrigir máscara e validar runtime básico
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard-transition-guard.js')
          s=p.read_text()
          marker="  let hubButton=null,popup=null,layer=null,timer=null,navObserver=null;"
          if "const MASK='••••••••••';" not in s:
              if marker not in s: raise SystemExit('Ponto da máscara não localizado')
              s=s.replace(marker,"  const MASK='••••••••••';\n"+marker,1)
          p.write_text(s)
          b=Path('bootstrap.js')
          x=b.read_text().replace("const BUILD_TOKEN='20260831-bankapi2';","const BUILD_TOKEN='20260831-bankapi3';",1).replace('/dashboard-transition-guard.js?v=20260831-bankapi2','/dashboard-transition-guard.js?v=20260831-bankapi3',1)
          b.write_text(x)
          i=Path('index.html')
          i.write_text(i.read_text().replace('/bootstrap.js?v=20260831-bankapi2','/bootstrap.js?v=20260831-bankapi3',1))
          PY
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          grep -F "const MASK='••••••••••';" dashboard-transition-guard.js
          grep -F "20260831-bankapi3" bootstrap.js index.html
      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-bank-mask-runtime.yml
          git add dashboard-transition-guard.js bootstrap.js index.html
          git commit -m 'Corrige máscara das credenciais bancárias salvas'
          git push origin HEAD:cloudflare-provedor-plus
