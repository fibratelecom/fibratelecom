name: "Corrigir exclusao das integracoes bancarias"
on:
  push:
    branches: [cloudflare-provedor-plus]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: "Corrigir persistencia e exclusao bancaria"
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: encontrado {count} vez(es), abortando')
              return s.replace(old,new,1)

          worker=Path('worker.js')
          s=worker.read_text(encoding='utf-8')
          s=one(s,"    clientId:text(data.clientId)||text(previous.clientId),","    clientId:data.clientId===undefined?text(previous.clientId):text(data.clientId),",'clientId Efí')
          s=one(s,"    clientSecret:text(data.clientSecret)||text(previous.clientSecret),","    clientSecret:data.clientSecret===undefined?text(previous.clientSecret):text(data.clientSecret),",'clientSecret Efí')
          s=one(s,"    accessToken:text(data.accessToken)||text(previous.accessToken),","    accessToken:data.accessToken===undefined?text(previous.accessToken):text(data.accessToken),",'accessToken Mercado Pago')
          s=one(s,
          "    }else if(action==='save-mercado-pago'){\n      const current=await readBankSettings(env),next={...current,mercadoPago:mergeMercadoPagoBank(current,data)};result=await writeBankSettings(env,next);\n    }else if(action==='save-default'){",
          "    }else if(action==='save-mercado-pago'){\n      const current=await readBankSettings(env),next={...current,mercadoPago:mergeMercadoPagoBank(current,data)};result=await writeBankSettings(env,next);\n    }else if(action==='delete-efi'){\n      const current=await readBankSettings(env),next={...current,efi:emptyBankSettings().efi};result=await writeBankSettings(env,next);\n    }else if(action==='delete-mercado-pago'){\n      const current=await readBankSettings(env),next={...current,mercadoPago:emptyBankSettings().mercadoPago};result=await writeBankSettings(env,next);\n    }else if(action==='save-default'){",
          'ações de exclusão bancária')
          worker.write_text(s,encoding='utf-8')

          ui=Path('dashboard-transition-guard.js')
          d=ui.read_text(encoding='utf-8')
          d=one(d,
          "  function statusClass(v){return v==='success'?'ok':v==='error'?'error':''}function statusText(v){return v?.lastTestStatus==='success'?'Conectado':v?.lastTestStatus==='error'?'Falha no teste':v?.enabled?'Configurado':'Desativado'}",
          "  function statusClass(v){return v==='success'?'ok':v==='error'?'error':''}function statusText(v){if(!v?.enabled)return'Desativado';if(v?.lastTestStatus==='success')return'Conectado';if(v?.lastTestStatus==='error')return'Falha no teste';const ready='clientIdConfigured'in v?Boolean(v.clientIdConfigured&&v.clientSecretConfigured&&v.certificateConfigured):'accessTokenConfigured'in v?Boolean(v.accessTokenConfigured):true;return ready?'Configurado':'Aguardando credenciais'}",
          'status bancário')
          d=one(d,
          "    const savedValue=value=>String(value||'')===MASK?'':String(value||'');",
          "    const credentialValue=input=>{if(!input)return undefined;if(input.dataset.saved==='1'&&input.value===MASK)return undefined;return String(input.value||'')};",
          'tratamento de credencial mascarada')
          d=one(d,
          "const ef=h.querySelector('#pp-efi');ef.elements.environment.value=efi.environment||'sandbox';const saveEfi=async(test)=>{const d=new FormData(ef),file=d.get('certificate'),payload={enabled:d.get('enabled')==='on',environment:String(d.get('environment')),clientId:savedValue(d.get('clientId')),clientSecret:savedValue(d.get('clientSecret')),certificatePassword:savedValue(d.get('certificatePassword')),pixKey:String(d.get('pixKey')||''),pixAutoReceiverAgency:String(d.get('agency')||''),pixAutoReceiverAccount:String(d.get('account')||''),webhookUrl:String(d.get('webhookUrl')||'')};if(file&&file.size){payload.certificateBase64=await fileBase64(file);payload.certificateName=file.name}await bankCall('save-efi',payload);if(test)await bankCall('test-efi');await renderBanks(test?'Efí salva e conexão testada.':'Configuração Efí salva.')};",
          "const ef=h.querySelector('#pp-efi');const efiDelete=document.createElement('button');efiDelete.type='button';efiDelete.textContent='Excluir configuração';ef.querySelector('.pp-bank-actions')?.appendChild(efiDelete);ef.elements.environment.value=efi.environment||'sandbox';const saveEfi=async(test)=>{const d=new FormData(ef),file=d.get('certificate'),payload={enabled:d.get('enabled')==='on',environment:String(d.get('environment')),pixKey:String(d.get('pixKey')||''),pixAutoReceiverAgency:String(d.get('agency')||''),pixAutoReceiverAccount:String(d.get('account')||''),webhookUrl:String(d.get('webhookUrl')||'')};for(const name of ['clientId','clientSecret','certificatePassword']){const value=credentialValue(ef.elements[name]);if(value!==undefined)payload[name]=value}if(file&&file.size){payload.certificateBase64=await fileBase64(file);payload.certificateName=file.name}await bankCall('save-efi',payload);if(test)await bankCall('test-efi');await renderBanks(test?'Efí salva e conexão testada.':'Configuração Efí salva.')};",
          'salvamento Efí')
          d=one(d,
          "ef.elements.webhook.onclick=async()=>{try{await saveEfi(false);await bankCall('configure-efi-webhooks');await renderBanks('Webhook Efí configurado.')}catch(x){await renderBanks(x.message,true)}};",
          "ef.elements.webhook.onclick=async()=>{try{await saveEfi(false);await bankCall('configure-efi-webhooks');await renderBanks('Webhook Efí configurado.')}catch(x){await renderBanks(x.message,true)}};efiDelete.onclick=async()=>{if(!confirm('Excluir toda a configuração da Efí Bank deste sistema?'))return;try{await bankCall('delete-efi');await renderBanks('Configuração Efí excluída.')}catch(x){await renderBanks(x.message,true)}};",
          'exclusão Efí')
          d=one(d,
          "const mf=h.querySelector('#pp-mp');mf.elements.environment.value=mp.environment||'sandbox';const saveMp=async(test)=>{const d=new FormData(mf);await bankCall('save-mercado-pago',{enabled:d.get('enabled')==='on',environment:String(d.get('environment')),publicKey:String(d.get('publicKey')||''),accessToken:savedValue(d.get('accessToken'))});if(test)await bankCall('test-mercado-pago');await renderBanks(test?'Mercado Pago salvo e conexão testada.':'Configuração Mercado Pago salva.')};",
          "const mf=h.querySelector('#pp-mp');const mpDelete=document.createElement('button');mpDelete.type='button';mpDelete.textContent='Excluir configuração';mf.querySelector('.pp-bank-actions')?.appendChild(mpDelete);mf.elements.environment.value=mp.environment||'sandbox';const saveMp=async(test)=>{const d=new FormData(mf),payload={enabled:d.get('enabled')==='on',environment:String(d.get('environment')),publicKey:String(d.get('publicKey')||'')},accessToken=credentialValue(mf.elements.accessToken);if(accessToken!==undefined)payload.accessToken=accessToken;await bankCall('save-mercado-pago',payload);if(test)await bankCall('test-mercado-pago');await renderBanks(test?'Mercado Pago salvo e conexão testada.':'Configuração Mercado Pago salva.')};",
          'salvamento Mercado Pago')
          d=one(d,
          "mf.onsubmit=e=>{e.preventDefault();saveMp(true).catch(x=>renderBanks(x.message,true))};mf.elements.save.onclick=()=>saveMp(false).catch(x=>renderBanks(x.message,true));",
          "mf.onsubmit=e=>{e.preventDefault();saveMp(true).catch(x=>renderBanks(x.message,true))};mf.elements.save.onclick=()=>saveMp(false).catch(x=>renderBanks(x.message,true));mpDelete.onclick=async()=>{if(!confirm('Excluir toda a configuração do Mercado Pago deste sistema?'))return;try{await bankCall('delete-mercado-pago');await renderBanks('Configuração Mercado Pago excluída.')}catch(x){await renderBanks(x.message,true)}};",
          'exclusão Mercado Pago')
          ui.write_text(d,encoding='utf-8')

          boot=Path('bootstrap.js')
          b=boot.read_text(encoding='utf-8')
          b=one(b,"await loadScript('/dashboard-transition-guard.js?v=20260831-uiatomic5');","await loadScript('/dashboard-transition-guard.js?v=20260901-bankdelete1');",'cache integração bancária')
          boot.write_text(b,encoding='utf-8')

          index=Path('index.html')
          i=index.read_text(encoding='utf-8')
          import re
          matches=re.findall(r'/bootstrap\.js\?v=[^\"\']+',i)
          if len(matches)!=1:
              raise SystemExit(f'cache bootstrap: encontrado {len(matches)} vez(es), abortando')
          i=i.replace(matches[0],'/bootstrap.js?v=20260901-bankdelete1',1)
          index.write_text(i,encoding='utf-8')
          PY
          node --check worker.js
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          grep -q "delete-efi" worker.js
          grep -q "delete-mercado-pago" worker.js
          grep -q "Excluir configuração" dashboard-transition-guard.js
          grep -q "credentialValue" dashboard-transition-guard.js
          grep -q "20260901-bankdelete1" bootstrap.js
          grep -q "20260901-bankdelete1" index.html
      - name: "Publicar correcao e remover aplicador"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bank-settings-delete.yml
          git add worker.js dashboard-transition-guard.js bootstrap.js index.html
          git commit -m "Corrige exclusao das integracoes bancarias"
          git push origin HEAD:cloudflare-provedor-plus
