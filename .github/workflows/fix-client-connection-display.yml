name: Ajustar apresentação da conexão do cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-client-connection-display.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Ajustar somente data e estado do diagnóstico
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          replacements=[
            ("new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium'}).format(date)","new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Maceio'}).format(date)"),
            ("quality:'Aguardando dados',checkedAt:checkedFallback,lastConnection:checkedFallback||'Aguardando dados',lastConnectionLabel:portalDateLabel(checkedFallback),source:'stored',connectionError:''",
             "quality:'Aguardando dados',checkedAt:checkedFallback,lastConnection:portalDateLabel(checkedFallback)||'Aguardando dados',lastConnectionIso:checkedFallback,lastConnectionLabel:portalDateLabel(checkedFallback),diagnosticStatus:'idle',diagnosticMessage:'Pronto para verificar sua conexão.',checking:false,isChecking:false,source:'stored',connectionError:''"),
            ("quality:text(live.quality)||(live.online?'Boa':'Sem conexão'),qualityAvailable:Boolean(live.qualityAvailable),checkedAt,lastConnection:checkedAt,lastConnectionLabel:portalDateLabel(checkedAt),source:'mikrotik-live',connectionError:'',",
             "quality:text(live.quality)||(live.online?'Boa':'Sem conexão'),qualityAvailable:Boolean(live.qualityAvailable),checkedAt,lastConnection:portalDateLabel(checkedAt),lastConnectionIso:checkedAt,lastConnectionLabel:portalDateLabel(checkedAt),diagnosticStatus:'complete',diagnosticMessage:'Diagnóstico concluído.',checking:false,isChecking:false,source:'mikrotik-live',connectionError:'',"),
            ("return {...fallback,status:'Indisponível',quality:'Indisponível',checkedAt,lastConnection:checkedFallback||checkedAt,lastConnectionLabel:portalDateLabel(checkedFallback||checkedAt),source:'mikrotik-error',connectionError:message};",
             "return {...fallback,status:'Indisponível',quality:'Indisponível',checkedAt,lastConnection:portalDateLabel(checkedFallback||checkedAt),lastConnectionIso:checkedFallback||checkedAt,lastConnectionLabel:portalDateLabel(checkedFallback||checkedAt),diagnosticStatus:'error',diagnosticMessage:message,checking:false,isChecking:false,source:'mikrotik-error',connectionError:message};"),
            ("lastConnection:normalizePortalDate(client.mikrotik_last_sync)||'Aguardando dados',\n      lastConnectionLabel:portalDateLabel(client.mikrotik_last_sync),\n      checkedAt:normalizePortalDate(client.mikrotik_last_sync),",
             "lastConnection:portalDateLabel(client.mikrotik_last_sync)||'Aguardando dados',\n      lastConnectionIso:normalizePortalDate(client.mikrotik_last_sync),\n      lastConnectionLabel:portalDateLabel(client.mikrotik_last_sync),\n      checkedAt:normalizePortalDate(client.mikrotik_last_sync),"),
            ("availability30Days:null,\n      quality:online?'Boa':'Aguardando dados',\n      source:'stored',connectionError:'',",
             "availability30Days:null,\n      quality:online?'Boa':'Aguardando dados',\n      diagnosticStatus:'idle',diagnosticMessage:'Pronto para verificar sua conexão.',checking:false,isChecking:false,\n      source:'stored',connectionError:'',"),
            ("      ...(connectionOverride&&typeof connectionOverride==='object'?connectionOverride:{})\n    }\n  };",
             "      ...(connectionOverride&&typeof connectionOverride==='object'?connectionOverride:{})\n    },\n    diagnostic:{\n      ok:!text(connectionOverride?.connectionError),\n      status:connectionOverride?(text(connectionOverride?.connectionError)?'error':'complete'):'idle',\n      message:text(connectionOverride?.connectionError)||(connectionOverride?'Diagnóstico concluído.':'Pronto para verificar sua conexão.'),\n      checkedAt:text(connectionOverride?.checkedAt)||normalizePortalDate(client.mikrotik_last_sync)\n    }\n  };")
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'Esperava 1 ocorrência e encontrei {count}: {old[:80]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check worker.js
          grep -F "timeZone:'America/Maceio'" worker.js >/dev/null
          grep -F "diagnosticStatus:'complete'" worker.js >/dev/null
          grep -F "lastConnectionIso:checkedAt" worker.js >/dev/null
      - name: Publicar e remover aplicador temporário
        shell: bash
        run: |
          rm -f .github/workflows/fix-client-connection-display.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js .github/workflows/fix-client-connection-display.yml
          git commit -m 'Corrige data e conclusao do diagnostico do cliente'
          git push origin HEAD:cloudflare-provedor-plus
