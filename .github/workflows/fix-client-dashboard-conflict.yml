name: fix-client-dashboard-conflict
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths:
      - '.github/workflows/fix-client-dashboard-conflict.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Corrigir exclusividade Cliente Dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard-transition-guard.js')
          s=p.read_text()
          old="c.classList.remove('pp-integration-hub-active','pp-new-plans-active','pp-route-overlay-active','pp-route-billing-active','pp-route-ticket-active','pp-route-staff-active');c.classList.add('pp-client-hub-active');"
          new="c.classList.remove('pp-dashboard-root-active','pp-integration-hub-active','pp-new-plans-active','pp-route-overlay-active','pp-route-billing-active','pp-route-ticket-active','pp-route-staff-active');c.querySelector(':scope>.pp-dashboard-root-layer')?.remove();document.querySelectorAll('.pp-pppoe-modal-layer').forEach(node=>node.remove());c.classList.add('pp-client-hub-active');"
          if s.count(old) != 1:
              raise SystemExit(f'Trecho esperado encontrado {s.count(old)} vezes; abortando sem alterar.')
          p.write_text(s.replace(old,new,1))
          PY
          node --check dashboard-transition-guard.js
          grep -F "c.classList.remove('pp-dashboard-root-active','pp-integration-hub-active'" dashboard-transition-guard.js
          grep -F "c.querySelector(':scope>.pp-dashboard-root-layer')?.remove()" dashboard-transition-guard.js
      - name: Commit da correção e remoção do aplicador
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js
          git rm .github/workflows/fix-client-dashboard-conflict.yml
          git commit -m 'Corrige conflito de clique entre Cliente e Dashboard'
          git push origin HEAD:cloudflare-provedor-plus
