name: fix-client-edit-password
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/fix-client-edit-password.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Ajustar senha opcional e preservar profile
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('dashboard-transition-guard.js'); s=p.read_text(encoding='utf-8'); old='form.elements.connection_type.onchange=()=>{toggleConnectionFields(form);void syncProfiles()};toggleConnectionFields(form);void syncProfiles();'; new='form.elements.connection_type.onchange=()=>{toggleConnectionFields(form);if(form.elements.pppoe_password)form.elements.pppoe_password.required=false;void syncProfiles()};toggleConnectionFields(form);if(form.elements.pppoe_password)form.elements.pppoe_password.required=false;void syncProfiles();'; assert old in s, 'bloco de obrigatoriedade PPPoE não encontrado'; s=s.replace(old,new,1); old2=\"if(current&&[...form.elements.mikrotik_profile.options].some(o=>o.value===current))form.elements.mikrotik_profile.value=current\"; new2=\"if(current){if(![...form.elements.mikrotik_profile.options].some(o=>o.value===current))form.elements.mikrotik_profile.add(new Option(current,current));form.elements.mikrotik_profile.value=current}\"; assert old2 in s, 'bloco de profile atual não encontrado'; s=s.replace(old2,new2,1); p.write_text(s,encoding='utf-8')"
          node --check dashboard-transition-guard.js
          grep -q 'pppoe_password.required=false' dashboard-transition-guard.js
          grep -q 'new Option(current,current)' dashboard-transition-guard.js
          rm -f .github/workflows/fix-client-edit-password.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js .github/workflows/fix-client-edit-password.yml
          git commit -m 'Permite editar PPPoE sem redigitar senha e preserva profile'
          git push origin HEAD:cloudflare-provedor-plus
