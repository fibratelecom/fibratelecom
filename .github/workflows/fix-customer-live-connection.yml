name: Corrigir conexão real da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-customer-live-connection.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Integrar status real do MikroTik ao portal
        shell: bash
        run: |
          python3 .github/fix-customer-live-connection.py
          node --check worker.js
          node --check worker-native-api.js
          grep -F "export async function resolveRouterForService" worker-native-api.js >/dev/null
          grep -F "async function portalLiveConnection" worker.js >/dev/null
          grep -F "'connection-test'" worker.js >/dev/null
      - name: Publicar e remover aplicadores temporários
        shell: bash
        run: |
          rm -f .github/workflows/fix-customer-live-connection.yml .github/fix-customer-live-connection.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js worker-native-api.js .github/workflows/fix-customer-live-connection.yml .github/fix-customer-live-connection.py
          git commit -m 'Integra conexao real do cliente ao MikroTik'
          git push origin HEAD:cloudflare-provedor-plus
