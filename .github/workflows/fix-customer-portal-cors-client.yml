name: Corrigir CORS da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-customer-portal-cors-client.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Autorizar origem real do portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="const ALLOWED_PORTAL_ORIGINS=new Set([\n  'https://cliente.fibramais.workers.dev'\n]);"
          new="const ALLOWED_PORTAL_ORIGINS=new Set([\n  'https://cliente.fibramais.workers.dev',\n  'https://client.fibramais.workers.dev'\n]);"
          if old not in s:
              raise SystemExit('lista CORS esperada não encontrada; abortando')
          s=s.replace(old,new,1)
          if s.count("https://client.fibramais.workers.dev")!=1:
              raise SystemExit('origem client não ficou única')
          p.write_text(s)
          PY
          node --check worker.js
      - name: Publicar e remover aplicador
        shell: bash
        run: |
          rm -f .github/workflows/fix-customer-portal-cors-client.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js .github/workflows/fix-customer-portal-cors-client.yml
          git commit -m 'Autoriza origem real da Area do Cliente'
          git push origin HEAD:cloudflare-provedor-plus
