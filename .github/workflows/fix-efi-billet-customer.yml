name: Corrigir customer Efí e retorno do boleto
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-efi-billet-customer.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Aplicar correção
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          node --check worker-bank-native.js
          grep -F "function efiCustomerData(c){return c.documentType==='CPF'?{name:c.name,cpf:c.document}:{juridical_person:{corporate_name:c.name,cnpj:c.document}};}" worker-bank-native.js >/dev/null
          grep -F "O e-mail do cadastro não foi enviado à Efí nesta cobrança." worker-bank-native.js >/dev/null
          grep -F "const x=r.data.data,billetData=x.payment?.banking_billet||{};" worker-bank-native.js >/dev/null
          grep -F "bank_ticket_url:String(billetData.link||billetData.billet_link||x.billet_link||x.link||'')" worker-bank-native.js >/dev/null
      - name: Publicar e remover aplicador
        shell: bash
        run: |
          rm -f .github/workflows/fix-efi-billet-customer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-bank-native.js .github/workflows/fix-efi-billet-customer.yml
          git commit -m 'Corrige customer e retorno do boleto Efi'
          git push origin HEAD:cloudflare-provedor-plus
