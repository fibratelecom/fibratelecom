name: Corrigir transporte mTLS Efí
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-efi-cloudflare-mtls.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Corrigir transporte Efí no Cloudflare
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('worker-bank-native.js')
          s=p.read_text()

          old="async function jsonRequest(url,{method='GET',headers={},body,pfx,passphrase,timeout=25000}={}){if(pfx)return mtlsJsonRequest(url,{method,headers,body,pfx,passphrase,timeout});const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const response=await fetch(url,{method,cache:'no-store',redirect:'manual',headers:{Accept:'application/json','Accept-Encoding':'identity',...headers,...(body!==undefined?{'Content-Type':'application/json'}:{})},body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal});"
          new="async function jsonRequest(url,{method='GET',headers={},body,pfx,passphrase,mtlsFetcher,timeout=25000}={}){const boundFetcher=mtlsFetcher&&typeof mtlsFetcher.fetch==='function'?mtlsFetcher:null;if(pfx&&!boundFetcher)throw new Error('Efí Pix: o certificado está salvo, mas o transporte mTLS do Cloudflare ainda não está vinculado ao Worker.');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const doFetch=boundFetcher?boundFetcher.fetch.bind(boundFetcher):fetch;const response=await doFetch(url,{method,cache:'no-store',redirect:'manual',headers:{Accept:'application/json','Accept-Encoding':'identity',...headers,...(body!==undefined?{'Content-Type':'application/json'}:{})},body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal});"
          if old not in s: raise SystemExit('jsonRequest alvo não encontrado')
          s=s.replace(old,new,1)

          old="async function efiPixToken(e){const credentials=efiCredentials(e);if(!credentials.clientId||!credentials.clientSecret)throw new Error('Efí Pix: informe Client ID e Client Secret.');const basic=Buffer.from(`${credentials.clientId}:${credentials.clientSecret}`).toString('base64');const r=await jsonRequest(`${efiBase(e,true)}/oauth/token`,{method:'POST',headers:{Authorization:`Basic ${basic}`},body:{grant_type:'client_credentials'},pfx:cert(e),passphrase:e.certificatePassword||'',timeout:18000});if(r.status<200||r.status>=300||!r.data?.access_token)throw new Error(errMsg('Efí Pix',r.status,r.data));return {base:efiBase(e,true),token:String(r.data.access_token),pfx:cert(e),passphrase:e.certificatePassword||''};}"
          new="async function efiPixToken(e){const credentials=efiCredentials(e);if(!credentials.clientId||!credentials.clientSecret)throw new Error('Efí Pix: informe Client ID e Client Secret.');const mtlsFetcher=e?.__mtlsFetcher;if(!mtlsFetcher||typeof mtlsFetcher.fetch!=='function')throw new Error('Efí Pix: o certificado está salvo, mas o transporte mTLS do Cloudflare ainda não está vinculado ao Worker.');const basic=Buffer.from(`${credentials.clientId}:${credentials.clientSecret}`).toString('base64');const r=await jsonRequest(`${efiBase(e,true)}/oauth/token`,{method:'POST',headers:{Authorization:`Basic ${basic}`},body:{grant_type:'client_credentials'},pfx:cert(e),passphrase:e.certificatePassword||'',mtlsFetcher,timeout:18000});if(r.status<200||r.status>=300||!r.data?.access_token)throw new Error(errMsg('Efí Pix',r.status,r.data));return {base:efiBase(e,true),token:String(r.data.access_token),pfx:cert(e),passphrase:e.certificatePassword||'',mtlsFetcher};}"
          if old not in s: raise SystemExit('efiPixToken alvo não encontrado')
          s=s.replace(old,new,1)

          old="async function efiPixCall(e,path,method='GET',body){const a=await efiPixToken(e);const r=await jsonRequest(`${a.base}${path}`,{method,headers:{Authorization:`Bearer ${a.token}`},body,pfx:a.pfx,passphrase:a.passphrase,timeout:25000});"
          new="async function efiPixCall(e,path,method='GET',body){const a=await efiPixToken(e);const r=await jsonRequest(`${a.base}${path}`,{method,headers:{Authorization:`Bearer ${a.token}`},body,pfx:a.pfx,passphrase:a.passphrase,mtlsFetcher:a.mtlsFetcher,timeout:25000});"
          if old not in s: raise SystemExit('efiPixCall alvo não encontrado')
          s=s.replace(old,new,1)

          old="async function testEfi(e){const billing=await efiBillingToken(e,{diagnoseEnvironment:true});let pix='certificate_missing';if(e.certificateBase64){await efiPixToken(e);pix='connected';}return {connected:true,billing:true,pix,message:pix==='connected'?'Cobranças e Pix conectados.':'API de Cobranças conectada. Para testar Pix, selecione o certificado P12/PFX da Efí.',checkedAt:new Date().toISOString(),billingHost:new URL(billing.base).hostname};}"
          new="async function testEfi(e){const billing=await efiBillingToken(e,{diagnoseEnvironment:true});let pix='certificate_missing',message='API de Cobranças conectada. Para testar Pix, selecione o certificado P12/PFX da Efí.';if(e.certificateBase64){if(e?.__mtlsFetcher&&typeof e.__mtlsFetcher.fetch==='function'){await efiPixToken(e);pix='connected';message='Cobranças e Pix conectados.';}else{pix='mtls_pending';message='API de Cobranças conectada. Pix Efí aguarda o vínculo mTLS do certificado no Cloudflare Worker.';}}return {connected:true,billing:true,pix,message,checkedAt:new Date().toISOString(),billingHost:new URL(billing.base).hostname};}"
          if old not in s: raise SystemExit('testEfi alvo não encontrado')
          s=s.replace(old,new,1)

          old="export async function handleBankProxy(request){if(request.method!=='POST')return response(405,{ok:false,error:'Método não permitido.'});try{let body={};try{body=await request.json()}catch{}const action=String(body.action||''),efi=body.efi||{},mp=body.mercadoPago||{};"
          new="export async function handleBankProxy(request,env={}){if(request.method!=='POST')return response(405,{ok:false,error:'Método não permitido.'});try{let body={};try{body=await request.json()}catch{}const action=String(body.action||''),efi={...(body.efi||{})},mp=body.mercadoPago||{};if(env?.EFI_MTLS&&typeof env.EFI_MTLS.fetch==='function')efi.__mtlsFetcher=env.EFI_MTLS;"
          if old not in s: raise SystemExit('handleBankProxy alvo não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('worker.js')
          s=p.read_text()
          old="const response=await handleBankProxy(new Request('https://painel.fibramais.workers.dev/api/bank-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}));"
          new="const response=await handleBankProxy(new Request('https://painel.fibramais.workers.dev/api/bank-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),env);"
          if old not in s: raise SystemExit('bankProxyAsService alvo não encontrado')
          s=s.replace(old,new,1)
          old="try{return handleBankProxy(await refreshBankClientRequest(request,env))}"
          new="try{return handleBankProxy(await refreshBankClientRequest(request,env),env)}"
          if old not in s: raise SystemExit('handleSpecializedNative alvo não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('dashboard-transition-guard.js')
          s=p.read_text()
          old="function statusClass(v){return v==='success'?'ok':v==='error'?'error':''}function statusText(v){if(!v?.enabled)return'Desativado';if(v?.lastTestStatus==='success')return'Conectado';"
          new="function statusClass(v){return v==='success'?'ok':v==='error'?'error':''}function statusText(v){if(!v?.enabled)return'Desativado';if(v?.lastTestStatus==='success'&&/aguarda o vínculo mTLS/i.test(String(v?.lastTestMessage||'')))return'Cobranças conectadas';if(v?.lastTestStatus==='success')return'Conectado';"
          if old not in s: raise SystemExit('statusText alvo não encontrado')
          s=s.replace(old,new,1)
          old="${efi.enabled&&efi.certificateConfigured&&efi.pixKey?'Efí pronto':mp.enabled&&mp.accessTokenConfigured?'Mercado Pago pronto':'Aguardando banco'}"
          new="${efi.enabled&&/aguarda o vínculo mTLS/i.test(String(efi.lastTestMessage||''))?'Efí aguarda mTLS':efi.enabled&&efi.certificateConfigured&&efi.pixKey?'Efí pronto':mp.enabled&&mp.accessTokenConfigured?'Mercado Pago pronto':'Aguardando banco'}"
          if old not in s: raise SystemExit('resumo Pix alvo não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check worker-bank-native.js
          node --check worker.js
          node --check dashboard-transition-guard.js
          grep -q "mtls_pending" worker-bank-native.js
          grep -q "handleBankProxy(await refreshBankClientRequest(request,env),env)" worker.js
      - name: Publicar correção e remover aplicador
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker-bank-native.js worker.js dashboard-transition-guard.js
          git commit -m "Corrige transporte mTLS da Efí no Cloudflare"
          git rm .github/workflows/fix-efi-cloudflare-mtls.yml
          git commit -m "Remove aplicador temporário do mTLS Efí"
          git push origin cloudflare-provedor-plus
