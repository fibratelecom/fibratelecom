name: fix-efi-customer-identity
on:
  push:
    branches:
      - cloudflare-provedor-plus
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          node --check worker.js
          node --check worker-bank-native.js
      - run: |
          rm -f .github/workflows/fix-efi-customer-identity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js worker-bank-native.js .github/workflows/fix-efi-customer-identity.yml
          git commit -m 'Corrige selecao da identidade enviada a Efi'
          git push origin HEAD:cloudflare-provedor-plus
