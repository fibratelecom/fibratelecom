name: Fix Fresh Client Billing

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh client before bank emission
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check billing-bank-selector.js
          grep -Fq "async function refreshBillingClient(clientId)" billing-bank-selector.js
          grep -Fq "recebedor e cliente nao podem ser a mesma pessoa" billing-bank-selector.js
          grep -Fq "const freshClient=await refreshBillingClient" billing-bank-selector.js
          git fetch origin main
          git diff --quiet origin/main -- packed/appgz-*.txt packed/bridgegz-*.txt packed/proxygz-*.txt
          if git diff --quiet -- billing-bank-selector.js; then
            echo 'Patch already present.'
            exit 0
          fi
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add billing-bank-selector.js
          git commit -m 'Atualiza cliente antes da emissão bancária'
          git push origin HEAD:fix/global-navigation-duplication
