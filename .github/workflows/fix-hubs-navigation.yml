name: Fix Hubs Navigation
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/fix-hubs-navigation.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Corrigir hubs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('dashboard-transition-guard.js','utf8');
          const oldIntegration=`function ensureButton(){styles();const nav=navRoot();if(!nav)return;let b=nav.querySelector('[data-pp-integration-hub="1"]'),buttons=[...nav.querySelectorAll('button')],chamados=buttons.find(x=>norm(x.textContent).startsWith('chamados'));if(!b){b=document.createElement('button');b.type='button';b.dataset.ppIntegrationHub='1';b.className=String(chamados?.className||'');b.classList.remove('active');b.classList.add('pp-integration-hub-button');b.innerHTML='<span>⌁</span>Integração<span class="pp-integration-chevron">›</span>';b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');b.onmouseenter=showPopup;b.onmouseleave=()=>timer=setTimeout(closePopup,150);b.onclick=e=>{e.preventDefault();e.stopPropagation();popup&&!popup.hidden?closePopup():showPopup()};nav.insertBefore(b,chamados||null)}else if(chamados&&b.nextSibling!==chamados)nav.insertBefore(b,chamados);hubButton=b;buildPopup();if(!navObserver){navObserver=new MutationObserver(()=>ensureButton());navObserver.observe(nav,{childList:true})}}`;
          const newIntegration=`function ensureButton(){styles();const nav=navRoot();if(!nav)return;const buttons=[...nav.querySelectorAll('button')],chamados=buttons.find(x=>norm(x.textContent).startsWith('chamados')),systemLabel=[...nav.querySelectorAll('.nav-label,small')].find(x=>norm(x.textContent)==='sistema'),anchor=chamados||systemLabel;if(!anchor)return;let b=nav.querySelector('[data-pp-integration-hub="1"]');if(!b){b=document.createElement('button');b.type='button';b.dataset.ppIntegrationHub='1';b.innerHTML='<span>⌁</span>Integração<span class="pp-integration-chevron">›</span>'}b.className=String(chamados?.className||b.className||'');b.classList.remove('active');b.classList.add('pp-integration-hub-button');b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded',popup&&!popup.hidden?'true':'false');b.onmouseenter=showPopup;b.onmouseleave=()=>timer=setTimeout(closePopup,150);b.onclick=e=>{e.preventDefault();e.stopPropagation();popup&&!popup.hidden?closePopup():showPopup()};if(b.nextSibling!==anchor)nav.insertBefore(b,anchor);hubButton=b;buildPopup()}`;
          if(!s.includes(oldIntegration))throw new Error('ensureButton antigo da Integração não encontrado.');
          s=s.replace(oldIntegration,newIntegration);
          const oldIntegrationObserver=`const rootObserver=new MutationObserver(()=>{\n    ensureButton();\n    if(navRoot()&&hubButton?.isConnected)rootObserver.disconnect();\n  });\n  rootObserver.observe(document.documentElement,{childList:true,subtree:true});`;
          const newIntegrationObserver=`const rootObserver=new MutationObserver(()=>ensureButton());\n  rootObserver.observe(document.documentElement,{childList:true,subtree:true});`;
          if(!s.includes(oldIntegrationObserver))throw new Error('Observer antigo da Integração não encontrado.');
          s=s.replace(oldIntegrationObserver,newIntegrationObserver);

          const oldClient=`function ensureClientButton(){clientStyles();const nav=navRoot();if(!nav)return;[...nav.querySelectorAll('button')].forEach(b=>{if(b.dataset.ppClientHub==='1')return;if(norm(b.textContent)==='clientes')b.remove()});let b=nav.querySelector('[data-pp-client-hub="1"]'),buttons=[...nav.querySelectorAll('button')],finance=buttons.find(x=>norm(x.textContent).startsWith('financeiro'));if(!b){b=document.createElement('button');b.type='button';b.dataset.ppClientHub='1';b.className=String(finance?.className||'');b.classList.remove('active');b.classList.add('pp-client-hub-button');b.innerHTML='<span>◉</span><span>Cliente</span><span class="pp-client-chevron">›</span>';b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');b.onmouseenter=showClientPopup;b.onmouseleave=()=>clientTimer=setTimeout(closeClientPopup,150);b.onclick=e=>{e.preventDefault();e.stopPropagation();clientPopup&&!clientPopup.hidden?closeClientPopup():showClientPopup()};nav.insertBefore(b,finance||null)}else if(finance&&b.nextSibling!==finance)nav.insertBefore(b,finance);clientButton=b;buildClientPopup();if(!clientObserver){clientObserver=new MutationObserver(()=>ensureClientButton());clientObserver.observe(nav,{childList:true})}}`;
          const newClient=`function ensureClientButton(){clientStyles();const nav=navRoot();if(!nav)return;[...nav.querySelectorAll('button')].forEach(b=>{if(b.dataset.ppClientHub==='1')return;if(norm(b.textContent)==='clientes')b.remove()});const buttons=[...nav.querySelectorAll('button')],dashboard=nav.querySelector('[data-pp-dashboard-root="1"]'),finance=buttons.find(x=>norm(x.textContent).startsWith('financeiro')),systemLabel=[...nav.querySelectorAll('.nav-label,small')].find(x=>norm(x.textContent)==='sistema');let anchor=dashboard?.nextSibling||finance||systemLabel;if(!anchor&&dashboard)anchor=systemLabel;if(!anchor)return;let b=nav.querySelector('[data-pp-client-hub="1"]');if(!b){b=document.createElement('button');b.type='button';b.dataset.ppClientHub='1';b.innerHTML='<span>◉</span><span>Cliente</span><span class="pp-client-chevron">›</span>'}b.className=String(finance?.className||b.className||'');b.classList.remove('active');b.classList.add('pp-client-hub-button');b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded',clientPopup&&!clientPopup.hidden?'true':'false');b.onmouseenter=showClientPopup;b.onmouseleave=()=>clientTimer=setTimeout(closeClientPopup,150);b.onclick=e=>{e.preventDefault();e.stopPropagation();clientPopup&&!clientPopup.hidden?closeClientPopup():showClientPopup()};anchor=dashboard?.nextSibling||finance||systemLabel;if(anchor!==b&&b.nextSibling!==anchor)nav.insertBefore(b,anchor);clientButton=b;buildClientPopup()}`;
          if(!s.includes(oldClient))throw new Error('ensureClientButton antigo não encontrado.');
          s=s.replace(oldClient,newClient);
          const oldClientObserver=`const rootObserver=new MutationObserver(()=>{ensureClientButton();if(navRoot()&&clientButton?.isConnected)rootObserver.disconnect()});rootObserver.observe(document.documentElement,{childList:true,subtree:true});clientStyles();ensureClientButton();`;
          const newClientObserver=`const rootObserver=new MutationObserver(()=>ensureClientButton());rootObserver.observe(document.documentElement,{childList:true,subtree:true});clientStyles();ensureClientButton();`;
          if(!s.includes(oldClientObserver))throw new Error('Observer antigo do Cliente não encontrado.');
          s=s.replace(oldClientObserver,newClientObserver);
          fs.writeFileSync('dashboard-transition-guard.js',s);

          let boot=fs.readFileSync('bootstrap.js','utf8');
          boot=boot.replace(/const BUILD_TOKEN='[^']+';/,"const BUILD_TOKEN='20260831-hubs-fix1';");
          fs.writeFileSync('bootstrap.js',boot);
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/\/bootstrap\.js\?v=[^\"']+/,'/bootstrap.js?v=20260831-hubs-fix1');
          fs.writeFileSync('index.html',html);
          NODE
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          grep -q "dashboard=nav.querySelector('\\[data-pp-dashboard-root" dashboard-transition-guard.js
          grep -q "anchor=chamados||systemLabel" dashboard-transition-guard.js
          ! grep -q "hubButton?.isConnected)rootObserver.disconnect" dashboard-transition-guard.js
          ! grep -q "clientButton?.isConnected)rootObserver.disconnect" dashboard-transition-guard.js
      - name: Publicar e limpar temporarios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js bootstrap.js index.html
          git commit -m 'Corrige hubs Cliente e Integracao no menu'
          git rm -f .github/workflows/fix-hubs-navigation.yml .github/workflows/audit-hubs-runtime.yml
          git commit -m 'Remove auditoria temporaria dos hubs'
          git push origin HEAD:cloudflare-provedor-plus