name: Fix Hubs Root 2
on:
  push:
    paths:
      - '.github/workflows/fix-hubs-root2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: |
          cp .github/scripts/fix-hubs-root.js /tmp/fix-hubs-root.cjs
          node /tmp/fix-hubs-root.cjs
      - name: Validate
        run: |
          node --check bootstrap.js
          node --check dashboard-transition-guard.js
          grep -Fq "20260831-hubs-rootfix1" bootstrap.js index.html
          ! grep -Fq "rootObserver.observe(document.documentElement" dashboard-transition-guard.js
          ! grep -Fq "if(norm(b.textContent)==='clientes')b.remove()" dashboard-transition-guard.js
          grep -Fq "integrationSidebar" dashboard-transition-guard.js
          grep -Fq "clientSidebar" dashboard-transition-guard.js
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap.js index.html dashboard-transition-guard.js
          git commit -m 'Corrige observers de Cliente e Integracao'
          git rm -f .github/scripts/fix-hubs-root.js .github/workflows/fix-hubs-root.yml .github/workflows/fix-hubs-root2.yml
          git commit -m 'Remove aplicadores temporarios dos hubs'
          git push origin HEAD:cloudflare-provedor-plus
