name: fix-integration-dashboard-conflict
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-integration-dashboard-conflict.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Corrigir exclusividade da Integração
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard-transition-guard.js')
          s=p.read_text(encoding='utf-8')
          old="function openHost(){if(!integrationAllowed()){denyIntegration();return null}closePopup();const c=contentRoot();if(!c)return null;c.classList.add('pp-integration-hub-active');layer=c.querySelector(':scope>.pp-integration-hub-layer');"
          new="function openHost(){if(!integrationAllowed()){denyIntegration();return null}closePopup();const c=contentRoot();if(!c)return null;c.classList.remove('pp-dashboard-root-active');c.querySelector(':scope>.pp-dashboard-root-layer')?.remove();document.querySelectorAll('.pp-pppoe-modal-layer').forEach(node=>node.remove());c.classList.add('pp-integration-hub-active');layer=c.querySelector(':scope>.pp-integration-hub-layer');"
          if old not in s:
              raise SystemExit('Trecho openHost da Integração não encontrado; nenhuma alteração aplicada.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check dashboard-transition-guard.js
      - name: Salvar correção e remover aplicador temporário
        run: |
          rm -f .github/workflows/fix-integration-dashboard-conflict.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-transition-guard.js .github/workflows/fix-integration-dashboard-conflict.yml
          git commit -m "Corrige conflito entre Integração e Dashboard"
          git push origin HEAD:cloudflare-provedor-plus
