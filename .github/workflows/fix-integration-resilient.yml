name: Fix Integration Resilient
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - ".github/workflows/fix-integration-resilient.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Apply integration fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          grep -q 'integrationShellObserver' dashboard-transition-guard.js
          grep -q "BUILD_TOKEN='20260831-integration-system2'" bootstrap.js
          grep -q 'dashboard-transition-guard.js?v=20260831-integration-system2' bootstrap.js
          grep -q 'bootstrap.js?v=20260831-integration-system2' index.html
      - name: Publish integration fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-transition-guard.js bootstrap.js index.html
          git commit -m 'Mantem Integracao apos recriacao da sidebar'
          git rm -f .github/workflows/fix-integration-resilient.yml
          git commit -m 'Remove aplicador temporario da Integracao resiliente'
          git push origin HEAD:cloudflare-provedor-plus
