name: fix-mikrotik-offline
on:
  push:
    paths:
      - '.github/workflows/fix-mikrotik-offline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Corrigir timeout e cache MikroTik
        run: |
          python <<'PY'
          from pathlib import Path

          p=Path('cloud-adapter.js')
          s=p.read_text()
          old="api.mikrotik.metrics=async routerId=>{const r=await routerRecord(routerId),result=await cloudCall('router.metrics',{router:await routerAuth(routerId)},6500);return {...result,routerId:Number(routerId),routerName:r.name}};"
          new="api.mikrotik.metrics=async routerId=>{const r=await routerRecord(routerId),result=await cloudCall('router.metrics',{router:await routerAuth(routerId)},17500);return {...result,routerId:Number(routerId),routerName:r.name}};"
          if old not in s:
              raise SystemExit('Trecho metrics/6500 não encontrado')
          p.write_text(s.replace(old,new,1))

          p=Path('bootstrap.js')
          s=p.read_text()
          replacements={
            "/cloud-adapter.js?v=20260831-step8-mikrotik1":"/cloud-adapter.js?v=20260831-step8-mikrotik2",
            "/mikrotik-read-stability.js?v=1017-mikrotikstable1":"/mikrotik-read-stability.js?v=20260831-mikrotikstable2",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Trecho não encontrado: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check cloud-adapter.js
          node --check mikrotik-read-stability.js
          node --check bootstrap.js
          grep -q "router.metrics.*17500" cloud-adapter.js
          grep -q "mikrotikstable2" bootstrap.js
      - name: Salvar correção e remover aplicador temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-adapter.js bootstrap.js mikrotik-read-stability.js
          if ! git diff --cached --quiet; then
            git commit -m "Corrige falso offline do MikroTik no Dashboard"
          fi
          rm -f .github/workflows/fix-mikrotik-offline.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove aplicador temporário do MikroTik"
          fi
          git push origin HEAD:cloudflare-provedor-plus
