name: Fix Planos Open
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - '.github/workflows/fix-planos-open.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Corrigir Planos
        run: |
          set -e
          sed -i "/if(!button)return;opened=true;navButton=button;const ready=ensureLayer(button);if(!ready)return;/a\\    ready.content.classList.remove('pp-dashboard-root-active','pp-client-hub-active','pp-integration-hub-active','pp-new-plans-active','pp-route-overlay-active','pp-route-billing-active','pp-route-ticket-active','pp-route-staff-active','pp-nav-loading-active');\\n    ready.content.querySelector(':scope > .pp-nav-loading-layer')?.remove();" plans.js
          sed -i 's#plans.js?v=20260830-2210-planos-upload-instalacao1#plans.js?v=20260831-planos-open1#' index.html
          node --check plans.js
          grep -q "ready.content.classList.remove('pp-dashboard-root-active'" plans.js
          grep -q 'plans.js?v=20260831-planos-open1' index.html
      - name: Publicar
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plans.js index.html
          git commit -m 'Restaura abertura da tela Planos'
          git rm .github/workflows/fix-planos-open.yml
          git commit -m 'Remove aplicador temporario de Planos'
          git push origin HEAD:cloudflare-provedor-plus
