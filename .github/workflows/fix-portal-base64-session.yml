name: Corrigir sessão da Área do Cliente
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/fix-portal-base64-session.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Restaurar codificação segura da sessão
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker.js')
          s=p.read_text()
          for name in ['base64Url','base64UrlBytes']:
              if re.search(rf'function\s+{name}\b',s):
                  raise SystemExit(f'{name} já existe; abortando para evitar duplicidade')
          marker="const portalUtf8=new TextEncoder();\n"
          lines=[
            "const portalUtf8=new TextEncoder();",
            "function base64Url(value){",
            "  const bytes=value instanceof Uint8Array?value:new Uint8Array(value);",
            "  let binary='';",
            "  for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));",
            "  return btoa(binary).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');",
            "}",
            "function base64UrlBytes(value){",
            "  const raw=text(value).replace(/-/g,'+').replace(/_/g,'/'),padded=raw+'='.repeat((4-raw.length%4)%4),binary=atob(padded),out=new Uint8Array(binary.length);",
            "  for(let i=0;i<binary.length;i++)out[i]=binary.charCodeAt(i);",
            "  return out;",
            "}",
            ""
          ]
          if marker not in s: raise SystemExit('ponto portalUtf8 não encontrado')
          s=s.replace(marker,'\n'.join(lines),1)
          p.write_text(s)
          PY
          node --check worker.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text()
          for name in ['base64Url','base64UrlBytes']:
              defs=len(re.findall(rf'function\s+{name}\b',s)); refs=len(re.findall(rf'\b{name}\b',s))
              print(name,'defs',defs,'refs',refs)
              if defs!=1 or refs<2: raise SystemExit(f'validação falhou para {name}')
          PY
      - name: Publicar e remover aplicador
        shell: bash
        run: |
          rm -f .github/workflows/fix-portal-base64-session.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js .github/workflows/fix-portal-base64-session.yml
          git commit -m 'Restaura codificacao da sessao da Area do Cliente'
          git push origin HEAD:cloudflare-provedor-plus
