name: fix-step1-menu

on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/fix-step1-menu.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Aplicar etapa 1
        run: python .github/fix-step1-menu.py
      - name: Validar JavaScript
        run: |
          node --check dashboard-transition-guard.js
          node --check plans.js
          node --check dashboard-enhancements.js
          node --check staff-access.js
          node --check bootstrap.js
          git diff --check
      - name: Publicar etapa 1
        run: |
          rm -f .github/fix-step1-menu.py .github/workflows/fix-step1-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-transition-guard.js plans.js dashboard-enhancements.js staff-access.js bootstrap.js index.html .github
          git commit -m "Corrige estabilidade dos botoes do menu - etapa 1"
          git push origin HEAD:cloudflare-provedor-plus
