name: fix-step10-startup
on:
  push:
    paths:
      - '.github/workflows/fix-step10-startup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply startup recovery patch
        run: python3 .github/scripts/fix-step10-startup.py
      - name: Validate
        run: |
          node --check bootstrap.js
          grep -q "root.replaceChildren()" bootstrap.js
          grep -q "__PROVEDOR_PLUS_STARTUP_READY__" bootstrap.js
          grep -q "let readyShell=null" bootstrap.js
          grep -q "20260831-step10-startup1" bootstrap.js
          grep -q "bootstrap.js?v=20260831-step10-startup1" index.html
          ! grep -q "if(root&&!root.children.length)" bootstrap.js
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf 'bootstrap.js\nindex.html')"
          test "$CHANGED" = "$EXPECTED"
      - name: Commit functional change
        run: |
          git add bootstrap.js index.html
          git commit -m "Torna falha de inicializacao recuperavel - etapa 10"
      - name: Cleanup temporaries
        run: |
          git rm .github/scripts/fix-step10-startup.py .github/workflows/fix-step10-startup.yml
          git commit -m "Remove temporarios da etapa 10"
          git push origin HEAD:cloudflare-provedor-plus
