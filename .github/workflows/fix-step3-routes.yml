name: fix-step3-routes
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths:
      - '.github/workflows/fix-step3-routes.yml'
      - '.github/fix-step3-routes.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Aplicar etapa 3
        run: python .github/fix-step3-routes.py
      - name: Validar JavaScript
        run: node --check bootstrap.js
      - name: Publicar e limpar aplicador
        run: |
          rm -f .github/fix-step3-routes.py .github/workflows/fix-step3-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js index.html .github/fix-step3-routes.py .github/workflows/fix-step3-routes.yml
          git commit -m "Corrige controle das telas e rotas - etapa 3"
          git push origin HEAD:cloudflare-provedor-plus
