name: fix-step4-sync
on:
  push:
    paths:
      - '.github/workflows/fix-step4-sync.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Aplicar etapa 4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cloud_path=Path('cloud-state-store.js')
          cloud=cloud_path.read_text(encoding='utf-8')
          cloud=cloud.replace('  let retryDelay=1200;\n','  let retryDelay=1200;\n  let prepareGeneration=0;\n',1)
          start=cloud.find('  async function prepare(){')
          end=cloud.find('\n  async function forceSync(){',start)
          if start<0 or end<0: raise SystemExit('prepare nao encontrado')
          prepare='''  async function prepare(){
            installHook();
            const generation=++prepareGeneration;
            const local=localRaw();
            let remote;
            try{remote=await cloud('state.get')}catch(error){
              if(generation!==prepareGeneration)return {source:'stale-ignored',updatedAt:null};
              throw new Error(`Não foi possível conectar ao banco da nuvem: ${error?.message||error}`);
            }
            if(generation!==prepareGeneration)return {source:'stale-ignored',updatedAt:null};
            if(remote?.state&&typeof remote.state==='object'){
              const raw=JSON.stringify(remote.state);
              if(generation!==prepareGeneration)return {source:'stale-ignored',updatedAt:null};
              nativeSet.call(window.localStorage,KEY,raw);restoreAux(remote.state);latestRaw=raw;lastSyncedRaw=raw;
              return {source:'cloud',updatedAt:remote.updated_at||null};
            }
            if(local){
              let state=parse(local);
              if(state&&typeof state==='object'){
                if(generation!==prepareGeneration)return {source:'stale-ignored',updatedAt:null};
                state=collectAux(state);
                const saved=await cloud('state.save',{state});
                if(generation!==prepareGeneration)return {source:'stale-ignored',updatedAt:null};
                const raw=JSON.stringify(saved?.state||state);
                nativeSet.call(window.localStorage,KEY,raw);latestRaw=raw;lastSyncedRaw=raw;
                return {source:'local-migrated',updatedAt:saved?.updated_at||null};
              }
            }
            return {source:'empty',updatedAt:null};
          }

          function cancelPrepare(){prepareGeneration++}
          '''
          cloud=cloud[:start]+prepare+cloud[end:]
          old='  window.ProvedorPlusCloudState={prepare,forceSync,wrapApi,getState:()=>parse(localRaw())};'
          new='  window.ProvedorPlusCloudState={prepare,cancelPrepare,forceSync,wrapApi,getState:()=>parse(localRaw())};'
          if old not in cloud: raise SystemExit('export CloudState nao encontrado')
          cloud=cloud.replace(old,new,1)
          cloud_path.write_text(cloud,encoding='utf-8')

          boot_path=Path('bootstrap.js')
          boot=boot_path.read_text(encoding='utf-8')
          boot=boot.replace("const BUILD_TOKEN='20260831-step3-routes1';","const BUILD_TOKEN='20260831-step4-sync1';",1)
          start=boot.find("  await loadScript('/cloud-state-store.js?v=1017-cloud17-audit1');")
          end=boot.find("  const currentState=window.ProvedorPlusCloudState.getState()||{};",start)
          if start<0 or end<0: raise SystemExit('bootstrap CloudState nao encontrado')
          block='''  await loadScript('/cloud-state-store.js?v=20260831-step4-sync1');
          if(!window.ProvedorPlusCloudState?.prepare)throw new Error('A sincronização com o banco da nuvem não foi carregada.');
          const prepareTask=window.ProvedorPlusCloudState.prepare().then(result=>({kind:'ready',result})).catch(error=>({kind:'error',error}));
          const prepareOutcome=await Promise.race([prepareTask,new Promise(resolve=>setTimeout(()=>resolve({kind:'timeout'}),1200))]);
          if(prepareOutcome.kind==='timeout'){
            window.ProvedorPlusCloudState.cancelPrepare?.();
            console.warn('Provedor Plus: resposta atrasada do banco remoto foi invalidada; seguindo com o estado local.');
          }else if(prepareOutcome.kind==='error'){
            console.warn('Provedor Plus: estado remoto indisponível na abertura; seguindo com o estado local.',prepareOutcome.error);
          }
          '''
          boot=boot[:start]+block+boot[end:]
          boot_path.write_text(boot,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          old='/bootstrap.js?v=20260831-step3-routes1'
          if old not in index: raise SystemExit('token index nao encontrado')
          index_path.write_text(index.replace(old,'/bootstrap.js?v=20260831-step4-sync1',1),encoding='utf-8')

          if 'function cancelPrepare(){prepareGeneration++}' not in cloud: raise SystemExit('cancelPrepare ausente')
          if "prepareOutcome.kind==='timeout'" not in boot: raise SystemExit('timeout controlado ausente')
          print('ETAPA 4 VALIDADA')
          PY
      - name: Validar JavaScript
        run: |
          node --check bootstrap.js
          node --check cloud-state-store.js
      - name: Publicar e limpar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-step4-sync.yml
          git add bootstrap.js cloud-state-store.js index.html .github/workflows/fix-step4-sync.yml
          git commit -m 'Corrige corrida da sincronizacao na abertura - etapa 4'
          git push origin HEAD:cloudflare-provedor-plus
