name: fix-step5-dedupe
on:
  push:
    paths:
      - '.github/fix-step5-dedupe.py'
      - '.github/workflows/fix-step5-dedupe.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Aplicar etapa 5
        run: python .github/fix-step5-dedupe.py
      - name: Validar JavaScript
        run: |
          node --check cloud-state-store.js
          node --check worker-native-api.js
          node --check bootstrap.js
      - name: Publicar e limpar aplicador
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-state-store.js worker-native-api.js bootstrap.js index.html
          git commit -m 'Deduplica sincronizacao do estado - etapa 5'
          git rm .github/fix-step5-dedupe.py .github/workflows/fix-step5-dedupe.yml
          git commit -m 'Remove aplicador temporario da etapa 5'
          git push origin HEAD:cloudflare-provedor-plus
