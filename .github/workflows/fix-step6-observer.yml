name: fix-step6-observer
on:
  push:
    paths:
      - '.github/workflows/fix-step6-observer.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Patch observer scope
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='ui-runtime-fixes.js';
          let s=fs.readFileSync(p,'utf8');
          const old="const observer=new MutationObserver(()=>patchStatic());observer.observe(document.documentElement,{childList:true,subtree:true});";
          const neu=`let observedShell=null,shellObserver=null,rootObserver=null,rebindTimer=null;\n  const bindObserver=()=>{\n    const shell=document.querySelector('.app-shell');\n    if(shell===observedShell)return;\n    shellObserver?.disconnect();shellObserver=null;observedShell=shell||null;\n    if(shell){shellObserver=new MutationObserver(()=>patchStatic());shellObserver.observe(shell,{childList:true,subtree:true})}\n  };\n  const scheduleRebind=()=>{clearTimeout(rebindTimer);rebindTimer=setTimeout(()=>{bindObserver();patchStatic()},30)};\n  const root=document.getElementById('root');\n  if(root){rootObserver=new MutationObserver(()=>scheduleRebind());rootObserver.observe(root,{childList:true})}\n  bindObserver();`;
          if(!s.includes(old))throw new Error('observer global esperado nao encontrado');
          s=s.replace(old,neu);
          fs.writeFileSync(p,s);

          let b=fs.readFileSync('bootstrap.js','utf8');
          b=b.replace("/ui-runtime-fixes.js?v=20260831-step2-plans1","/ui-runtime-fixes.js?v=20260831-step6-observer1");
          b=b.replace("const BUILD_TOKEN='20260831-step5-dedupe1'","const BUILD_TOKEN='20260831-step6-observer1'");
          fs.writeFileSync('bootstrap.js',b);

          let i=fs.readFileSync('index.html','utf8');
          i=i.replace('/bootstrap.js?v=20260831-step5-dedupe1','/bootstrap.js?v=20260831-step6-observer1');
          fs.writeFileSync('index.html',i);
          NODE
      - name: Validate
        run: |
          node --check ui-runtime-fixes.js
          node --check bootstrap.js
          ! grep -Fq "observer.observe(document.documentElement,{childList:true,subtree:true})" ui-runtime-fixes.js
          grep -Fq "shellObserver.observe(shell,{childList:true,subtree:true})" ui-runtime-fixes.js
          grep -Fq "rootObserver.observe(root,{childList:true})" ui-runtime-fixes.js
          grep -Fq "20260831-step6-observer1" bootstrap.js index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-runtime-fixes.js bootstrap.js index.html
          git commit -m "Limita observer global da interface - etapa 6"
          git push origin HEAD:cloudflare-provedor-plus
      - name: Cleanup workflow
        run: |
          git pull --rebase origin cloudflare-provedor-plus
          git rm .github/workflows/fix-step6-observer.yml
          git commit -m "Remove aplicador temporario da etapa 6"
          git push origin HEAD:cloudflare-provedor-plus
