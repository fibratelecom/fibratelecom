name: fix-step7-permissions
on:
  push:
    paths:
      - '.github/workflows/fix-step7-permissions.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
      - name: Patch permissions
        run: |
          node <<'NODE'
          const fs=require('fs');

          let b=fs.readFileSync('bootstrap.js','utf8');
          const authOld="const auth=await window.ProvedorPlusAuth.ensure();";
          const authNew="const auth=await window.ProvedorPlusAuth.ensure();\n  window.__PROVEDOR_PLUS_AUTH__=auth;";
          if(!b.includes(authOld))throw new Error('bootstrap auth marker not found');
          b=b.replace(authOld,authNew);
          b=b.replace("const BUILD_TOKEN='20260831-step6-observer1'","const BUILD_TOKEN='20260831-step7-permissions1'");
          b=b.replace('/dashboard-transition-guard.js?v=20260831-step1-menu1','/dashboard-transition-guard.js?v=20260831-step7-permissions1');
          b=b.replace('/staff-access.js?v=1017-staff1','/staff-access.js?v=20260831-step7-permissions1');
          fs.writeFileSync('bootstrap.js',b);

          let s=fs.readFileSync('staff-access.js','utf8');
          const permOld="if(t.includes('chamado'))return'tickets';if(t.includes('rede')||t.includes('mikrotik'))return'network';if(t.includes('configur'))return'admin';";
          const permNew="if(t.includes('chamado'))return'tickets';if(t.includes('integracao'))return'admin';if(t.includes('rede')||t.includes('mikrotik'))return'network';if(t.includes('configur'))return'admin';";
          if(!s.includes(permOld))throw new Error('staff permission marker not found');
          s=s.replace(permOld,permNew);
          fs.writeFileSync('staff-access.js',s);

          let d=fs.readFileSync('dashboard-transition-guard.js','utf8');
          const varOld="let hubButton=null,popup=null,layer=null,timer=null,navObserver=null;";
          const varNew="let hubButton=null,popup=null,layer=null,timer=null,navObserver=null;\n  const integrationAllowed=()=>window.__PROVEDOR_PLUS_AUTH__?.user?.role==='admin';";
          if(!d.includes(varOld))throw new Error('integration state marker not found');
          d=d.replace(varOld,varNew);

          const closeOld="function closePopup(){clearTimeout(timer);timer=null;if(popup)popup.hidden=true;hubButton?.setAttribute('aria-expanded','false')}";
          const closeNew="function closePopup(){clearTimeout(timer);timer=null;if(popup)popup.hidden=true;hubButton?.setAttribute('aria-expanded','false')}\n  function denyIntegration(){closePopup();popup?.remove();popup=null;hubButton?.remove();hubButton=null;if(layer){layer.remove();layer=null}contentRoot()?.classList.remove('pp-integration-hub-active')}";
          if(!d.includes(closeOld))throw new Error('closePopup marker not found');
          d=d.replace(closeOld,closeNew);

          d=d.replace("function showPopup(){ensureButton();if(!popup||!hubButton)return;","function showPopup(){if(!integrationAllowed()){denyIntegration();return}ensureButton();if(!popup||!hubButton)return;");
          d=d.replace("function buildPopup(){if(popup?.isConnected)return;","function buildPopup(){if(!integrationAllowed()){denyIntegration();return}if(popup?.isConnected)return;");
          d=d.replace("function openHost(){closePopup();const c=contentRoot();","function openHost(){if(!integrationAllowed()){denyIntegration();return null}closePopup();const c=contentRoot();");

          const ensureMarker="function ensureButton(){\n    styles();";
          const ensureReplacement="function ensureButton(){\n    if(!integrationAllowed()){denyIntegration();return}\n    styles();";
          if(!d.includes(ensureMarker))throw new Error('ensureButton marker not found');
          d=d.replace(ensureMarker,ensureReplacement);
          fs.writeFileSync('dashboard-transition-guard.js',d);

          let i=fs.readFileSync('index.html','utf8');
          i=i.replace('/bootstrap.js?v=20260831-step6-observer1','/bootstrap.js?v=20260831-step7-permissions1');
          fs.writeFileSync('index.html',i);
          NODE
      - name: Validate
        run: |
          node --check bootstrap.js
          node --check staff-access.js
          node --check dashboard-transition-guard.js
          grep -Fq "window.__PROVEDOR_PLUS_AUTH__=auth" bootstrap.js
          grep -Fq "t.includes('integracao'))return'admin'" staff-access.js
          grep -Fq "const integrationAllowed=()=>window.__PROVEDOR_PLUS_AUTH__?.user?.role==='admin'" dashboard-transition-guard.js
          grep -Fq "if(!integrationAllowed()){denyIntegration();return}" dashboard-transition-guard.js
          grep -Fq "if(!integrationAllowed()){denyIntegration();return null}" dashboard-transition-guard.js
          grep -Fq "20260831-step7-permissions1" bootstrap.js index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap.js staff-access.js dashboard-transition-guard.js index.html
          git commit -m "Protege Integracao e areas administrativas - etapa 7"
          git push origin HEAD:cloudflare-provedor-plus
      - name: Cleanup workflow
        run: |
          git pull --rebase origin cloudflare-provedor-plus
          git rm .github/workflows/fix-step7-permissions.yml
          git commit -m "Remove aplicador temporario da etapa 7"
          git push origin HEAD:cloudflare-provedor-plus
