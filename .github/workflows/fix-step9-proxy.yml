name: fix-step9-proxy
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/fix-step9-proxy.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply patch
        run: python3 .github/step9-patch.py
      - name: Validate
        run: |
          node --check worker.js
          grep -q "requirePanelPermission(request,env,'billing')" worker.js
          grep -q "requirePanelPermission(request,env,'network')" worker.js
          grep -q "proxySpecializedApi(request,env)" worker.js
          grep -q "cloudflare-service" worker.js
      - name: Commit functional change
        run: |
          git add worker.js
          git commit -m "Protege proxies especializados - etapa 9"
      - name: Cleanup temporaries
        run: |
          git rm .github/workflows/fix-step9-proxy.yml .github/step9-patch.py
          git commit -m "Remove temporarios da etapa 9"
          git push origin HEAD:cloudflare-provedor-plus
