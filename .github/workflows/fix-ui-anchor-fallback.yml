name: fix-ui-anchor-fallback
on:
  push:
    branches:
      - cloudflare-provedor-plus
    paths:
      - .github/workflows/fix-ui-anchor-fallback.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Apply structural fix
        run: python3 .github/scripts/fix-ui-anchor-fallback.py
      - name: Validate files
        run: |
          node --check bootstrap.js
          node --check dashboard-transition-guard.js
          grep -q '20260831-uiatomic3' bootstrap.js
          grep -q 'systemRow?.nextSibling' dashboard-transition-guard.js
          grep -q "else if(!anchor&&!b.isConnected)nav.appendChild(b)" dashboard-transition-guard.js
      - name: Commit correction
        run: |
          git add bootstrap.js dashboard-transition-guard.js index.html
          git commit -m 'Corrige âncoras de Cliente e Integração na abertura'
          git push origin HEAD:cloudflare-provedor-plus
      - name: Remove temporary applicator
        run: |
          git pull --rebase origin cloudflare-provedor-plus
          git rm .github/scripts/fix-ui-anchor-fallback.py .github/workflows/fix-ui-anchor-fallback.yml
          git commit -m 'Remove aplicador temporário da correção de montagem'
          git push origin HEAD:cloudflare-provedor-plus
