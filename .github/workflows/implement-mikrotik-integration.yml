name: Implement MikroTik Integration
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: ['.github/workflows/implement-mikrotik-integration.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Implementar e validar Servidor MikroTik
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda v: base64.b64decode(v).decode('utf-8')
          old=dec('')
          new=dec('')
          css_marker=dec('LnBwLWJhbmstc2VjdXJle2Rpc3BsYXk6ZmxleDthbGlnbi1pdGVtczpjZW50ZXI7Z2FwOjZweDttYXJnaW4tdG9wOjEwcHg7Y29sb3I6IzYxNzM2ZTtmb250LXNpemU6OXB4fQ==')
          css_add=dec('')
          p=Path('dashboard-transition-guard.js');s=p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('placeholder renderMikrotik nao encontrado')
          s=s.replace(old,new,1)
          if '.pp-router-grid{' not in s:
              if css_marker not in s: raise SystemExit('marcador CSS nao encontrado')
              s=s.replace(css_marker,css_add,1)
          s=s.replace('@media(max-width:980px){.pp-bank-grid,.pp-bank-summary{grid-template-columns:1fr}','@media(max-width:980px){.pp-router-grid,.pp-bank-grid,.pp-bank-summary{grid-template-columns:1fr}',1)
          p.write_text(s,encoding='utf-8')
          bp=Path('bootstrap.js');b=bp.read_text(encoding='utf-8')
          if '20260831-bankapi4' not in b: raise SystemExit('BUILD_TOKEN esperado nao encontrado')
          bp.write_text(b.replace('20260831-bankapi4','20260831-mikrotik-api1',1),encoding='utf-8')
          ip=Path('index.html');i=ip.read_text(encoding='utf-8')
          if '20260831-bankapi4' not in i: raise SystemExit('token do bootstrap no index nao encontrado')
          ip.write_text(i.replace('20260831-bankapi4','20260831-mikrotik-api1',1),encoding='utf-8')
          PY
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          grep -q 'Salvar e conectar' dashboard-transition-guard.js
          grep -q 'api.mikrotik.sync' dashboard-transition-guard.js
          grep -q '20260831-mikrotik-api1' bootstrap.js
          grep -q '20260831-mikrotik-api1' index.html
      - name: Publicar e limpar workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-mikrotik-integration.yml
          git add dashboard-transition-guard.js bootstrap.js index.html
          git commit -m 'Ativa API do Servidor MikroTik no novo Integracao'
          git push origin HEAD:cloudflare-provedor-plus
