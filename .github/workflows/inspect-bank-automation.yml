name: Apply Server Automation Bridge

on:
  push:
    branches:
      - fix/global-navigation-duplication
    paths:
      - .github/workflows/inspect-bank-automation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
          fetch-depth: 0
      - name: Apply bridge patch
        run: python .github/scripts/apply-automation-bridge.py
      - name: Validate JavaScript
        run: |
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          node --check lib/automation-handler.js
          node --check api/automation.js
          node --check api/cloud-state.js
          node --check lib/cloud-data-handler.js
          node --check /tmp/bridge.js
          node --check bootstrap.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Validate automation rules
        run: |
          grep -q "automation.bank.save" /tmp/bridge.js
          grep -q "syncAutomationBankVault" /tmp/bridge.js
          if grep -q "slice(0,100)" /tmp/bridge.js; then exit 1; fi
          grep -q '"/api/automation"' vercel.json
          grep -Fq '"*/5 * * * *"' vercel.json
      - name: Commit integration
        run: |
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add lib/automation-handler.js bootstrap.js packed/bridgegz-*.txt
          git commit -m "Integra automação 24h ao banco e ao painel"
          git push origin HEAD:fix/global-navigation-duplication
