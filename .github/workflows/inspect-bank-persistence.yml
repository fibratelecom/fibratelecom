name: Inspect Bank Persistence

on:
  push:
    branches:
      - fix/global-navigation-duplication

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct bundles
        run: |
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
      - name: Inspect bank persistence implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ['/tmp/app.js','/tmp/bridge.js']:
              s=Path(path).read_text(errors='replace')
              print('\n\n######## FILE',path,'########')
              needles=['saveEfi','saveMercadoPago','saveDefault','testEfi','testMercadoPago','banks:','bank-proxy','enabled','clientIdConfigured','accessTokenConfigured']
              for needle in needles:
                  print('\n###',needle)
                  start=0; found=0
                  while True:
                      i=s.find(needle,start)
                      if i<0: break
                      found+=1
                      print('POS',i)
                      print(s[max(0,i-2200):min(len(s),i+3600)])
                      print('\n---END CONTEXT---')
                      start=i+len(needle)
                      if found>=5: break
                  if not found: print('NOT FOUND')
          PY
