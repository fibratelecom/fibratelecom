name: Inspect Fatura Flow
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/inspect-fatura-flow.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
      - name: Rebuild packed sources
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
          node --check /tmp/proxy.js
      - name: Print exact invoice persistence and logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('/tmp/app.js').read_text(errors='replace')
          bridge=Path('/tmp/bridge.js').read_text(errors='replace')
          proxy=Path('/tmp/proxy.js').read_text(errors='replace')
          def show(label,text,term,radius=900,limit=4):
              low=text.lower(); t=term.lower(); pos=0; n=0
              while n<limit:
                  i=low.find(t,pos)
                  if i<0: break
                  print(f'\n### {label} :: {term} :: {i}')
                  print(text[max(0,i-radius):min(len(text),i+radius)])
                  pos=i+len(t); n+=1
          for term in ['bank_line','bank_barcode','bank_url','bank_pdf_url','pix_code','qr_code','bank_provider']:
              show('BRIDGE',bridge,term,1200,6)
          for term in ['invoiceHtml(i)','previewInvoiceWeb','downloadInvoiceWeb']:
              show('BRIDGE',bridge,term,1800,2)
          for term in ['Conexão que aproxima','Conexao que aproxima','data:image','logo','Fibra+']:
              show('APP',app,term,700,5)
          for term in ['bank_line','bank_barcode','pix_code','qr_code']:
              show('PROXY',proxy,term,900,4)
          PY
