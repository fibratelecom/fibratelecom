name: Inspect Fatura Flow
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/inspect-fatura-flow.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
      - name: Rebuild packed app
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
      - name: Inspect billing UI and invoice shape
        run: |
          python - <<'PY'
          from pathlib import Path
          texts={'APP':Path('/tmp/app.js').read_text(errors='replace'),'BRIDGE':Path('/tmp/bridge.js').read_text(errors='replace')}
          terms=['Boletos de ','Gerar cobrança para este cliente','bill-create-actions','Visualizar boleto','Baixar PDF','linha digitável','linha digitavel','barcode','bank_url','boleto_url','payment_url','invoice_number','reference','Mensalidade','generateInstallments','invoices:{','invoices =','invoices:']
          for label,text in texts.items():
              print('\n===== '+label+' =====')
              low=text.lower()
              for term in terms:
                  t=term.lower(); start=0; hits=0
                  while hits<6:
                      idx=low.find(t,start)
                      if idx<0: break
                      print(f'\n--- TERM {term!r} @ {idx} ---')
                      print(text[max(0,idx-1500):min(len(text),idx+5000)])
                      start=idx+len(t); hits+=1
          PY
