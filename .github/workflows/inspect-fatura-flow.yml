name: Inspect Fatura Flow
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/inspect-fatura-flow.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
      - name: Rebuild packed sources
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          cat packed/proxygz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/proxy.js
          node --check /tmp/app.js
          node --check /tmp/bridge.js
          node --check /tmp/proxy.js
      - name: Inspect bank return fields and company settings
        run: |
          python - <<'PY'
          from pathlib import Path
          texts={
            'PROXY':Path('/tmp/proxy.js').read_text(errors='replace'),
            'BRIDGE':Path('/tmp/bridge.js').read_text(errors='replace'),
            'APP':Path('/tmp/app.js').read_text(errors='replace'),
          }
          terms={
            'PROXY':['bank_pdf_url','bank_ticket_url','bank_payment_url','bank_pix_code','barcode','bar_code','linha','digitable','ticket_url','pdf_url','pix_code','payment_url','issueMercado','mercadoPago','efi'],
            'BRIDGE':['invoiceHtml(i)','bank_pdf_url','bank_ticket_url','bank_payment_url','bank_pix_code','client_document','client_contract_number','settings:{','company_name'],
            'APP':['Configurações','company_name','Razão social','CNPJ','Telefone','E-mail','auto_block','onSave:e=>void Ce(()=>g().settings.save']
          }
          for label,text in texts.items():
              print('\n===== '+label+' =====')
              low=text.lower()
              for term in terms[label]:
                  t=term.lower(); start=0; hits=0
                  while hits<8:
                      idx=low.find(t,start)
                      if idx<0: break
                      print(f'\n--- TERM {term!r} @ {idx} ---')
                      print(text[max(0,idx-1800):min(len(text),idx+6500)])
                      start=idx+len(t); hits+=1
          PY
