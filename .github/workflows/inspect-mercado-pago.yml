name: Inspect Mercado Pago

on:
  push:
    branches:
      - fix/efi-authorization-diagnostics

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect bank proxy
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const chunks=['01','02','03'].map(n=>fs.readFileSync(`packed/proxygz-${n}.txt`,'utf8').trim()).join('');
          const source=zlib.gunzipSync(Buffer.from(chunks,'base64')).toString('utf8');
          fs.writeFileSync('/tmp/bank-proxy-source.js',source);
          NODE
          grep -n -C 5 -E "mercadoPago|mercadopago|users/me|accessToken" /tmp/bank-proxy-source.js || true
