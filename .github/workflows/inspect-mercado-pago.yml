name: Apply Mercado Pago Fix

on:
  push:
    branches:
      - fix/efi-authorization-diagnostics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate
        run: node .tmp-fix-mp.js
      - name: Save bank proxy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packed/proxygz-01.txt packed/proxygz-02.txt packed/proxygz-03.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrige autenticação e emissão Mercado Pago"
          git push
