name: Inspect Staff Navigation
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/inspect-staff-nav.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
      - name: Inspect staff access source
        run: |
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(errors='replace')
          for needle in ['Funcionários','Funcionarios','Usuários','Usuarios']:
              starts=[]; pos=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  starts.append(i); pos=i+1
              print(f'=== {needle}: {starts[:10]} ===')
              for i in starts[:4]:
                  print(s[max(0,i-700):i+1000].replace('\n',' ')[:1700])
          PY
