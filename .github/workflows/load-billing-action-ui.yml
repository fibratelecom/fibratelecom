name: Load Billing Action UI

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load and validate billing action UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('bootstrap.js')
          s=p.read_text()
          marker="  await loadScriptStable('/billing-bank-selector.js?v=1017-billingbank3',{ignoreWithin:['.pp-dashboard-v2','.client-status-modal','.pp-ticket-layer','.pp-staff-layer','.pp-pppoe-modal-layer']}).catch(error=>console.error('Provedor Plus: a seleção do banco emissor não foi carregada.',error));\n"
          addition=marker+"  await loadScript('/billing-action-ui.js?v=1017-billingactions1').catch(error=>console.error('Provedor Plus: os botões de cobrança não foram ajustados.',error));\n"
          if '/billing-action-ui.js?v=1017-billingactions1' not in s:
              if s.count(marker)!=1: raise SystemExit('Billing selector marker not found exactly once')
              p.write_text(s.replace(marker,addition,1))
          PY
          node --check bootstrap.js
          node --check billing-action-ui.js
          grep -Fq "billing-action-ui.js?v=1017-billingactions1" bootstrap.js
          grep -Fq "grid-template-columns:repeat(4,minmax(118px,1fr))" billing-action-ui.js
          grep -Fq "setProvider(select,'efi')" billing-action-ui.js
          grep -Fq "ppProviderDisabled" billing-action-ui.js
          git fetch origin main
          if ! git diff --quiet origin/main -- packed/appgz-*.txt packed/bridgegz-*.txt packed/proxygz-*.txt; then
            echo 'Packed application or bank proxy differs from main unexpectedly.'
            exit 1
          fi
          if git diff --quiet -- bootstrap.js; then
            echo 'Bootstrap loader already applied.'
            exit 0
          fi
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add bootstrap.js
          git commit -m 'Carrega ajuste dos botões de cobrança'
          git push origin HEAD:fix/global-navigation-duplication
