name: one-shot-area-cliente-bloqueio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-area-cliente-bloqueio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implementar contexto de bloqueio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer-service-worker.js')
          s=p.read_text()
          anchor="function contractDateTime(value){if(!value)return '';const date=new Date(value);if(Number.isNaN(date.getTime()))return '';return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(date)}\n"
          helper="""function portalAccessBlock(client,state,portal={},contractId='primary'){\n  const local=localClient(state,client?.id)||{},status=text(portal?.client?.status||client?.status),statusKey=normalize(status),blocked=/bloqueado|suspenso/.test(statusKey),primary=text(contractId||'primary')==='primary',automatic=blocked&&primary&&local?.auto_blocked_by_system===true,trustUntil=text(local?.trust_release_until),trustDate=trustUntil?new Date(trustUntil):null,trustActive=Boolean(trustDate&&!Number.isNaN(trustDate.getTime())&&trustDate.getTime()>Date.now());\n  return {blocked,source:blocked?(automatic?'automatic':'manual'):'',status,reason:automatic?text(local?.auto_block_reason):'',contractId:text(contractId||'primary'),trustActive,trustUntil};\n}\n"""
          if helper not in s:
              if anchor not in s: raise SystemExit('anchor helper not found')
              s=s.replace(anchor,anchor+helper,1)
          old="const sql=neon(env.DATABASE_URL),client=await portalClient(sql,clientId);if(!client)return response;const state=await loadState(sql),contractId=action==='login'?'primary':text(requestBody?.data?.contractId)||'primary',live=!contractId.startsWith('primary')&&isConnectionAction(action),scoped=await scopePortalToContract(portal,client,state,env,contractId,live);\n    if(topPortal)body.data=scoped;else body.data={...body.data,portal:scoped};"
          new="const sql=neon(env.DATABASE_URL),client=await portalClient(sql,clientId);if(!client)return response;const state=await loadState(sql),contractId=action==='login'?'primary':text(requestBody?.data?.contractId)||'primary',live=!contractId.startsWith('primary')&&isConnectionAction(action),scoped=await scopePortalToContract(portal,client,state,env,contractId,live),accessBlock=portalAccessBlock(client,state,scoped,contractId),scopedWithBlock={...scoped,accessBlock,client:{...(scoped?.client||{}),accessBlock}};\n    if(topPortal)body.data=scopedWithBlock;else body.data={...body.data,portal:scopedWithBlock};"
          if old not in s: raise SystemExit('augment anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check customer-service-worker.js
          git diff --check
          git diff -- customer-service-worker.js
      - name: Publicar backend e limpar workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-service-worker.js
          git commit -m 'Expõe motivo do bloqueio para Área do Cliente'
          git push origin HEAD:main HEAD:cloudflare-provedor-plus
          git rm .github/workflows/one-shot-area-cliente-bloqueio.yml
          git commit -m 'Remove workflow temporário do aviso de bloqueio'
          git push origin HEAD:main HEAD:cloudflare-provedor-plus
