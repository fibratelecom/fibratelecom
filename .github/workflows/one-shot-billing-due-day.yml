name: one-shot-billing-due-day
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-billing-due-day.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Permitir mensalidade normal no dia do vencimento
        shell: python
        run: |
          from pathlib import Path
          p=Path('billing-cron.js')
          s=p.read_text(encoding='utf-8')
          old="""  const diff=daysBetween(today,due);\n  if(diff<1||diff>daysBefore)return null;\n  return due;\n}"""
          new="""  const diff=daysBetween(today,due);\n  if(diff<0||diff>daysBefore)return null;\n  return due;\n}"""
          if old not in s:
              raise SystemExit('Trecho alvo de currentDueCandidate não encontrado ou já alterado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validar alteração
        run: |
          node --check billing-cron.js
          git diff --check
          git diff -- billing-cron.js
      - name: Publicar nas duas branches e limpar workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing-cron.js
          git commit -m "Gera mensalidade normal também no dia do vencimento"
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          git push origin "$FINAL_SHA":cloudflare-provedor-plus
          git rm .github/workflows/one-shot-billing-due-day.yml
          git commit -m "Remove workflow temporário de correção do faturamento"
          CLEAN_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          git push origin "$CLEAN_SHA":cloudflare-provedor-plus
