name: one-shot-billing-recovery

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-billing-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção pontual
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'billing-cron.js';
          const source = fs.readFileSync(path, 'utf8');
          const target = "  if(!force&&text(state.settings.billing_cloudflare_last_run)===today)return {alreadyRan:true,date:today,generated:0,issued:0,skipped:0,failed:0,errors:[]};\n";
          if (!source.includes(target)) {
            console.error('Trava diária esperada não encontrada. Nada alterado.');
            process.exit(1);
          }
          const next = source.replace(target, '');
          if ((next.match(/async function runBillingCron\(/g) || []).length !== 1) {
            console.error('Implementação de runBillingCron fora do padrão esperado.');
            process.exit(1);
          }
          fs.writeFileSync(path, next);
          NODE
          node --check billing-cron.js
          git rm .github/workflows/one-shot-billing-recovery.yml
          git diff --check
      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recupera mensalidades pendentes a cada ciclo'
          git push origin HEAD:main
