name: one-shot-card-fee
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-card-fee.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar taxa fixa somente no cartão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="const CUSTOMER_PORTAL_PATH='/api/customer-portal';\nconst PROTOCOLS_PATH='/api/protocols';"
          new="const CUSTOMER_PORTAL_PATH='/api/customer-portal';\nconst PROTOCOLS_PATH='/api/protocols';\nconst CARD_PAYMENT_FEE_CENTS=500;"
          if old not in s:
              raise SystemExit('ponto de constante não encontrado')
          s=s.replace(old,new,1)

          old="async function paymentPrepareForSession(env,data){const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId),late=invoiceLateBreakdown(invoice,ctx.state),meta=invoiceBillingMeta(invoice),card=text(data?.method).toLowerCase()==='card',discountCents=card?0:cashbackDiscountCents(ctx.state,ctx.client,invoice),amountCents=Math.max(0,late.totalCents-discountCents);return {invoiceId:invoice.id,reference:invoiceReference(invoice),billingLabel:meta.label,billingKind:meta.kind,dueDate:formatDate(invoice.due_date||invoice.dueDate),originalAmount:late.baseCents/100,daysOverdue:late.daysOverdue,fineAmount:late.fineCents/100,interestAmount:late.interestCents/100,updatedAmount:late.totalCents/100,amountBeforeDiscount:late.totalCents/100,cashbackDiscount:discountCents/100,cashbackBalance:cashbackBalanceCents(ctx.state,ctx.client,invoice)/100,cashbackAvailable:cashbackAvailableCents(ctx.state,ctx.client,invoice)/100,amount:amountCents/100,amountCents,payer:{name:text(ctx.client.name),email:text(ctx.client.email),identification:{type:digits(ctx.client.document).length===14?'CNPJ':'CPF',number:digits(ctx.client.document)}}};}"
          new="async function paymentPrepareForSession(env,data){const ctx=await portalPaymentContext(env,data),invoice=portalPaymentInvoice(ctx.state,ctx.client,data?.invoiceId),late=invoiceLateBreakdown(invoice,ctx.state),meta=invoiceBillingMeta(invoice),card=text(data?.method).toLowerCase()==='card',discountCents=card?0:cashbackDiscountCents(ctx.state,ctx.client,invoice),cardFeeCents=card?CARD_PAYMENT_FEE_CENTS:0,amountCents=Math.max(0,late.totalCents-discountCents+cardFeeCents);return {invoiceId:invoice.id,reference:invoiceReference(invoice),billingLabel:meta.label,billingKind:meta.kind,dueDate:formatDate(invoice.due_date||invoice.dueDate),originalAmount:late.baseCents/100,daysOverdue:late.daysOverdue,fineAmount:late.fineCents/100,interestAmount:late.interestCents/100,updatedAmount:late.totalCents/100,amountBeforeDiscount:late.totalCents/100,cashbackDiscount:discountCents/100,cashbackBalance:cashbackBalanceCents(ctx.state,ctx.client,invoice)/100,cashbackAvailable:cashbackAvailableCents(ctx.state,ctx.client,invoice)/100,cardFee:cardFeeCents/100,cardFeeCents,amount:amountCents/100,amountCents,payer:{name:text(ctx.client.name),email:text(ctx.client.email),identification:{type:digits(ctx.client.document).length===14?'CNPJ':'CPF',number:digits(ctx.client.document)}}};}"
          if old not in s:
              raise SystemExit('paymentPrepareForSession não encontrado')
          s=s.replace(old,new,1)

          old="const payload={token:text(pd.token),transaction_amount:late.totalCents/100,installments:Math.max(1,Number(pd.installments)||1),payment_method_id:text(pd.payment_method_id),description:meta.label,external_reference:`PP-INV-${invoice.id}-CLI-${ctx.client.id}`,payer};"
          new="const payload={token:text(pd.token),transaction_amount:(late.totalCents+CARD_PAYMENT_FEE_CENTS)/100,installments:Math.max(1,Number(pd.installments)||1),payment_method_id:text(pd.payment_method_id),description:meta.label,external_reference:`PP-INV-${invoice.id}-CLI-${ctx.client.id}`,payer};"
          if old not in s:
              raise SystemExit('payload do cartão não encontrado')
          s=s.replace(old,new,1)

          old="updatedAmount:late.totalCents/100,amount:late.totalCents/100,portal};"
          new="updatedAmount:late.totalCents/100,cardFee:CARD_PAYMENT_FEE_CENTS/100,cardFeeCents:CARD_PAYMENT_FEE_CENTS,amount:(late.totalCents+CARD_PAYMENT_FEE_CENTS)/100,portal};"
          if old not in s:
              raise SystemExit('retorno do cartão não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check worker.js
          git diff --check
          git diff -- worker.js
      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'Adiciona taxa fixa de R$ 5 no cartão'
          git rm .github/workflows/one-shot-card-fee.yml
          git commit --amend --no-edit
          git push origin HEAD:main
