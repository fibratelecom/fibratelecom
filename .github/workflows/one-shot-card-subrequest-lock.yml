name: one-shot-card-subrequest-lock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-card-subrequest-lock.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Limitar subrequests da trava de estado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('notification-center-entry-worker.js')
          s=p.read_text()
          old="""  const sql=neon(env.DATABASE_URL),token=crypto.randomUUID(),deadline=Date.now()+Math.max(1000,Number(maxWaitMs)||20000);\n  while(Date.now()<deadline){"""
          new="""  const totalWaitMs=Math.max(1000,Number(maxWaitMs)||20000),sql=neon(env.DATABASE_URL),token=crypto.randomUUID(),deadline=Date.now()+totalWaitMs,maxAttempts=8,lockPollMs=Math.max(1000,Math.ceil(totalWaitMs/maxAttempts));\n  let attempts=0;\n  while(Date.now()<deadline&&attempts<maxAttempts){\n    attempts++;"""
          if old not in s:
              raise SystemExit('Cabeçalho da trava não encontrado')
          s=s.replace(old,new,1)
          old_wait="""    await wait(120+Math.floor(Math.random()*160));\n  }"""
          new_wait="""    const remaining=deadline-Date.now();\n    if(remaining>0)await wait(Math.min(lockPollMs,remaining));\n  }"""
          if old_wait not in s:
              raise SystemExit('Espera da trava não encontrada')
          s=s.replace(old_wait,new_wait,1)
          p.write_text(s)
          PY
          node --check notification-center-entry-worker.js
          git diff --check
          git diff -- notification-center-entry-worker.js
      - name: Publicar nas duas branches e limpar workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notification-center-entry-worker.js
          git rm .github/workflows/one-shot-card-subrequest-lock.yml
          git commit -m 'Evita excesso de subrequests no pagamento por cartão'
          git push origin HEAD:main HEAD:cloudflare-provedor-plus
