          replace_once('customer-service-worker.js',marker,helper,'contract traffic helper')
          p=Path('customer-service-worker.js'); s=p.read_text(); a=s.find('async function liveContractConnection(env,contract,client,base={}){'); b=s.find('\nfunction isConnectionAction',a)
          if a<0 or b<0: raise SystemExit('liveContractConnection block not found')
          live_contract=r'''async function liveContractConnection(env,contract,client,base={}){
