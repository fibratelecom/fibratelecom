          p.write_text(s[:a]+live_fn+s[b:])
          replace_once('worker.js','    client:portalClientData(client),',"    client:{...portalClientData(client),planSpeed:text((Array.isArray(state?.plans)?state.plans:[]).find(plan=>Number(plan?.id)===Number(client.plan_id))?.speed)},",'portal plan speed')

          # ---- customer-service-worker.js: consumo por contrato adicional e reinício seguro da sessão PPPoE.
