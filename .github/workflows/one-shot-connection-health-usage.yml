name: one-shot-connection-health-usage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-connection-health-usage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implementar backend de conexão e consumo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor not found: {label}')
              p.write_text(s.replace(old,new,1))

          def replace_block(path, start, end, new, label):
              p=Path(path); s=p.read_text(); a=s.find(start)
              if a<0: raise SystemExit(f'start not found: {label}')
              b=s.find(end,a)
              if b<0: raise SystemExit(f'end not found: {label}')
              p.write_text(s[:a]+new+s[b:])

          # ---- worker-native-api.js: ampliar armazenamento de tráfego existente, sem criar persistência paralela.
          p=Path('worker-native-api.js'); s=p.read_text()
          start="export async function recordTrafficForService(env,clientId,live){return trafficRecord(sqlFor(env),{clientId,live});}"
          end="\n\nfunction cashbackClient"
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0: raise SystemExit('traffic block not found')
          traffic_block=r'''export async function recordTrafficForService(env,clientId,live,scope='primary'){return trafficRecord(sqlFor(env),{clientId,live,scope});}
export async function readTrafficForService(env,clientId,scope='primary'){return trafficRead(sqlFor(env),clientId,scope);}
function trafficDateKey(date=new Date()){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date),map={};for(const part of parts)map[part.type]=part.value;return `${map.year}-${map.month}-${map.day}`}
function currentMonth(value=''){const month=text(value);return /^\d{4}-\d{2}$/.test(month)?month:trafficDateKey().slice(0,7)}
function trafficScope(value='primary'){const raw=text(value)||'primary';return raw==='primary'?'primary':(raw.replace(/[^A-Za-z0-9_-]/g,'_').slice(0,80)||'primary')}
function trafficKey(clientId,scope='primary'){const normalized=trafficScope(scope);return normalized==='primary'?`client_traffic_v1_${clientId}`:`client_traffic_v1_${clientId}_${normalized}`}
function trafficDaily(value=[]){return (Array.isArray(value)?value:[]).map(item=>({day:text(item?.day).slice(0,10),download_bytes:Math.max(0,Number(item?.download_bytes)||0),upload_bytes:Math.max(0,Number(item?.upload_bytes)||0)})).filter(item=>/^\d{4}-\d{2}-\d{2}$/.test(item.day)).sort((a,b)=>a.day.localeCompare(b.day)).slice(-62)}
function trafficEmpty(month=currentMonth()){return {month,download_bytes:0,upload_bytes:0,lastSession:'',lastDownload:0,lastUpload:0,lastAt:0,history:[],daily:[]}}
function trafficNormalized(value={},month=currentMonth()){let x={...trafficEmpty(month),...(value&&typeof value==='object'?value:{})};x.history=Array.isArray(x.history)?x.history:[];x.daily=trafficDaily(x.daily);if(x.month!==month){const history=x.month?[{month:x.month,download_bytes:Math.max(0,Number(x.download_bytes)||0),upload_bytes:Math.max(0,Number(x.upload_bytes)||0)},...x.history].filter((item,index,all)=>item?.month&&all.findIndex(other=>other?.month===item.month)===index).slice(0,12):x.history.slice(0,12);x={...trafficEmpty(month),history,daily:x.daily}}return x}
function trafficView(x={}){const daily=trafficDaily(x.daily),todayKey=trafficDateKey(),today=daily.find(item=>item.day===todayKey)||{day:todayKey,download_bytes:0,upload_bytes:0};return {current:{month:currentMonth(x.month),download_bytes:Math.max(0,Number(x.download_bytes)||0),upload_bytes:Math.max(0,Number(x.upload_bytes)||0)},today:{...today,total_bytes:(Number(today.download_bytes)||0)+(Number(today.upload_bytes)||0)},daily:daily.map(item=>({...item,total_bytes:(Number(item.download_bytes)||0)+(Number(item.upload_bytes)||0)})),history:(Array.isArray(x.history)?x.history:[]).slice(0,12).map(item=>({month:text(item?.month),download_bytes:Math.max(0,Number(item?.download_bytes)||0),upload_bytes:Math.max(0,Number(item?.upload_bytes)||0),total_bytes:Math.max(0,Number(item?.download_bytes)||0)+Math.max(0,Number(item?.upload_bytes)||0)}))}}
async function trafficRead(sql,clientId,scope='primary'){const id=num(clientId);if(!id)throw Object.assign(new Error('Cliente inválido para consultar tráfego.'),{statusCode:400});const row=await getSetting(sql,trafficKey(id,scope)),all=row?.value&&typeof row.value==='object'?row.value:trafficEmpty(),x=trafficNormalized(all);return trafficView(x)}
async function trafficRecord(sql,data={}){const clientId=num(data.clientId);if(!clientId)throw Object.assign(new Error('Cliente inválido para registrar tráfego.'),{statusCode:400});const month=currentMonth(data.month),key=trafficKey(clientId,data.scope),row=await getSetting(sql,key),all=row?.value&&typeof row.value==='object'?row.value:trafficEmpty(month),live=data.live&&typeof data.live==='object'?data.live:{},t=Date.now(),day=trafficDateKey();let x=trafficNormalized(all,month),downloadBps=Number(live.downloadBps)||0,uploadBps=Number(live.uploadBps)||0;if(live.online&&live.sessionId){const d=Math.max(0,Number(live.downloadBytes)||0),u=Math.max(0,Number(live.uploadBytes)||0),same=x.lastSession===String(live.sessionId),dd=same?Math.max(0,d-(Number(x.lastDownload)||0)):d,du=same?Math.max(0,u-(Number(x.lastUpload)||0)):u;if(!downloadBps&&same&&x.lastAt){const seconds=Math.max(.25,(t-Number(x.lastAt))/1000);downloadBps=Math.round(dd*8/seconds);uploadBps=Math.round(du*8/seconds)}x.download_bytes=(Number(x.download_bytes)||0)+dd;x.upload_bytes=(Number(x.upload_bytes)||0)+du;const daily=trafficDaily(x.daily);let item=daily.find(entry=>entry.day===day);if(!item){item={day,download_bytes:0,upload_bytes:0};daily.push(item)}item.download_bytes=(Number(item.download_bytes)||0)+dd;item.upload_bytes=(Number(item.upload_bytes)||0)+du;x.daily=trafficDaily(daily);x.lastSession=String(live.sessionId);x.lastDownload=d;x.lastUpload=u;x.lastAt=t}await setSetting(sql,key,x);return {...trafficView(x),downloadBps,uploadBps}}
'''
          p.write_text(s[:a]+traffic_block+s[b:])

          # ---- worker-mikrotik-native.js: reiniciar somente a sessão PPPoE, sem desativar secret.
          replace_once('worker-mikrotik-native.js',
            "const action=text(body.action);const allowed=new Set(['router.test','router.sync','router.metrics','router.profiles','router.remote','pppoe.save','pppoe.delete','client.status','client.block','client.unblock']);",
            "const action=text(body.action);const allowed=new Set(['router.test','router.sync','router.metrics','router.profiles','router.remote','pppoe.save','pppoe.delete','client.status','client.reconnect','client.block','client.unblock']);",
            'mikrotik allowed reconnect')
          insert="""async function reconnectClient(router,data){const username=text(data?.pppoe_username||data?.pppoe_user);if(!username)throw Error('Este cliente não possui usuário PPPoE.');const secret=await findSecret(router,username);if(!secret)throw Error('Acesso PPPoE não encontrado no MikroTik.');if(isDisabled(secret.disabled))throw Error('Este acesso PPPoE está bloqueado e não pode ser reiniciado.');const disconnected=await disconnect(router,username);return {action:'reconnected',username,disconnectedSessions:disconnected,secretId:text(secret?.['.id']),verified:true,checkedAt:new Date().toISOString()}}\n"""
          replace_once('worker-mikrotik-native.js','async function remoteInfo(router){',insert+'async function remoteInfo(router){','insert reconnect function')
          replace_once('worker-mikrotik-native.js',
            "else if(action==='client.status')data=await clientStatus(router,body.data||{});\n    else if(action==='client.block')data=await blockClient(router,body.data||{});",
            "else if(action==='client.status')data=await clientStatus(router,body.data||{});\n    else if(action==='client.reconnect')data=await reconnectClient(router,body.data||{});\n    else if(action==='client.block')data=await blockClient(router,body.data||{});",
            'route reconnect action')

          # ---- worker.js: expor consumo diário/mensal existente na resposta da Área do Cliente.
          replace_once('worker.js',
            "import { handleNativeAuth,handleNativeCloudState,handleNativeCloudData,resolveRouterForService,recordTrafficForService,finalizePaidNegotiations } from './worker-native-api.js';",
            "import { handleNativeAuth,handleNativeCloudState,handleNativeCloudData,resolveRouterForService,recordTrafficForService,readTrafficForService,finalizePaidNegotiations } from './worker-native-api.js';",
            'worker traffic import')
          marker="""function portalDateLabel(value){
  const iso=normalizePortalDate(value);if(!iso)return '';
  const date=new Date(iso);if(Number.isNaN(date.getTime()))return text(value);
  try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Maceio'}).format(date)}catch{return iso}
}
"""
          helper=marker+"""function portalTrafficFields(traffic={}){const current=traffic?.current||{},today=traffic?.today||{},daily=Array.isArray(traffic?.daily)?traffic.daily:[],history=Array.isArray(traffic?.history)?traffic.history:[];const monthDownloadBytes=Math.max(0,Number(current.download_bytes)||0),monthUploadBytes=Math.max(0,Number(current.upload_bytes)||0),todayDownloadBytes=Math.max(0,Number(today.download_bytes)||0),todayUploadBytes=Math.max(0,Number(today.upload_bytes)||0);return {trafficMonth:text(current.month),monthDownloadBytes,monthUploadBytes,monthTotalBytes:monthDownloadBytes+monthUploadBytes,todayDownloadBytes,todayUploadBytes,todayTotalBytes:todayDownloadBytes+todayUploadBytes,dailyUsage:daily.slice(-31),monthlyUsage:history.slice(0,12)}}
"""
          replace_once('worker.js',marker,helper,'portal traffic helper')
          p=Path('worker.js'); s=p.read_text(); a=s.find('async function portalLiveConnection(env,sql,client){'); b=s.find('\nasync function portalSnapshot',a)
          if a<0 or b<0: raise SystemExit('portalLiveConnection block not found')
          live_fn=r'''async function portalLiveConnection(env,sql,client){
  const checkedFallback=normalizePortalDate(client?.mikrotik_last_sync),storedStatus=text(client?.mikrotik_status||client?.status),storedIp=text(client?.ip);let storedTraffic=null;
  try{storedTraffic=await readTrafficForService(env,client.id,'primary')}catch{}
  const fallback={
    status:storedStatus||'Aguardando dados',pppoeStatus:client?.connection_type==='PPPoE'?'Aguardando confirmação':'Não se aplica',pppoeConnected:null,online:null,
    ip:storedIp||'Aguardando dados',uptime:'',downloadBps:null,uploadBps:null,liveRatesAvailable:false,latencyMs:null,packetLoss:null,availability30Days:null,
    quality:'Aguardando dados',checkedAt:checkedFallback,lastConnection:portalDateLabel(checkedFallback)||'Aguardando dados',lastConnectionIso:checkedFallback,lastConnectionLabel:portalDateLabel(checkedFallback),diagnosticStatus:'idle',diagnosticMessage:'Pronto para verificar sua conexão.',checking:false,isChecking:false,source:'stored',connectionError:'',...portalTrafficFields(storedTraffic)
  };
  if(client?.connection_type!=='PPPoE')return {...fallback,status:storedStatus||'Não se aplica',pppoeStatus:'Não se aplica',quality:'Não se aplica',source:'not-pppoe'};
  if(!Number(client?.router_id)||!text(client?.pppoe_username))return {...fallback,status:'Aguardando configuração',connectionError:'Cliente sem MikroTik ou usuário PPPoE vinculado.',source:'configuration'};
  try{
    const router=await resolveRouterForService(env,client.router_id),response=await handleMikrotikProxy(new Request('https://painel.fibramais.workers.dev/api/mikrotik-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'client.status',router,data:client})}));
    let body={};try{body=await response.json()}catch{}
    if(!response.ok||!body.ok)throw new Error(text(body?.error)||`Falha no diagnóstico MikroTik (HTTP ${response.status}).`);
    const live=body.data||{},checkedAt=normalizePortalDate(live.checkedAt)||new Date().toISOString();let traffic=storedTraffic;
    try{traffic=await recordTrafficForService(env,client.id,live,'primary')}catch{}
    const liveDown=Number(live.downloadBps),liveUp=Number(live.uploadBps),trafficDown=Number(traffic?.downloadBps),trafficUp=Number(traffic?.uploadBps);
    const downloadBps=Number.isFinite(liveDown)?Math.max(0,liveDown):(Number.isFinite(trafficDown)?Math.max(0,trafficDown):null),uploadBps=Number.isFinite(liveUp)?Math.max(0,liveUp):(Number.isFinite(trafficUp)?Math.max(0,trafficUp):null);
    const latency=live.qualityAvailable&&Number.isFinite(Number(live.latencyMs))?Math.max(0,Math.round(Number(live.latencyMs))):null,loss=live.packetLoss===null||live.packetLoss===undefined||!Number.isFinite(Number(live.packetLoss))?null:Math.max(0,Math.min(100,Math.round(Number(live.packetLoss))));
    const connection={
      status:live.online?'Online':'Offline',pppoeStatus:live.online?'Conectado':'Desconectado',pppoeConnected:Boolean(live.online),online:Boolean(live.online),ip:text(live.ip)||storedIp||'Aguardando dados',uptime:text(live.uptime),
      downloadBps,uploadBps,liveRatesAvailable:Boolean(live.liveRatesAvailable)||(Number(downloadBps)>0)||(Number(uploadBps)>0),latencyMs:latency,packetLoss:loss,availability30Days:null,
      quality:text(live.quality)||(live.online?'Boa':'Sem conexão'),qualityAvailable:Boolean(live.qualityAvailable),checkedAt,lastConnection:portalDateLabel(checkedAt),lastConnectionIso:checkedAt,lastConnectionLabel:portalDateLabel(checkedAt),diagnosticStatus:'complete',diagnosticMessage:'Diagnóstico concluído.',checking:false,isChecking:false,source:'mikrotik-live',connectionError:'',...portalTrafficFields(traffic)
    };
    try{await sql`UPDATE pp_clients SET ip=COALESCE(NULLIF(${text(live.ip)},''),ip),mikrotik_status=${live.online?'Online':'Offline'},mikrotik_last_sync=${checkedAt},updated_at=${checkedAt} WHERE id=${Number(client.id)}`;}catch{}
    return connection;
  }catch(error){
    const checkedAt=new Date().toISOString(),message=error instanceof Error?error.message:String(error);
    return {...fallback,status:'Indisponível',quality:'Indisponível',checkedAt,lastConnection:portalDateLabel(checkedFallback||checkedAt),lastConnectionIso:checkedFallback||checkedAt,lastConnectionLabel:portalDateLabel(checkedFallback||checkedAt),diagnosticStatus:'error',diagnosticMessage:message,checking:false,isChecking:false,source:'mikrotik-error',connectionError:message};
  }
}
