name: one-shot-connection-health-usage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-connection-health-usage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar implementação validada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old=subprocess.check_output(['git','show','HEAD^:.github/workflows/one-shot-connection-health-usage.yml'],text=True)
          marker='        run: |\n'
          start=old.find(marker)
          if start<0: raise SystemExit('bloco de implementação anterior não encontrado')
          start+=len(marker)
          end=old.find('\n      - name: Salvar backend e remover workflow temporário',start)
          if end<0: raise SystemExit('fim do bloco de implementação anterior não encontrado')
          block=old[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/connection-health-patch.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash -euxo pipefail /tmp/connection-health-patch.sh
      - name: Salvar backend e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-native-api.js worker-mikrotik-native.js worker.js customer-service-worker.js
          git commit -m 'Adiciona saúde da conexão, consumo e reinício PPPoE'
          git push origin HEAD:main
          git rm .github/workflows/one-shot-connection-health-usage.yml
          git commit -m 'Remove workflow temporário da conexão do cliente'
          git push origin HEAD:main
