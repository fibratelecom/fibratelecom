name: one-shot-negotiation-completion

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-negotiation-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar conclusão automática do acordo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const nativePath = 'worker-native-api.js';
          let native = fs.readFileSync(nativePath, 'utf8');
          const getSetting = "async function getSetting(sql,key){const rows=await sql`SELECT value,updated_at FROM pp_settings WHERE key=${key} LIMIT 1`;return Array.isArray(rows)?rows[0]||null:null;}\n";
          const setSetting = "async function setSetting(sql,key,value){const updatedAt=new Date().toISOString(),raw=JSON.stringify(value??null);const rows=await sql`INSERT INTO pp_settings (key,value,updated_at) VALUES (${key},${raw}::jsonb,${updatedAt}) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value,updated_at=EXCLUDED.updated_at RETURNING value,updated_at`;return Array.isArray(rows)?rows[0]||null:null;}\n";
          if (!native.includes(getSetting) || !native.includes(setSetting)) {
            console.error('Pontos esperados do estado nativo não encontrados.');
            process.exit(1);
          }
          const helper = `export function finalizePaidNegotiations(state){
  if(!state||typeof state!=='object'||Array.isArray(state))return state;
  const invoices=Array.isArray(state.invoices)?state.invoices:[],agreements=Array.isArray(state.negotiations)?state.negotiations:[];
  for(const agreement of agreements){
    const id=text(agreement?.id);if(!id)continue;
    const current=text(agreement?.status).toLowerCase();if(current.includes('cancel')||current.includes('falh'))continue;
    const wanted=new Set((Array.isArray(agreement?.new_invoice_ids)?agreement.new_invoice_ids:[]).map(String));
    const related=invoices.filter(invoice=>wanted.size?wanted.has(String(invoice?.id)):text(invoice?.negotiation_id)===id&&!text(invoice?.status).toLowerCase().includes('renegociado'));
    if(!related.length)continue;
    const allPaid=related.every(invoice=>{const status=text(invoice?.status).toLowerCase();return ['pago','paga','paid','baixado','recebido','recebida','quitado','quitada'].some(value=>status.includes(value))});
    if(!allPaid)continue;
    const paidTimes=related.map(invoice=>new Date(text(invoice?.paid_at)).getTime()).filter(Number.isFinite),completedAt=paidTimes.length?new Date(Math.max(...paidTimes)).toISOString():new Date().toISOString();
    if(!current.includes('conclu')&&!current.includes('quitad'))agreement.status='Concluído';
    if(!text(agreement?.completed_at))agreement.completed_at=completedAt;
    agreement.updated_at=completedAt;
  }
  return state;
}
`;
          native = native.replace(getSetting, getSetting + helper);
          native = native.replace(setSetting, "async function setSetting(sql,key,value){if(key===STATE_KEY)value=finalizePaidNegotiations(value);const updatedAt=new Date().toISOString(),raw=JSON.stringify(value??null);const rows=await sql`INSERT INTO pp_settings (key,value,updated_at) VALUES (${key},${raw}::jsonb,${updatedAt}) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value,updated_at=EXCLUDED.updated_at RETURNING value,updated_at`;return Array.isArray(rows)?rows[0]||null:null;}\n");
          if ((native.match(/export function finalizePaidNegotiations\(/g) || []).length !== 1) {
            console.error('Regra de conclusão duplicada ou ausente.');
            process.exit(1);
          }
          fs.writeFileSync(nativePath, native);

          const workerPath = 'worker.js';
          let worker = fs.readFileSync(workerPath, 'utf8');
          const oldImport = "import { handleNativeAuth,handleNativeCloudState,handleNativeCloudData,resolveRouterForService,recordTrafficForService } from './worker-native-api.js';";
          const newImport = "import { handleNativeAuth,handleNativeCloudState,handleNativeCloudData,resolveRouterForService,recordTrafficForService,finalizePaidNegotiations } from './worker-native-api.js';";
          const oldSave = `async function saveState(sql,state){
  const raw=JSON.stringify(state||{}),updatedAt=new Date().toISOString();
  await sql\`INSERT INTO pp_settings (key,value,updated_at) VALUES (\${STATE_KEY},\${raw}::jsonb,\${updatedAt}) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value,updated_at=EXCLUDED.updated_at\`;
  return {state,updated_at:updatedAt};
}`;
          const newSave = `async function saveState(sql,state){
  finalizePaidNegotiations(state);
  const raw=JSON.stringify(state||{}),updatedAt=new Date().toISOString();
  await sql\`INSERT INTO pp_settings (key,value,updated_at) VALUES (\${STATE_KEY},\${raw}::jsonb,\${updatedAt}) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value,updated_at=EXCLUDED.updated_at\`;
  return {state,updated_at:updatedAt};
}`;
          if (!worker.includes(oldImport) || !worker.includes(oldSave)) {
            console.error('Pontos esperados do runtime principal não encontrados.');
            process.exit(1);
          }
          worker = worker.replace(oldImport, newImport).replace(oldSave, newSave);
          if ((worker.match(/finalizePaidNegotiations/g) || []).length !== 2) {
            console.error('Integração da conclusão automática fora do padrão esperado.');
            process.exit(1);
          }
          fs.writeFileSync(workerPath, worker);
          NODE
          node --check worker-native-api.js
          node --check worker.js
          git diff --check
          git rm .github/workflows/one-shot-negotiation-completion.yml
      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Conclui acordo após última parcela paga'
          git push origin HEAD:main

# segundo disparo intencional
