name: one-shot-notificacao-duplicada
on:
  push:
    branches: [work-corrige-notificacao-duplicada-20260917]
    paths:
      - '.github/workflows/one-shot-notificacao-duplicada.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-corrige-notificacao-duplicada-20260917
          fetch-depth: 0
      - name: Corrigir reenvio ambíguo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('operations-entry-worker.js')
          s=p.read_text()
          old="const claimed=await sql`UPDATE pp_push_events SET attempts=attempts+1,last_attempt_at=now() WHERE id=${Number(row.id)} AND completed=false AND (last_attempt_at IS NULL OR last_attempt_at<now()-interval '2 minutes') RETURNING *`;"
          new="const claimed=await sql`UPDATE pp_push_events SET attempts=attempts+1,last_attempt_at=now() WHERE id=${Number(row.id)} AND completed=false AND (attempts=0 OR (attempts=1 AND sent_count=0 AND failed_count>0 AND last_attempt_at<now()-interval '2 minutes')) RETURNING *`;"
          if old not in s: raise SystemExit('claim anchor not found')
          s=s.replace(old,new,1)
          old="const rows=await sql`SELECT * FROM pp_push_events WHERE completed=false AND event_type LIKE 'operational:%' AND created_at>=now()-interval '7 days' AND (last_attempt_at IS NULL OR last_attempt_at<now()-interval '2 minutes') ORDER BY id ASC LIMIT 40`;let sent=0,failed=0;"
          new="const rows=await sql`SELECT * FROM pp_push_events WHERE completed=false AND event_type LIKE 'operational:%' AND created_at>=now()-interval '7 days' AND attempts=1 AND sent_count=0 AND failed_count>0 AND last_attempt_at<now()-interval '2 minutes' ORDER BY id ASC LIMIT 40`;let sent=0,failed=0;"
          if old not in s: raise SystemExit('retry anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check operations-entry-worker.js
          git diff --check
          git diff -- operations-entry-worker.js
      - name: Salvar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-notificacao-duplicada.yml
          git add operations-entry-worker.js
          git commit -m 'Evita duplicidade em notificações operacionais'
          git push origin HEAD:work-corrige-notificacao-duplicada-20260917
