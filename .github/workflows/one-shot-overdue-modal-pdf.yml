name: one-shot-overdue-modal-pdf
on:
  push:
    paths:
      - '.github/workflows/one-shot-overdue-modal-pdf.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preservar dados individuais para o PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/panel-views.js')
          s=p.read_text()
          old='''<td><strong>${count}</strong><div class="row-actions">${group.clientId?`<button class="btn secondary" type="button" data-action="overdue-client-invoices" data-id="${esc(group.clientId)}">${esc(detailLabel)}</button>`:''}</div></td>'''
          new='''<td><strong>${count}</strong><div class="row-actions">${group.clientId?`<button class="btn secondary" type="button" data-action="overdue-client-invoices" data-id="${esc(group.clientId)}">${esc(detailLabel)}</button>`:''}</div><div hidden aria-hidden="true">${details}</div></td>'''
          if old not in s:
              raise SystemExit('célula compacta de faturas não encontrada')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validar
        run: |
          node --check src/panel-views.js
          git diff --check
          test "$(git diff --name-only)" = "src/panel-views.js"
      - name: Publicar e limpar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/panel-views.js
          git commit -m 'Preserva PDF com faturas agrupadas'
          git push origin HEAD:main
          git push origin HEAD:cloudflare-provedor-plus
          git rm .github/workflows/one-shot-overdue-modal-pdf.yml
          git commit -m 'Remove workflow temporário da compatibilidade do PDF'
          git push origin HEAD:main
          git push origin HEAD:cloudflare-provedor-plus
