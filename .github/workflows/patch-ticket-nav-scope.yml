name: Patch Ticket Navigation Scope
on:
  push:
    branches: [fix/global-navigation-duplication]
    paths: [.github/workflows/patch-ticket-nav-scope.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
          fetch-depth: 0
      - name: Restrict ticket navigation hooks to main menu
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ticket-enhancements.js')
          s=p.read_text()
          marker="  let auth=null,clients=[],staff=[],layer=null,editor=null,filter={q:'',status:'',priority:'',assigned:''},observerTimer=null;\n"
          assert marker in s
          helper=marker+"  function mainNav(){return document.querySelector('aside.sidebar nav[aria-label=\"Menu principal\"],aside.sidebar nav')}\n  function mainNavButtons(){const nav=mainNav();return nav?[...nav.querySelectorAll('button')]:[]}\n"
          s=s.replace(marker,helper,1)
          old="  function activeTicketsNav(){const active=document.querySelector('.sidebar nav button.active,nav button.active');return active&&norm(active.textContent).includes('chamado')}"
          new="  function activeTicketsNav(){const active=mainNavButtons().find(b=>b.classList.contains('active'));return Boolean(active&&norm(active.textContent).includes('chamado'))}"
          assert old in s
          s=s.replace(old,new,1)
          old="  function navigate(label){leaveTickets();const target=norm(label);const b=[...document.querySelectorAll('.sidebar nav button,nav button')].find(x=>norm(x.textContent).includes(target));b?.click()}"
          new="  function navigate(label){leaveTickets();const target=norm(label);const b=mainNavButtons().find(x=>norm(x.textContent).includes(target));b?.click()}"
          assert old in s
          s=s.replace(old,new,1)
          old="""    const observer=new MutationObserver(()=>{clearTimeout(observerTimer);observerTimer=setTimeout(()=>{if(activeTicketsNav()&&permissionAllowed()){if(!layer)openPage()}else leaveTickets()},80)});
    observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
    document.addEventListener('click',e=>{const b=e.target.closest('.sidebar nav button,nav button');if(!b)return;setTimeout(()=>{if(norm(b.textContent).includes('chamado')&&permissionAllowed()){if(!layer)openPage()}else leaveTickets()},30)},true);
"""
          new="""    const nav=mainNav();
    if(nav){const observer=new MutationObserver(()=>{clearTimeout(observerTimer);observerTimer=setTimeout(()=>{if(activeTicketsNav()&&permissionAllowed()){if(!layer)openPage()}else leaveTickets()},80)});observer.observe(nav,{childList:true,subtree:true,attributes:true,attributeFilter:['class']})}
    document.addEventListener('click',e=>{const currentNav=mainNav(),b=e.target.closest('button');if(!currentNav||!b||!currentNav.contains(b))return;setTimeout(()=>{if(norm(b.textContent).includes('chamado')&&permissionAllowed()){if(!layer)openPage()}else leaveTickets()},30)},true);
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check ticket-enhancements.js
          if grep -q '.sidebar nav button,nav button' ticket-enhancements.js; then echo 'Broad ticket nav selector remains'; exit 1; fi
          grep -q 'observer.observe(nav' ticket-enhancements.js
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add ticket-enhancements.js
          git commit -m "Restringe Chamados ao menu principal"
          git push origin HEAD:fix/global-navigation-duplication
