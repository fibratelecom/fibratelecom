name: Patch Ticket Simple

on:
  push:
    branches:
      - fix/global-navigation-duplication
    paths:
      - .github/workflows/patch-ticket-simple.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-ticket-nav.py
      - name: Validate
        run: |
          node --check ticket-enhancements.js
          grep -q 'function mainNavButtons()' ticket-enhancements.js
          grep -q 'observer.observe(nav' ticket-enhancements.js
          if grep -q '.sidebar nav button,nav button' ticket-enhancements.js; then exit 1; fi
      - name: Commit
        run: |
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add ticket-enhancements.js
          git diff --cached --quiet || git commit -m "Restringe Chamados ao menu principal"
          git push origin HEAD:fix/global-navigation-duplication
