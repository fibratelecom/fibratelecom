name: Prepublish Server Automation Check

on:
  push:
    branches:
      - fix/global-navigation-duplication
    paths:
      - .github/workflows/prepublish-server-automation-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-navigation-duplication
      - name: Validate server files
        run: |
          set -euo pipefail
          node --check api/automation.js
          node --check lib/automation-handler.js
          node --check lib/automation-overlay.js
          node --check lib/github-actions-oidc.js
          node --check api/cloud-state.js
          node --check lib/cloud-data-handler.js
          node --check bootstrap.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Validate packed bank bridge
        run: |
          set -euo pipefail
          cat packed/bridgegz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/bridge.js
          node --check /tmp/bridge.js
          grep -q "automation.bank.save" /tmp/bridge.js
          grep -q "ProvedorPlusSyncAutomationBankVault" /tmp/bridge.js
          if grep -q "slice(0,100)" /tmp/bridge.js; then exit 1; fi
      - name: Validate scheduler configuration
        run: |
          set -euo pipefail
          if grep -q '"crons"' vercel.json; then exit 1; fi
          grep -q "id-token: write" .github/workflows/provedor-plus-automation.yml
          grep -q "2-59/5" .github/workflows/provedor-plus-automation.yml
          grep -q "audience=provedor-plus-automation" .github/workflows/provedor-plus-automation.yml
          grep -q "fibratelecom.vercel.app/api/automation" .github/workflows/provedor-plus-automation.yml
          grep -q "token.actions.githubusercontent.com" lib/github-actions-oidc.js
          grep -q "refs/heads/main" lib/github-actions-oidc.js
          grep -q "provedor-plus-automation.yml@refs/heads/main" lib/github-actions-oidc.js
