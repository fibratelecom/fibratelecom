name: Promover cloud17

on:
  push:
    branches:
      - desenvolvimento
    paths:
      - .github/workflows/promover-cloud17.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promover:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verificar credencial Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_NAO_CONFIGURADO"
            exit 2
          fi
          echo "VERCEL_TOKEN_CONFIGURADO"

      - name: Promover preview cloud17 para producao
        run: |
          npx --yes vercel@latest promote https://fibratelecom-fpwf9asjg-fibratelecom.vercel.app --yes --token "$VERCEL_TOKEN" --scope fibratelecom
