name: Rebuild Client Hub
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/rebuild-client-hub.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Aplicar novo Cliente
        shell: bash
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-before.js
          node --check /tmp/app-before.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          let source=fs.readFileSync('/tmp/app-before.js','utf8');
          const old='[`Clientes`,`◉`],';
          const count=source.split(old).length-1;
          if(count!==1)throw new Error(`Esperava 1 botao Clientes antigo no bundle; encontrei ${count}.`);
          source=source.replace(old,'');
          if(source.includes('m=[[`Clientes`,`◉`]'))throw new Error('O botao Clientes antigo ainda inicia o menu.');
          if(!source.includes('e===`Clientes`?'))throw new Error('A rota interna de clientes foi afetada.');
          fs.writeFileSync('/tmp/app-after.js',source);
          const encoded=zlib.gzipSync(Buffer.from(source,'utf8')).toString('base64');
          const files=fs.readdirSync('packed').filter(f=>/^appgz-\d+\.txt$/.test(f)).sort();
          const chunkSize=Math.ceil(encoded.length/files.length);
          if(chunkSize>3500)throw new Error(`Bundle excedeu limite: ${chunkSize}`);
          files.forEach((file,i)=>fs.writeFileSync(`packed/${file}`,encoded.slice(i*chunkSize,(i+1)*chunkSize)+'\n'));

          let dash=fs.readFileSync('dashboard-enhancements.js','utf8');
          const oldNavigate="function navigate(label){const wanted=norm(label),nav=navRoot();if(!nav)return;const target=[...nav.querySelectorAll('button')].find(item=>item!==button&&norm(item.textContent).includes(wanted));if(target){closeDashboard();target.click()}}";
          const newNavigate="function navigate(label){const wanted=norm(label),nav=navRoot();if(!nav)return;const target=[...nav.querySelectorAll('button')].find(item=>item!==button&&(norm(item.textContent).includes(wanted)||(wanted.startsWith('clientes')&&item.dataset.ppClientHub==='1')));if(target){closeDashboard();target.click()}}";
          if(!dash.includes(oldNavigate))throw new Error('Navegacao do Dashboard nao encontrada.');
          dash=dash.replace(oldNavigate,newNavigate);
          const oldLoading="target.dataset.ppIntegrationHub==='1'||target.disabled";
          if(!dash.includes(oldLoading))throw new Error('Filtro do carregamento do menu nao encontrado.');
          dash=dash.replace(oldLoading,"target.dataset.ppIntegrationHub==='1'||target.dataset.ppClientHub==='1'||target.disabled");
          fs.writeFileSync('dashboard-enhancements.js',dash);

          let boot=fs.readFileSync('bootstrap.js','utf8');
          if(!boot.includes("const BUILD_TOKEN='20260831-dashboard-mikrotik2'"))throw new Error('BUILD_TOKEN esperado nao encontrado.');
          boot=boot.replace("const BUILD_TOKEN='20260831-dashboard-mikrotik2'","const BUILD_TOKEN='20260831-client-hub1'");
          fs.writeFileSync('bootstrap.js',boot);
          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/\/bootstrap\.js\?v=[^\"']+/,'/bootstrap.js?v=20260831-client-hub1');
          fs.writeFileSync('index.html',html);
          NODE
          cat .github/client-hub-fragment.js >> dashboard-transition-guard.js
          node --check dashboard-transition-guard.js
          node --check dashboard-enhancements.js
          node --check bootstrap.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-verify.js
          cmp /tmp/app-after.js /tmp/app-verify.js
          node --check /tmp/app-verify.js
          ! grep -q 'm=\[\[`Clientes`,`◉`\]' /tmp/app-verify.js
          grep -q 'data-pp-client-hub' dashboard-transition-guard.js
          grep -q 'Consultar cliente' dashboard-transition-guard.js
          grep -q 'Cadastrar cliente' dashboard-transition-guard.js
          grep -q 'mikrotik.savePppoe' dashboard-transition-guard.js
          grep -q '20260831-client-hub1' bootstrap.js
          grep -q '20260831-client-hub1' index.html
      - name: Publicar e limpar temporarios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packed/appgz-*.txt dashboard-transition-guard.js dashboard-enhancements.js bootstrap.js index.html
          git commit -m 'Substitui Clientes antigo por novo menu Cliente'
          git rm -f .github/workflows/rebuild-client-hub.yml .github/workflows/audit-client-flow.yml .github/client-hub-fragment.js
          git commit -m 'Remove temporarios do novo Cliente'
          git push origin HEAD:cloudflare-provedor-plus