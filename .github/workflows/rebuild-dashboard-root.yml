name: Rebuild Dashboard Root
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/rebuild-dashboard-root.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Remover Dashboard antigo e criar novo Dashboard
        shell: bash
        run: |
          set -euo pipefail
          cat > dashboard-enhancements.js <<'DASHJS'
          (()=>{
            if(window.__ProvedorPlusDashboardRootInstalled)return;
            window.__ProvedorPlusDashboardRootInstalled=true;
            const CSS_ID='pp-dashboard-root-css',CSS_VERSION='20260831-dashboard-root1';
            if(!document.getElementById(CSS_ID)){const link=document.createElement('link');link.id=CSS_ID;link.rel='stylesheet';link.href=`/dashboard-enhancements.css?v=${CSS_VERSION}`;document.head.appendChild(link)}
            const norm=value=>String(value??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
            const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            const num=value=>Number.isFinite(Number(value))?Number(value):0,pad=value=>String(value).padStart(2,'0');
            const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(num(cents)/100),integer=value=>new Intl.NumberFormat('pt-BR').format(Math.max(0,Math.round(num(value))));
            const dateTime=value=>{try{return new Date(value).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return '—'}};
            const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},monthKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
            const invoiceStatus=i=>norm(i?.status),isPaid=i=>['pago','paga','paid','recebido','recebida','quitado','quitada'].includes(invoiceStatus(i));
            const invoiceDue=i=>String(i?.due_date||i?.dueDate||'').slice(0,10),invoicePaidAt=i=>String(i?.paid_at||i?.paidAt||i?.payment_date||i?.paid_date||i?.received_at||i?.receivedAt||'');
            const invoiceCents=i=>{for(const key of ['amount_cents','value_cents','total_cents','price_cents'])if(Number.isFinite(Number(i?.[key])))return Number(i[key]);for(const key of ['amount','value','total','price'])if(Number.isFinite(Number(i?.[key])))return Math.round(Number(i[key])*100);return 0};
            const createdAt=x=>x?.created_at||x?.createdAt||x?.updated_at||x?.updatedAt||'',clientName=c=>String(c?.name||c?.full_name||c?.nome||'Cliente').trim();
            const isClosedTicket=t=>['fechado','fechada','resolvido','resolvida','concluido','concluida','closed','resolved'].includes(norm(t?.status));
            const isBlockedClient=c=>['bloqueado','bloqueada','blocked','suspenso','suspensa','inactive','inativo','inativa'].includes(norm(c?.status||c?.connection_status));
            let button=null,layer=null,opening=false,loadedOnce=false,observer=null,ensureTimer=null;
            let core={dashboard:{},clients:[],plans:[],invoices:[],tickets:[],routers:[]},routerLive=new Map();
            const navRoot=()=>document.querySelector('aside.sidebar nav[aria-label="Menu principal"],aside.sidebar nav'),contentRoot=()=>document.querySelector('.app-shell>.content')||document.querySelector('.content');
            function setActive(on){const nav=navRoot();if(on){nav?.querySelectorAll('button.active').forEach(item=>item.classList.remove('active'));button?.classList.add('active')}else button?.classList.remove('active')}
            function closeDashboard(){const content=contentRoot();content?.classList.remove('pp-dashboard-root-active');layer?.remove();layer=null;opening=false;setActive(false)}
            function navigate(label){const wanted=norm(label),nav=navRoot();if(!nav)return;const target=[...nav.querySelectorAll('button')].find(item=>item!==button&&norm(item.textContent).includes(wanted));if(target){closeDashboard();target.click()}}
            function ensureButton(){const nav=navRoot();if(!nav)return null;[...nav.querySelectorAll('button')].forEach(item=>{if(item.dataset.ppDashboardRoot==='1')return;const label=norm(item.textContent);if(label==='dashboard'||label==='visao geral')item.remove()});let current=nav.querySelector('button[data-pp-dashboard-root="1"]');if(!current){const template=nav.querySelector('button');current=document.createElement('button');current.type='button';current.dataset.ppDashboardRoot='1';current.className=String(template?.className||'');current.classList.remove('active');current.innerHTML='<span>⌂</span><span>Dashboard</span>';current.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();openDashboard()});nav.insertBefore(current,nav.firstElementChild||null)}else if(current!==nav.firstElementChild)nav.insertBefore(current,nav.firstElementChild||null);button=current;if(contentRoot()?.classList.contains('pp-dashboard-root-active'))button.classList.add('active');if(!loadedOnce){loadedOnce=true;setTimeout(()=>openDashboard(),0)}return current}
            function metricCard(icon,label,value,note,tone=''){return `<article class="ppd-metric ${tone}"><span class="ppd-metric-icon">${icon}</span><div><small>${esc(label)}</small><strong>${esc(value)}</strong><em>${esc(note)}</em></div></article>`}
            function monthBuckets(count=6){const rows=[],now=new Date();for(let offset=count-1;offset>=0;offset--){const d=new Date(now.getFullYear(),now.getMonth()-offset,1);rows.push({key:monthKey(d),label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),value:0})}for(const invoice of core.invoices){if(!isPaid(invoice))continue;const key=invoicePaidAt(invoice).slice(0,7),row=rows.find(item=>item.key===key);if(row)row.value+=invoiceCents(invoice)}return rows}
            function recentClients(){const source=Array.isArray(core.dashboard?.recent_clients)&&core.dashboard.recent_clients.length?core.dashboard.recent_clients:core.clients;return [...source].sort((a,b)=>new Date(createdAt(b)||0)-new Date(createdAt(a)||0)).slice(0,5)}
            function recentPayments(){const source=Array.isArray(core.dashboard?.recent_payments)&&core.dashboard.recent_payments.length?core.dashboard.recent_payments:core.invoices.filter(isPaid);return [...source].sort((a,b)=>new Date(invoicePaidAt(b)||createdAt(b)||0)-new Date(invoicePaidAt(a)||createdAt(a)||0)).slice(0,5)}
            const clientById=id=>core.clients.find(c=>Number(c?.id)===Number(id))||null,invoiceClientId=i=>Number(i?.client_id??i?.clientId??i?.customer_id)||0;
            function summary(){const nowMonth=monthKey(),overdue=core.invoices.filter(i=>!isPaid(i)&&invoiceDue(i)&&invoiceDue(i)<today()),overdueClientIds=new Set(overdue.map(invoiceClientId).filter(Boolean)),activeComputed=core.clients.filter(c=>!isBlockedClient(c)).length;const active=Number.isFinite(Number(core.dashboard?.active_clients))?Number(core.dashboard.active_clients):activeComputed;const monthlyRevenue=Number.isFinite(Number(core.dashboard?.monthly_revenue_cents))?Number(core.dashboard.monthly_revenue_cents):core.invoices.filter(i=>isPaid(i)&&invoicePaidAt(i).startsWith(nowMonth)).reduce((sum,i)=>sum+invoiceCents(i),0);const overdueClients=Number.isFinite(Number(core.dashboard?.overdue_clients))?Number(core.dashboard.overdue_clients):overdueClientIds.size,openTickets=Number.isFinite(Number(core.dashboard?.open_tickets))?Number(core.dashboard.open_tickets):core.tickets.filter(t=>!isClosedTicket(t)).length,overdueCents=overdue.reduce((sum,i)=>sum+invoiceCents(i),0),paidMonth=core.invoices.filter(i=>isPaid(i)&&invoicePaidAt(i).startsWith(nowMonth)).reduce((sum,i)=>sum+invoiceCents(i),0),blocked=Number.isFinite(Number(core.dashboard?.blocked_clients))?Number(core.dashboard.blocked_clients):core.clients.filter(isBlockedClient).length;return {active,monthlyRevenue,overdueClients,openTickets,overdueCents,paidMonth,blocked}}
            function renderNetwork(){if(!layer)return;const box=layer.querySelector('#ppd-network-list'),headline=layer.querySelector('#ppd-network-headline'),sub=layer.querySelector('#ppd-network-sub');if(!box)return;if(!core.routers.length){headline.textContent='Nenhum servidor';sub.textContent='Cadastre um MikroTik em Integração.';box.innerHTML='<div class="ppd-empty">Nenhum servidor MikroTik cadastrado.</div>';return}let online=0,offline=0,checking=0;box.innerHTML=core.routers.map(r=>{const live=routerLive.get(Number(r.id));let state='checking',label='Verificando...';if(live?.ok){state='online';label='Online';online++}else if(live?.done){state='offline';label='Offline';offline++}else checking++;const identity=live?.identity||r.name||'MikroTik',version=live?.version?`RouterOS ${live.version}`:'';return `<div class="ppd-router"><span class="ppd-dot ${state}"></span><div><strong>${esc(identity)}</strong><small>${esc(r.host||'Sem endereço')}${version?` · ${esc(version)}`:''}</small></div><b class="${state}">${label}</b></div>`}).join('');headline.textContent=checking?`${online} online · verificando ${checking}`:`${online} online · ${offline} offline`;sub.textContent=checking?'Consultando os servidores em tempo real.':offline?'Há servidor sem comunicação.':'Todos os servidores respondendo.'}
            function render(){if(!layer)return;const s=summary(),months=monthBuckets(6),max=Math.max(1,...months.map(r=>r.value)),clients=recentClients(),payments=recentPayments(),paidCount=core.invoices.filter(i=>isPaid(i)&&invoicePaidAt(i).startsWith(monthKey())).length,totalClients=Math.max(1,core.clients.length),activePct=Math.min(100,Math.round((s.active/totalClients)*100));layer.innerHTML=`<header class="ppd-head"><div><span class="ppd-eyebrow">VISÃO OPERACIONAL</span><h1>Dashboard</h1><p>Resumo do provedor com financeiro, clientes, atendimento e rede em um só lugar.</p></div><div class="ppd-head-actions"><span id="ppd-updated">Atualizado agora</span><button type="button" id="ppd-refresh">↻ Atualizar</button></div></header><section class="ppd-metrics">${metricCard('◉','Clientes ativos',integer(s.active),`${activePct}% da base cadastrada`,'green')}${metricCard('R$','Receita mensal',money(s.monthlyRevenue),`${paidCount} pagamento${paidCount===1?'':'s'} recebido${paidCount===1?'':'s'} no mês`,'blue')}${metricCard('!','Inadimplência',integer(s.overdueClients),`${money(s.overdueCents)} em aberto`,'orange')}${metricCard('✦','Chamados abertos',integer(s.openTickets),'Pendências de atendimento','purple')}</section><section class="ppd-main-grid"><article class="ppd-card ppd-finance"><div class="ppd-card-head"><div><span>FINANCEIRO</span><h2>Recebimentos</h2></div><button type="button" data-nav="financeiro">Abrir financeiro</button></div><div class="ppd-finance-summary"><div><small>Recebido no mês</small><strong>${money(s.paidMonth)}</strong></div><div><small>Em atraso</small><strong>${money(s.overdueCents)}</strong></div></div><div class="ppd-chart">${months.map(row=>`<div class="ppd-bar-col"><div class="ppd-bar-track"><i style="height:${Math.max(4,Math.round((row.value/max)*100))}%"></i></div><b>${esc(row.label)}</b><small>${row.value?money(row.value):'—'}</small></div>`).join('')}</div></article><article class="ppd-card ppd-network"><div class="ppd-card-head"><div><span>REDE</span><h2>Servidores MikroTik</h2></div><button type="button" data-nav="integracao">Integração</button></div><div class="ppd-network-summary"><strong id="ppd-network-headline">Verificando...</strong><small id="ppd-network-sub">Consultando servidores.</small></div><div id="ppd-network-list" class="ppd-network-list"></div></article></section><section class="ppd-secondary-grid"><article class="ppd-card"><div class="ppd-card-head"><div><span>CLIENTES</span><h2>Base de assinantes</h2></div><button type="button" data-nav="clientes">Ver clientes</button></div><div class="ppd-client-health"><div class="ppd-ring" style="--value:${activePct}"><strong>${activePct}%</strong><small>ativos</small></div><div class="ppd-client-totals"><div><small>Total</small><b>${integer(core.clients.length)}</b></div><div><small>Ativos</small><b>${integer(s.active)}</b></div><div><small>Bloqueados</small><b>${integer(s.blocked)}</b></div></div></div><div class="ppd-list">${clients.length?clients.map(c=>`<div><span class="ppd-avatar">${esc(clientName(c).slice(0,1).toUpperCase())}</span><p><strong>${esc(clientName(c))}</strong><small>${esc(c?.plan_name||c?.plan||c?.phone||'Cliente cadastrado')}</small></p><time>${createdAt(c)?esc(dateTime(createdAt(c))):'—'}</time></div>`).join(''):'<div class="ppd-empty">Nenhum cliente cadastrado.</div>'}</div></article><article class="ppd-card"><div class="ppd-card-head"><div><span>ATIVIDADE</span><h2>Pagamentos recentes</h2></div><button type="button" data-nav="financeiro">Ver cobranças</button></div><div class="ppd-list">${payments.length?payments.map(i=>{const c=clientById(invoiceClientId(i));return `<div><span class="ppd-pay-icon">✓</span><p><strong>${esc(c?clientName(c):i?.client_name||'Pagamento')}</strong><small>${esc(i?.payment_method||i?.method||'Pagamento confirmado')}</small></p><time><b>${money(invoiceCents(i))}</b><small>${invoicePaidAt(i)?esc(dateTime(invoicePaidAt(i))):''}</small></time></div>`}).join(''):'<div class="ppd-empty">Nenhum pagamento recente.</div>'}</div></article></section><section class="ppd-shortcuts"><button type="button" data-nav="clientes"><span>◉</span><b>Clientes</b><small>Cadastro e conexão</small></button><button type="button" data-nav="financeiro"><span>R$</span><b>Financeiro</b><small>Faturas e recebimentos</small></button><button type="button" data-nav="chamados"><span>✦</span><b>Chamados</b><small>Atendimento</small></button><button type="button" data-nav="planos"><span>▤</span><b>Planos</b><small>Ofertas e perfis</small></button></section>`;layer.querySelector('#ppd-refresh')?.addEventListener('click',()=>refresh(true));layer.querySelectorAll('[data-nav]').forEach(item=>item.addEventListener('click',()=>navigate(item.dataset.nav)));renderNetwork()}
            async function loadCore(){const api=window.provedor;if(!api)throw new Error('API do Provedor Plus ainda não carregada.');const tasks=[api.dashboard?.get?.(),api.clients?.list?.(),api.plans?.list?.(),api.invoices?.list?.(),api.tickets?.list?.(),api.routers?.list?.()],result=await Promise.allSettled(tasks),val=(index,fallback)=>result[index]?.status==='fulfilled'&&result[index].value!=null?result[index].value:fallback;core={dashboard:val(0,{})||{},clients:Array.isArray(val(1,[]))?val(1,[]):[],plans:Array.isArray(val(2,[]))?val(2,[]):[],invoices:Array.isArray(val(3,[]))?val(3,[]):[],tickets:Array.isArray(val(4,[]))?val(4,[]):[],routers:Array.isArray(val(5,[]))?val(5,[]):[]}}
            async function loadRouterStatus(){const api=window.provedor;if(!api?.mikrotik?.sync)return;routerLive=new Map(core.routers.map(r=>[Number(r.id),{done:false,ok:false}]));renderNetwork();await Promise.all(core.routers.map(async r=>{const id=Number(r.id);try{const data=await api.mikrotik.sync(id);routerLive.set(id,{done:true,ok:true,identity:data?.identity||data?.routerName||r.name||'',version:data?.version||data?.routerVersion||''})}catch(error){routerLive.set(id,{done:true,ok:false,error:error?.message||String(error)})}renderNetwork()}))}
            async function refresh(){if(!layer)return;const refreshButton=layer.querySelector('#ppd-refresh');if(refreshButton){refreshButton.disabled=true;refreshButton.textContent='Atualizando...'}try{await loadCore();if(layer){render();const updated=layer.querySelector('#ppd-updated');if(updated)updated.textContent=`Atualizado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;void loadRouterStatus()}}catch(error){if(layer){layer.innerHTML=`<div class="ppd-error"><strong>Não foi possível carregar o Dashboard</strong><p>${esc(error?.message||error)}</p><button type="button" id="ppd-retry">Tentar novamente</button></div>`;layer.querySelector('#ppd-retry')?.addEventListener('click',()=>refresh())}}finally{if(refreshButton?.isConnected){refreshButton.disabled=false;refreshButton.textContent='↻ Atualizar'}}}
            function openDashboard(){ensureButton();const content=contentRoot();if(!content||opening)return;opening=true;content.classList.remove('pp-integration-hub-active','pp-new-plans-active','pp-route-overlay-active','pp-route-billing-active','pp-route-ticket-active','pp-route-staff-active');content.classList.add('pp-dashboard-root-active');layer=content.querySelector(':scope>.pp-dashboard-root-layer');if(!layer){layer=document.createElement('section');layer.className='pp-dashboard-root-layer';content.appendChild(layer)}setActive(true);layer.innerHTML='<div class="ppd-loading"><span></span><strong>Carregando Dashboard...</strong></div>';refresh().finally(()=>{opening=false})}
            document.addEventListener('click',event=>{const nav=navRoot(),target=event.target.closest?.('button');if(target&&nav?.contains(target)&&target!==button)closeDashboard()},true);
            observer=new MutationObserver(()=>{clearTimeout(ensureTimer);ensureTimer=setTimeout(ensureButton,20)});observer.observe(document.documentElement,{childList:true,subtree:true});ensureButton();
          })();
          DASHJS
          cat > dashboard-enhancements.css <<'DASHCSS'
          .content.pp-dashboard-root-active{position:relative!important;overflow:auto!important;background:#f4f7f6!important}.content.pp-dashboard-root-active>:not(.pp-dashboard-root-layer){display:none!important}.content.pp-dashboard-root-active>.pp-dashboard-root-layer{display:block!important}.pp-dashboard-root-layer{display:none;min-height:100%;padding:28px 28px 44px;box-sizing:border-box;background:linear-gradient(180deg,#f8faf9 0%,#f2f6f5 100%);color:#173d36;font-family:Segoe UI,Arial,sans-serif}
          .ppd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:20px}.ppd-eyebrow{display:block;color:#0a8a76;font-size:10px;font-weight:900;letter-spacing:.15em}.ppd-head h1{margin:6px 0 5px;color:#143b34;font-size:31px;line-height:1}.ppd-head p{margin:0;color:#6c7f79;font-size:12px}.ppd-head-actions{display:flex;align-items:center;gap:10px}.ppd-head-actions span{color:#7a8c87;font-size:10px}.ppd-head-actions button,.ppd-card-head button{border:1px solid #d4e3df;border-radius:9px;background:#fff;color:#31534c;font-size:10px;font-weight:850;cursor:pointer}.ppd-head-actions button{height:38px;padding:0 13px}.ppd-head-actions button:hover,.ppd-card-head button:hover{border-color:#9bcfc4;background:#edf8f5;color:#087866}.ppd-head-actions button:disabled{opacity:.55;cursor:wait}
          .ppd-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.ppd-metric{display:flex;align-items:center;gap:13px;min-height:92px;padding:15px 16px;background:#fff;border:1px solid #dce7e4;border-radius:14px;box-shadow:0 4px 18px rgba(29,69,61,.045)}.ppd-metric-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#e9f7f3;color:#087866;font-size:14px;font-weight:900}.ppd-metric.blue .ppd-metric-icon{background:#edf5ff;color:#286ca8}.ppd-metric.orange .ppd-metric-icon{background:#fff3e7;color:#b46b21}.ppd-metric.purple .ppd-metric-icon{background:#f4efff;color:#7351a8}.ppd-metric small{display:block;color:#7a8b87;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.ppd-metric strong{display:block;margin-top:4px;color:#163e36;font-size:21px;line-height:1.1}.ppd-metric em{display:block;margin-top:4px;color:#82918d;font-size:9px;font-style:normal}
          .ppd-main-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:14px;margin-bottom:14px}.ppd-secondary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}.ppd-card{min-width:0;padding:18px;background:#fff;border:1px solid #dce7e4;border-radius:14px;box-shadow:0 4px 18px rgba(29,69,61,.04)}.ppd-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:15px}.ppd-card-head span{display:block;color:#0b8b77;font-size:9px;font-weight:900;letter-spacing:.12em}.ppd-card-head h2{margin:4px 0 0;color:#183e36;font-size:16px}.ppd-card-head button{height:31px;padding:0 10px;white-space:nowrap}
          .ppd-finance-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}.ppd-finance-summary>div{padding:12px 13px;border:1px solid #e5edeb;border-radius:10px;background:#f9fbfa}.ppd-finance-summary small{display:block;color:#7d8d89;font-size:9px}.ppd-finance-summary strong{display:block;margin-top:4px;color:#173f37;font-size:18px}.ppd-chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:190px;padding:12px 4px 0;border-top:1px solid #edf2f0}.ppd-bar-col{display:grid;grid-template-rows:1fr auto auto;gap:5px;min-width:0;height:100%;text-align:center}.ppd-bar-track{display:flex;align-items:flex-end;justify-content:center;min-height:115px;border-radius:8px;background:linear-gradient(180deg,#fbfdfc,#f3f8f6);overflow:hidden}.ppd-bar-track i{display:block;width:min(32px,68%);min-height:4px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#12a88e,#087866)}.ppd-bar-col b{color:#566d67;font-size:9px;text-transform:uppercase}.ppd-bar-col small{overflow:hidden;color:#81918d;font-size:8px;text-overflow:ellipsis;white-space:nowrap}
          .ppd-network-summary{padding:13px 14px;margin-bottom:10px;border-radius:11px;background:#f4faf8;border:1px solid #dfebe7}.ppd-network-summary strong{display:block;color:#174139;font-size:15px}.ppd-network-summary small{display:block;margin-top:4px;color:#748681;font-size:9px}.ppd-network-list{display:grid;gap:8px}.ppd-router{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 11px;border:1px solid #e6eeec;border-radius:10px}.ppd-router>div{min-width:0}.ppd-router strong{display:block;overflow:hidden;color:#294b44;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.ppd-router small{display:block;margin-top:3px;overflow:hidden;color:#81918d;font-size:8px;text-overflow:ellipsis;white-space:nowrap}.ppd-router b{padding:5px 7px;border-radius:20px;background:#eef3f2;color:#6c7f7a;font-size:8px}.ppd-router b.online{background:#e7f7f0;color:#08725c}.ppd-router b.offline{background:#fff0ed;color:#aa4938}.ppd-dot{width:8px;height:8px;border-radius:50%;background:#aab7b3;box-shadow:0 0 0 4px #f0f4f3}.ppd-dot.online{background:#12a174;box-shadow:0 0 0 4px #e7f7f0}.ppd-dot.offline{background:#d66550;box-shadow:0 0 0 4px #fff0ed}.ppd-dot.checking{animation:ppd-pulse 1s infinite alternate}@keyframes ppd-pulse{to{opacity:.35}}
          .ppd-client-health{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;padding:4px 0 16px;border-bottom:1px solid #edf2f0}.ppd-ring{--value:0;display:grid;place-items:center;align-content:center;width:98px;height:98px;border-radius:50%;background:radial-gradient(circle at center,#fff 57%,transparent 58%),conic-gradient(#0b927c calc(var(--value)*1%),#e7efed 0)}.ppd-ring strong{color:#173f37;font-size:21px}.ppd-ring small{color:#7b8c87;font-size:8px;text-transform:uppercase}.ppd-client-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ppd-client-totals div{padding:9px;border-radius:9px;background:#f8faf9;border:1px solid #e8efed}.ppd-client-totals small{display:block;color:#81918d;font-size:8px}.ppd-client-totals b{display:block;margin-top:4px;color:#294b44;font-size:15px}
          .ppd-list{display:grid;gap:0;margin-top:8px}.ppd-list>div:not(.ppd-empty){display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:8px 2px;border-bottom:1px solid #edf2f0}.ppd-list>div:last-child{border-bottom:0}.ppd-avatar,.ppd-pay-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#edf7f4;color:#087866;font-size:10px;font-weight:900}.ppd-pay-icon{border-radius:50%;background:#e7f7f0}.ppd-list p{min-width:0;margin:0}.ppd-list p strong{display:block;overflow:hidden;color:#294b44;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.ppd-list p small{display:block;margin-top:3px;overflow:hidden;color:#84938f;font-size:8px;text-overflow:ellipsis;white-space:nowrap}.ppd-list time{display:flex;flex-direction:column;align-items:flex-end;color:#81918d;font-size:8px;font-style:normal}.ppd-list time b{color:#1f554a;font-size:10px}.ppd-list time small{margin-top:2px;font-size:8px}.ppd-empty{padding:18px;color:#83928e;border:1px dashed #d9e5e2;border-radius:10px;text-align:center;font-size:9px}
          .ppd-shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.ppd-shortcuts button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;padding:13px 14px;border:1px solid #dce7e4;border-radius:12px;background:#fff;color:#294b44;text-align:left;cursor:pointer}.ppd-shortcuts button:hover{border-color:#a8d5cb;background:#f3faf8}.ppd-shortcuts span{grid-row:1/3;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#eaf7f3;color:#087866;font-size:10px;font-weight:900}.ppd-shortcuts b{align-self:end;font-size:10px}.ppd-shortcuts small{align-self:start;margin-top:2px;color:#82928d;font-size:8px}
          .ppd-loading{display:grid;place-items:center;align-content:center;gap:10px;min-height:420px;color:#5f746f}.ppd-loading span{width:28px;height:28px;border:3px solid #d8e8e4;border-top-color:#0b8f7b;border-radius:50%;animation:ppd-spin .8s linear infinite}.ppd-loading strong{font-size:11px}@keyframes ppd-spin{to{transform:rotate(360deg)}}.ppd-error{max-width:520px;margin:70px auto;padding:22px;background:#fff;border:1px solid #efcbc4;border-radius:13px;color:#8d3f34;text-align:center}.ppd-error strong{font-size:15px}.ppd-error p{font-size:10px}.ppd-error button{height:36px;padding:0 13px;border:0;border-radius:9px;background:#9e493c;color:#fff;font-weight:800;cursor:pointer}
          @media(max-width:1180px){.ppd-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.ppd-main-grid{grid-template-columns:1fr}.ppd-secondary-grid{grid-template-columns:1fr}}@media(max-width:760px){.pp-dashboard-root-layer{padding:20px 12px 34px}.ppd-head{display:block}.ppd-head-actions{margin-top:12px}.ppd-metrics,.ppd-shortcuts{grid-template-columns:1fr}.ppd-finance-summary{grid-template-columns:1fr}.ppd-chart{gap:4px}.ppd-bar-col small{display:none}.ppd-client-health{grid-template-columns:1fr}.ppd-ring{margin:auto}.ppd-client-totals{grid-template-columns:repeat(3,1fr)}.ppd-card-head{flex-direction:column}.ppd-router{grid-template-columns:auto minmax(0,1fr)}.ppd-router b{grid-column:2;justify-self:start}}
          DASHCSS

          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-before.js
          node --check /tmp/app-before.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          let source=fs.readFileSync('/tmp/app-before.js','utf8');
          const replacements=[
            ['[`Visão geral`,`⌂`],',''],
            ['function A(){let[e,t]=(0,f.useState)(`Visão geral`),','function A(){let[e,t]=(0,f.useState)(`Clientes`),'],
            ['e===`Visão geral`?`Acompanhe os indicadores do seu provedor.`:',''],
            ['e===`Visão geral`?(0,p.jsx)(oe,{dashboard:v,onSection:t}):','']
          ];
          for(const [before,after] of replacements){if(!source.includes(before))throw new Error(`Trecho antigo do Dashboard não encontrado: ${before}`);source=source.replace(before,after)}
          if(source.includes('Visão geral'))throw new Error('A rota antiga Visão geral ainda existe no bundle.');
          if(source.includes('[`Visão geral`,`⌂`]'))throw new Error('O botão antigo ainda existe no menu do bundle.');
          if(!source.includes('e===`Clientes`?'))throw new Error('Rota Clientes foi afetada indevidamente.');
          fs.writeFileSync('/tmp/app-after.js',source);
          const encoded=zlib.gzipSync(Buffer.from(source,'utf8')).toString('base64'),files=Array.from({length:33},(_,i)=>`packed/appgz-${String(i+1).padStart(2,'0')}.txt`),chunkSize=Math.ceil(encoded.length/files.length);
          if(chunkSize>3500)throw new Error(`Bundle excedeu limite: ${chunkSize}`);
          files.forEach((file,i)=>fs.writeFileSync(file,encoded.slice(i*chunkSize,(i+1)*chunkSize)+'\n'));

          let guard=fs.readFileSync('dashboard-transition-guard.js','utf8');
          const integrationStart=guard.indexOf('(()=>{\n  if(window.__ProvedorPlusIntegrationHubInstalled)');
          if(integrationStart<0)throw new Error('Hub Integração não localizado no guard.');
          guard=guard.slice(integrationStart);fs.writeFileSync('dashboard-transition-guard.js',guard);

          let ui=fs.readFileSync('ui-runtime-fixes.js','utf8');
          ui=ui.replace(/\s*\['Visão geral','Dashboard'\],\n?/,'\n');fs.writeFileSync('ui-runtime-fixes.js',ui);

          let boot=fs.readFileSync('bootstrap.js','utf8');
          boot=boot.replace(/const BUILD_TOKEN='[^']+';/,"const BUILD_TOKEN='20260831-dashboard-root1';");
          boot=boot.replace(/\/dashboard-transition-guard\.js\?v=[^']+/, '/dashboard-transition-guard.js?v=20260831-dashboard-root1');
          boot=boot.replace(/\/dashboard-enhancements\.js\?v=[^']+/, '/dashboard-enhancements.js?v=20260831-dashboard-root1');
          boot=boot.replaceAll('.pp-dashboard-v2','.pp-dashboard-root-layer');
          const routeMarker="    const routeForButton=button=>{\n      const label=normalize(button?.textContent);";
          const routeNew="    const routeForButton=button=>{\n      if(button?.dataset?.ppDashboardRoot==='1')return'base';\n      const label=normalize(button?.textContent);";
          if(!boot.includes(routeMarker))throw new Error('Isolamento de rota não localizado.');
          boot=boot.replace(routeMarker,routeNew);fs.writeFileSync('bootstrap.js',boot);

          let html=fs.readFileSync('index.html','utf8');html=html.replace(/\/bootstrap\.js\?v=[^"]+/, '/bootstrap.js?v=20260831-dashboard-root1');fs.writeFileSync('index.html',html);
          NODE
          node --check /tmp/app-after.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-verify.js
          cmp /tmp/app-after.js /tmp/app-verify.js
          node --check /tmp/app-verify.js
          node --check dashboard-enhancements.js
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
          node --check ui-runtime-fixes.js
          grep -Fq 'data-pp-dashboard-root' dashboard-enhancements.js
          grep -Fq 'Resumo do provedor com financeiro, clientes, atendimento e rede' dashboard-enhancements.js
          grep -Fq "20260831-dashboard-root1" bootstrap.js index.html
          grep -Fq '__ProvedorPlusIntegrationHubInstalled' dashboard-transition-guard.js
          ! grep -Fq '__ProvedorPlusDashboardTransitionGuardInstalled' dashboard-transition-guard.js
          ! grep -Fq "['Visão geral','Dashboard']" ui-runtime-fixes.js
          echo DASHBOARD_ROOT_REBUILD_OK
      - name: Publicar e remover reconstrução temporária
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packed/appgz-*.txt dashboard-enhancements.js dashboard-enhancements.css dashboard-transition-guard.js ui-runtime-fixes.js bootstrap.js index.html
          git commit -m 'Substitui Dashboard antigo por novo Dashboard raiz'
          git rm .github/workflows/rebuild-dashboard-root.yml
          git commit -m 'Remove reconstrução temporária do Dashboard'
          git push origin HEAD:cloudflare-provedor-plus
