name: Rebuild Integration Root
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/rebuild-integration-root.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Remover integração antiga do bundle e atualizar carregamento
        run: |
          set -euo pipefail
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-before.js
          node --check /tmp/app-before.js
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          let source=fs.readFileSync('/tmp/app-before.js','utf8');

          const menu='[`Integração`,`⌁`],';
          if(!source.includes(menu))throw new Error('Item antigo Integração não encontrado no menu do bundle.');
          source=source.replace(menu,'');

          const pageStart=source.indexOf('function BankIntegrationPage(){');
          const pageEnd=source.indexOf('function k({settings:',pageStart);
          if(pageStart<0||pageEnd<=pageStart)throw new Error('BankIntegrationPage não pôde ser isolada com segurança.');
          source=source.slice(0,pageStart)+source.slice(pageEnd);

          const subtitle=':e===`Integração`?`Integrações com bancos e serviços financeiros.`';
          if(!source.includes(subtitle))throw new Error('Ramo de subtítulo da Integração antiga não encontrado.');
          source=source.replace(subtitle,'');

          const route=':e===`Integração`?(0,p.jsx)(BankIntegrationPage,{})';
          if(!source.includes(route))throw new Error('Rota React da Integração antiga não encontrada.');
          source=source.replace(route,'');

          if(source.includes('function BankIntegrationPage(){'))throw new Error('BankIntegrationPage ainda existe após a remoção.');
          if(source.includes('[`Integração`,`⌁`]'))throw new Error('Botão Integração antigo ainda existe no array do menu.');
          if(source.includes('e===`Integração`?(0,p.jsx)(BankIntegrationPage'))throw new Error('Rota bancária antiga ainda existe.');
          if(!source.includes('e===`Rede & MikroTik`?'))throw new Error('Rota MikroTik existente foi perdida indevidamente.');

          fs.writeFileSync('/tmp/app-after.js',source);
          const encoded=zlib.gzipSync(Buffer.from(source,'utf8')).toString('base64');
          const files=Array.from({length:33},(_,i)=>`packed/appgz-${String(i+1).padStart(2,'0')}.txt`);
          const chunkSize=Math.ceil(encoded.length/files.length);
          if(chunkSize>3500)throw new Error(`Bundle compactado excedeu o limite dos 33 arquivos: ${chunkSize} por parte.`);
          files.forEach((file,i)=>fs.writeFileSync(file,encoded.slice(i*chunkSize,(i+1)*chunkSize)+'\n'));
          console.log(`Bundle reconstruído: ${encoded.length} caracteres base64, ${chunkSize} por parte.`);
          NODE
          node --check /tmp/app-after.js
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-verify.js
          cmp /tmp/app-after.js /tmp/app-verify.js
          node --check /tmp/app-verify.js

          node <<'NODE'
          const fs=require('fs');
          let bootstrap=fs.readFileSync('bootstrap.js','utf8');
          bootstrap=bootstrap.replace(/const BUILD_TOKEN='[^']+';/,"const BUILD_TOKEN='20260830-integracao-raiz1';");
          bootstrap=bootstrap.replace("/dashboard-transition-guard.js?v=1017-dashboard-guard2","/dashboard-transition-guard.js?v=20260830-integracao-raiz1");
          if(!bootstrap.includes("const BUILD_TOKEN='20260830-integracao-raiz1';"))throw new Error('BUILD_TOKEN não foi atualizado.');
          if(!bootstrap.includes('/dashboard-transition-guard.js?v=20260830-integracao-raiz1'))throw new Error('Versão do guard não foi atualizada.');
          fs.writeFileSync('bootstrap.js',bootstrap);

          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/\n<script defer src="\/dashboard-transition-guard\.js\?v=[^"]+"><\/script>/,'');
          html=html.replace(/\/bootstrap\.js\?v=[^"]+/, '/bootstrap.js?v=20260830-integracao-raiz1');
          if(html.includes('<script defer src="/dashboard-transition-guard.js'))throw new Error('Carregamento antecipado do guard ainda existe no index.');
          if(!html.includes('/bootstrap.js?v=20260830-integracao-raiz1'))throw new Error('Index não aponta para o bootstrap novo.');
          fs.writeFileSync('index.html',html);
          NODE
          node --check bootstrap.js
          node --check dashboard-transition-guard.js
          grep -q 'aside.sidebar nav\[aria-label="Menu principal"\]' dashboard-transition-guard.js
          grep -q 'data-pp-integration-hub' dashboard-transition-guard.js
          ! grep -q '<script defer src="/dashboard-transition-guard.js' index.html
          echo INTEGRATION_ROOT_REBUILD_OK
      - name: Gravar correção definitiva e remover workflow temporário
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packed/appgz-*.txt bootstrap.js index.html
          git commit -m "Remove integração antiga do bundle e ativa novo hub"
          git rm .github/workflows/rebuild-integration-root.yml
          git commit -m "Remove reconstrução temporária da Integração"
          git push
