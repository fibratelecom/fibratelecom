name: Replace Startup Loader
on:
  push:
    branches: [cloudflare-provedor-plus]
    paths: [.github/workflows/replace-startup-loader.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-provedor-plus
          fetch-depth: 0
      - name: Substituir carregamento inicial
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          markup=base64.b64decode('').decode()
          helper=base64.b64decode('').decode()
          p=Path('bootstrap.js');s=p.read_text()
          s=s.replace("const BUILD_TOKEN='20260831-hubs-fix1';","const BUILD_TOKEN='20260831-startup-loader1';",1)
          if not s.startswith('const __ppStartup='): s=helper+s
          old="  if(root)root.style.visibility='hidden';\n"
          if old not in s: raise SystemExit('Ocultacao antiga do root nao encontrada')
          s=s.replace(old,'',1)
          old_done="  if(root)root.style.visibility='';\n})().catch(err=>{console.error(err);const root=document.getElementById('root')||document.body;if(root)root.style.visibility='';const message=String(err&&err.message||err);root.innerHTML='<div style=\"font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:60px auto;padding:24px;border:1px solid #e5e7eb;border-radius:14px\"><h2>Provedor Plus</h2><p>Não foi possível carregar o painel.</p><pre id=\"pp-startup-error\" style=\"white-space:pre-wrap;color:#b91c1c\"></pre><button id=\"pp-startup-retry\">Tentar novamente</button></div>';const pre=root.querySelector('#pp-startup-error'),button=root.querySelector('#pp-startup-retry');if(pre)pre.textContent=message;if(button)button.addEventListener('click',()=>location.reload())});"
          new_done="  __ppStartup.done();\n})().catch(err=>{__ppStartup.fail(err)});"
          if old_done not in s: raise SystemExit('Final antigo do bootstrap nao encontrado')
          s=s.replace(old_done,new_done,1)
          p.write_text(s)
          i=Path('index.html');h=i.read_text()
          old_body='<body><div id="root"></div></body>'
          if old_body not in h: raise SystemExit('Body antigo nao encontrado')
          h=h.replace(old_body,'<body>\n'+markup+'\n</body>',1)
          h=h.replace('/bootstrap.js?v=20260831-hubs-fix1','/bootstrap.js?v=20260831-startup-loader1',1)
          i.write_text(h)
          PY
          node --check bootstrap.js
          ! grep -q "root.style.visibility='hidden'" bootstrap.js
          grep -q 'pp-startup-screen' index.html
          grep -q "BUILD_TOKEN='20260831-startup-loader1'" bootstrap.js
      - name: Publicar e limpar temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap.js index.html
          git commit -m 'Cria novo carregamento inicial do Provedor Plus'
          git rm -f .github/workflows/replace-startup-loader.yml
          git commit -m 'Remove aplicador temporario do carregamento'
          git push origin HEAD:cloudflare-provedor-plus
