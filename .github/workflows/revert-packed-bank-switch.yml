name: Revert Packed Bank Switch

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore packed application from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- packed/appgz-*.txt
          if git diff --quiet -- packed/appgz-*.txt; then
            echo 'Packed application already matches main.'
            exit 0
          fi
          cat packed/appgz-*.txt | tr -d '\n\r ' | base64 -d | gzip -dc > /tmp/app-main.js
          node --check /tmp/app-main.js
          git config user.name fibratelecom
          git config user.email lanconta2015@gmail.com
          git add packed/appgz-*.txt
          git commit -m 'Restaura pacote do aplicativo sem alteração bancária'
          git push origin HEAD:fix/global-navigation-duplication
