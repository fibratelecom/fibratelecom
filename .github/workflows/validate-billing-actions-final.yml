name: Validate Billing Actions Final

on:
  push:
    branches:
      - fix/global-navigation-duplication

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate billing action UI
        run: |
          set -euo pipefail
          node --check billing-action-ui.js
          node --check bootstrap.js
          grep -Fq "pp-client-bills-actions-ready" billing-action-ui.js
          grep -Fq "modal.contains(button)" billing-action-ui.js
          grep -Fq "grid-template-columns:repeat(4,minmax(118px,1fr))" billing-action-ui.js
          grep -Fq "setProvider(select,'efi')" billing-action-ui.js
          grep -Fq "billing-action-ui.js?v=1017-billingactions1" bootstrap.js
          git fetch origin main
          git diff --quiet origin/main -- packed/appgz-*.txt packed/bridgegz-*.txt packed/proxygz-*.txt
