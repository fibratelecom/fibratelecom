name: Validate Client Actions

on:
  push:
    branches:
      - fix/client-actions-icons

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: |
          node --check ui-runtime-fixes.js
          node --check bootstrap.js
      - name: Validate client action implementation
        run: |
          grep -q 'pp-client-action-icon' ui-runtime-fixes.js
          grep -q 'data-pp-client-action' ui-runtime-fixes.js
          grep -q "texts:\['status','visualizar'\]" ui-runtime-fixes.js
          grep -q "texts:\['boleto'\]" ui-runtime-fixes.js
          grep -q "texts:\['editar'\]" ui-runtime-fixes.js
          grep -q "texts:\['excluir'\]" ui-runtime-fixes.js
          grep -q 'characterData:true' ui-runtime-fixes.js
      - name: Validate cache references
        run: |
          grep -q 'ui-runtime-fixes.js?v=1017-fix13-client-actions' bootstrap.js
          grep -q 'bootstrap.js?v=1017-cloud17-prod6' index.html
