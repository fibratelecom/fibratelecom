name: Validate Global Navigation

on:
  push:
    branches:
      - fix/global-navigation-duplication

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check dashboard-transition-guard.js
          node --check bootstrap.js
      - name: Validate global navigation guard
        run: |
          grep -q "clients:\['clientes','cliente'\]" dashboard-transition-guard.js
          grep -q "finance:\['financeiro','finance'\]" dashboard-transition-guard.js
          grep -q "integration:\['integracao','integra'\]" dashboard-transition-guard.js
          grep -q "tickets:\['chamados','chamado'\]" dashboard-transition-guard.js
          grep -q "plans:\['planos','plano'\]" dashboard-transition-guard.js
          grep -q "stock:\['estoque'\]" dashboard-transition-guard.js
          grep -q "reports:\['relatorios','relatorio'\]" dashboard-transition-guard.js
          grep -q "pp-navigation-transition-cover" dashboard-transition-guard.js
          grep -q "pp-ticket-layer" dashboard-transition-guard.js
          grep -q "pp-staff-layer" dashboard-transition-guard.js
          grep -q "pp-dashboard-v2" dashboard-transition-guard.js
          grep -q "attributeFilter:\['class'\]" dashboard-transition-guard.js
          if grep -q "characterData:true" dashboard-transition-guard.js; then echo "Global characterData observer is not allowed"; exit 1; fi
      - name: Validate cache references
        run: |
          grep -q "dashboard-transition-guard.js?v=1017-dashboard-guard2-globalnav" bootstrap.js
          grep -q "bootstrap.js?v=1017-cloud17-prod8" index.html
