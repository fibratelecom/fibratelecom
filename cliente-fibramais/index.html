<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Área do Cliente | Fibra+</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0b16;font-family:Arial,Helvetica,sans-serif;color:#fff}.card{width:min(92vw,520px);padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(145deg,rgba(95,33,146,.28),rgba(255,111,0,.16));box-shadow:0 24px 70px rgba(0,0,0,.35)}.brand{font-size:42px;font-weight:800;letter-spacing:-1.5px}.brand span{color:#ff7200}.line{height:4px;width:84px;margin:14px 0 28px;border-radius:999px;background:linear-gradient(90deg,#ff7200,#7d20b8)}h1{font-size:25px;margin:0 0 10px}p{margin:0;color:#d8d2e1;line-height:1.55}.tag{display:inline-block;margin-top:24px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;color:#eee}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Fibra<span>+</span></div>
    <div class="line"></div>
    <h1>Área do Cliente</h1>
    <p>Projeto separado do Provedor Plus, preparado para a próxima etapa de implantação do portal do assinante.</p>
    <div class="tag">cliente-fibramais</div>
  </main>
</body>
</html>
