<!doctype html>

<title>Fibra+ | Provedor Plus 1.0.17</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#142033;--muted:#718096;--line:#e3e9f0;--brand:#078d77;--brand2:#05705f;--blue:#2563eb;--red:#d93434;--orange:#e98a00;--green:#169b55;--shadow:0 8px 30px #1420330d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:83px;padding:0 22px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ff7a18,#8b5cf6);color:white;font-size:24px;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.nav{padding:14px 10px;overflow:auto}.nav button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;padding:11px 13px;border-radius:9px;cursor:pointer;color:#2c3a4f;text-align:left}.nav button.active{background:#e7f5f2;color:var(--brand2);font-weight:700}.nav button:hover{background:#f2f6f8}.ico{width:22px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:15px 19px;font-size:12px;color:var(--muted)}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:7px}.main{min-width:0}.top{height:83px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;position:sticky;top:0;z-index:5}.top h1{font-size:21px;margin:0}.top .sub{font-size:12px;color:var(--muted);margin-top:3px}.search{margin-left:auto;width:min(420px,38vw)}.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#fbfcfd}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:#eef2f5;display:grid;place-items:center}.page{padding:23px 26px}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px;display:flex;gap:13px;align-items:center}.badge{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:21px}.b1{background:#e8f2ff}.b2{background:#fff0f0}.b3{background:#e9f8ee}.b4{background:#fff4dd}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.ph{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph b{font-size:14px}.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:15px}.sectionhead h2{margin:0;font-size:21px}.sectionhead p{margin:4px 0 0;font-size:13px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:650;color:#26344a}.btn:hover{background:#f6f8fa}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.danger{color:#b91c1c;border-color:#f2c9c9}.mini{padding:6px 9px;font-size:12px}.toolbar{padding:13px;display:flex;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;min-width:210px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}th{font-size:11px;color:#607086;text-transform:uppercase;background:#fafbfd}tbody tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-weight:700;font-size:11px}.ok{background:#e8f7ed;color:#167446}.warn{background:#fff3dd;color:#a45c00}.bad{background:#ffeded;color:#b91c1c}.actions{display:flex;gap:5px;flex-wrap:wrap}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.module{padding:19px}.module h3{margin:8px 0 5px;font-size:15px}.module p{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}.module .big{font-size:27px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:#546276;font-weight:700;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ea;border-radius:8px;padding:9px 10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#12202c80;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modalback.open{display:flex}.modal{background:#fff;border-radius:15px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px #0003}.mh{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.mh h3{margin:0}.mb{padding:19px}.mf{padding:14px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:none;font-size:22px;cursor:pointer}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 19px}.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;color:#617083}.tabs button.active{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:700}.tab{display:none}.tab.active{display:block}.notice{padding:11px 13px;border-radius:9px;background:#f1f6ff;border:1px solid #d9e6ff;color:#38577c;font-size:12px;margin-bottom:12px}.footer{text-align:center;color:#8a96a6;font-size:11px;margin:22px 0}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#142033;color:#fff;padding:11px 14px;border-radius:9px;z-index:60;opacity:0;transform:translateY(15px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.app{display:block}.side{position:fixed;left:-255px;width:245px;z-index:25;transition:.2s}.side.open{left:0}.mobile{display:block}.top{padding:12px 14px;height:auto;min-height:70px}.search{display:none}.page{padding:16px 12px}.grid2,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.modules{grid-template-columns:1fr}.user span{display:none}}@media(max-width:520px){.cards{grid-template-columns:1fr}}

<body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">+</div><div><b>Fibra+</b><small>Provedor Plus 1.0.17</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><div class="online">Sistema web ativo</div><div style="margin-top:5px">Base recuperada da 1.0.17</div></div></aside><main class="main"><header class="top"><button class="btn mobile" id="menu">☰</button><div><h1 id="title">Visão geral</h1><div class="sub" id="subtitle">Painel do provedor</div></div><div class="search"><input id="globalSearch" placeholder="Buscar cliente, contrato ou CPF/CNPJ"></div><div class="user"><div class="avatar">👤</div><span><b>Administrador</b><small style="display:block;color:var(--muted)">admin</small></span></div></header><div class="page" id="page"></div></main></div>
<div class="modalback" id="modal"><div class="modal"><div class="mh"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalTabs"></div><div class="mb" id="modalBody"></div><div class="mf" id="modalFoot"></div></div></div><div class="toast" id="toast"></div>
<script>
const STORE='fibra_provedor_plus_1017';const nav=[['dashboard','▦','Visão geral'],['clients','👤','Clientes'],['finance','◉','Financeiro'],['integration','⇄','Integração'],['tickets','🔧','Chamados'],['plans','▤','Planos'],['stock','◇','Estoque'],['reports','▥','Relatórios'],['settings','⚙','Configurações']];
const blank=()=>({seq:{client:0,plan:0,invoice:0,ticket:0,stock:0,router:0},clients:[],plans:[],invoices:[],tickets:[],stock:[],routers:[],settings:{company_name:'Fibra+',document:'',phone:'',email:'',current_user_name:'Administrador',auto_block:false,block_days:7,payment_portal_ip:''},audit:[]});let db=load();let current='dashboard';
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return blank()}}function persist(){localStorage.setItem(STORE,JSON.stringify(db))}function next(k){db.seq[k]=(db.seq[k]||0)+1;return db.seq[k]}function byId(a,id){return a.find(x=>Number(x.id)===Number(id))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(c){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(c)||0)/100)}function date(v){if(!v)return '—';return new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR')}function dt(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}function pill(v){return `<span class="pill ${v==='Ativo'||v==='Pago'||v==='Concluído'?'ok':v==='Bloqueado'||v==='Urgente'?'bad':'warn'}">${esc(v)}</span>`}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function audit(action,entity,id){db.audit.unshift({action,entity,id,at:new Date().toISOString(),user:db.settings.current_user_name||'Administrador'});db.audit=db.audit.slice(0,1000)}
function contract(){let n=Math.max(0,...db.clients.map(c=>c.id))+1,y=new Date().getFullYear(),v;do{v=`CTR-${y}-${String(n++).padStart(6,'0')}`}while(db.clients.some(c=>c.contract_number===v));return v}function addMonths(v,n){let [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1+n,d,12);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function setNav(){document.getElementById('nav').innerHTML=nav.map(([id,ic,t])=>`<button data-id="${id}" class="${id===current?'active':''}"><span class="ico">${ic}</span>${t}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.id))}function go(id){current=id;setNav();render();document.getElementById('side').classList.remove('open');location.hash=id==='dashboard'?'':id}
function render(){const meta={dashboard:['Visão geral','Painel do provedor'],clients:['Clientes','Gerencie clientes e contratos'],finance:['Financeiro','Boletos, carnês e pagamentos'],integration:['Integração','MikroTik e bancos'],tickets:['Chamados','Atendimento e suporte'],plans:['Planos','Planos comerciais'],stock:['Estoque','Equipamentos e materiais'],reports:['Relatórios','Indicadores e exportações'],settings:['Configurações','Empresa, backup e sistema']}[current];title.textContent=meta[0];subtitle.textContent=meta[1];page.innerHTML=window['view_'+current]();bind()}
function view_dashboard(){const revenue=db.invoices.filter(i=>i.status==='Pago'&&String(i.paid_at||'').slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,i)=>s+i.amount_cents,0),pending=db.invoices.filter(i=>i.status==='Pendente').reduce((s,i)=>s+i.amount_cents,0);return `<div class="cards"><div class="card stat"><div class="badge b1">👥</div><div><span>Clientes ativos</span><strong>${db.clients.filter(c=>c.status==='Ativo').length}</strong></div></div><div class="card stat"><div class="badge b2">!</div><div><span>Inadimplentes</span><strong>${db.clients.filter(c=>c.status!=='Ativo').length}</strong></div></div><div class="card stat"><div class="badge b3">$</div><div><span>Faturamento mês</span><strong>${money(revenue)}</strong></div></div><div class="card stat"><div class="badge b4">🎧</div><div><span>Chamados abertos</span><strong>${db.tickets.filter(t=>!['Concluído','Fechado'].includes(t.state)).length}</strong></div></div></div><div class="grid2"><div class="panel"><div class="ph"><b>Vencimentos próximos</b><button class="btn mini" data-go="finance">Ver todos</button></div>${tableInvoices(db.invoices.filter(i=>i.status==='Pendente').sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,5),false)}</div><div class="panel"><div class="ph"><b>Clientes recentes</b><button class="btn mini" data-go="clients">Ver todos</button></div>${db.clients.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Plano</th><th>Status</th></tr></thead><tbody>${db.clients.slice(-5).reverse().map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(byId(db.plans,c.plan_id)?.name||'Sem plano')}</td><td>${pill(c.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum cliente cadastrado.</div>`}</div></div><div class="grid2"><div class="panel"><div class="ph"><b>Status operacional</b></div><div class="cards" style="grid-template-columns:repeat(3,1fr);padding:15px"><div class="stat"><div><span>Ativos</span><strong>${db.clients.filter(c=>c.status==='Ativo').length}</strong></div></div><div class="stat"><div><span>Bloqueados</span><strong>${db.clients.filter(c=>c.status==='Bloqueado').length}</strong></div></div><div class="stat"><div><span>A receber</span><strong style="font-size:17px">${money(pending)}</strong></div></div></div></div><div class="panel"><div class="ph"><b>Últimas baixas</b></div>${tableInvoices(db.invoices.filter(i=>i.status==='Pago').slice(-4).reverse(),false)}</div></div>`}
function view_clients(){return `<div class="sectionhead"><div><h2>Clientes</h2><p>Cadastro completo, plano, conexão e bloqueio.</p></div><button class="btn primary" data-action="new-client">+ Novo cliente</button></div><div class="panel"><div class="toolbar"><input id="clientSearch" placeholder="Buscar nome, CPF/CNPJ ou contrato"><select id="clientStatus"><option value="">Todos os status</option><option>Ativo</option><option>Em atraso</option><option>Bloqueado</option></select></div><div id="clientTable">${clientsTable(db.clients)}</div></div>`}
function clientsTable(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>CPF/CNPJ</th><th>Plano</th><th>Venc.</th><th>Status</th><th>Ações</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.contract_number||'')}</small></td><td>${esc(c.document||'—')}</td><td>${esc(byId(db.plans,c.plan_id)?.name||'Sem plano')}</td><td>Dia ${c.due_day||10}</td><td>${pill(c.status)}</td><td><div class="actions"><button class="btn mini" data-edit-client="${c.id}">Editar</button><button class="btn mini" data-toggle-client="${c.id}">${c.status==='Bloqueado'?'Desbloquear':'Bloquear'}</button><button class="btn mini danger" data-del-client="${c.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum cliente cadastrado.</div>`}
function view_finance(){let receive=db.invoices.filter(i=>i.status==='Pendente').reduce((s,i)=>s+i.amount_cents,0),paid=db.invoices.filter(i=>i.status==='Pago').reduce((s,i)=>s+i.amount_cents,0),over=db.invoices.filter(i=>i.status==='Pendente'&&i.due_date<new Date().toISOString().slice(0,10)).reduce((s,i)=>s+i.amount_cents,0);return `<div class="sectionhead"><div><h2>Financeiro</h2><p>Boleto avulso, carnê, baixas e histórico.</p></div><div class="actions"><button class="btn" data-action="new-carnet">Gerar carnê</button><button class="btn primary" data-action="new-invoice">+ Boleto</button></div></div><div class="cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:13px"><div class="card stat"><div><span>A receber</span><strong>${money(receive)}</strong></div></div><div class="card stat"><div><span>Recebido</span><strong>${money(paid)}</strong></div></div><div class="card stat"><div><span>Vencido</span><strong>${money(over)}</strong></div></div></div><div class="panel"><div class="toolbar"><select id="invoiceClient"><option value="">Todos os clientes</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="invoiceStatus"><option value="">Todos</option><option>Pendente</option><option>Pago</option></select><button class="btn danger" data-action="delete-client-invoices">Excluir boletos do cliente</button></div><div id="invoiceTable">${tableInvoices(db.invoices,true)}</div></div>`}
function tableInvoices(list,actions=true){if(!list.length)return `<div class="empty">Nenhum boleto cadastrado.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Boleto</th><th>Cliente / descrição</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Pagamento</th>${actions?'<th>Ações</th>':''}</tr></thead><tbody>${list.map(i=>`<tr><td><b>#BOL-${String(i.id).padStart(5,'0')}</b><br><small>${esc(i.billing_type||'Mensalidade')}</small></td><td>${esc(byId(db.clients,i.client_id)?.name||'Cliente removido')}<br><small>${esc(i.description||'Mensalidade')}</small></td><td>${date(i.due_date)}</td><td><b>${money(i.amount_cents)}</b></td><td>${pill(i.status)}</td><td>${i.status==='Pago'?`${esc(i.payment_method||'Baixa')}<br><small>${dt(i.paid_at)} · ${esc(i.paid_by||'')}</small>`:'Não pago'}</td>${actions?`<td><div class="actions">${i.status==='Pendente'?`<button class="btn mini primary" data-pay="${i.id}">Baixar</button>`:''}<button class="btn mini" data-view-invoice="${i.id}">Visualizar</button><button class="btn mini" data-download-invoice="${i.id}">Download</button><button class="btn mini danger" data-del-invoice="${i.id}">Excluir</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function view_integration(){return `<div class="sectionhead"><div><h2>Integração</h2><p>Configuração segura do MikroTik e provedores de pagamento.</p></div><button class="btn primary" data-action="new-router">+ MikroTik</button></div><div class="notice">Na versão web, senhas do RouterOS e tokens bancários não são gravados no navegador nem no GitHub. A conexão real será feita pelo agente local e pelo backend seguro.</div><div class="modules"><div class="card module"><div class="big">📡</div><h3>MikroTik / RouterOS 7</h3><p>${db.routers.length?`${db.routers.length} roteador(es) cadastrado(s).`:'Nenhum roteador cadastrado.'}</p><div style="margin-top:12px">${db.routers.map(r=>`<div style="border-top:1px solid var(--line);padding:9px 0"><b>${esc(r.name)}</b> · ${esc(r.host)}:${r.port||8728}<div class="actions" style="margin-top:6px"><button class="btn mini" data-edit-router="${r.id}">Editar</button><button class="btn mini danger" data-del-router="${r.id}">Excluir</button></div></div>`).join('')}</div></div><div class="card module"><div class="big">⚡</div><h3>Efí Bank</h3><p>Boletos, PIX e carnê. Credenciais serão mantidas no backend seguro.</p><button class="btn mini" style="margin-top:12px" data-safe-bank="efi">Configurar</button></div><div class="card module"><div class="big">💳</div><h3>Mercado Pago</h3><p>PIX com confirmação de pagamento. Token nunca será exposto no código público.</p><button class="btn mini" style="margin-top:12px" data-safe-bank="mp">Configurar</button></div></div>`}
function view_tickets(){return `<div class="sectionhead"><div><h2>Chamados</h2><p>Ordens de atendimento e suporte.</p></div><button class="btn primary" data-action="new-ticket">+ Novo chamado</button></div><div class="panel">${db.tickets.length?`<div class="tablewrap"><table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Assunto</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.tickets.slice().reverse().map(t=>`<tr><td>#CH-${String(t.id).padStart(5,'0')}</td><td>${esc(byId(db.clients,t.client_id)?.name||'Sem cliente')}</td><td>${esc(t.subject)}</td><td>${pill(t.priority)}</td><td>${pill(t.state)}</td><td><button class="btn mini" data-state-ticket="${t.id}">Alterar status</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum chamado cadastrado.</div>`}</div>`}
function view_plans(){return `<div class="sectionhead"><div><h2>Planos</h2><p>Velocidade, valor e perfil comercial.</p></div><button class="btn primary" data-action="new-plan">+ Novo plano</button></div><div class="panel">${db.plans.length?`<div class="tablewrap"><table><thead><tr><th>Plano</th><th>Velocidade</th><th>Download / upload</th><th>Valor</th><th>Clientes</th><th>Ações</th></tr></thead><tbody>${db.plans.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.speed)}</td><td>${p.download_mbps||0} / ${p.upload_mbps||0} Mbps</td><td>${money(p.price_cents)}</td><td>${db.clients.filter(c=>Number(c.plan_id)===Number(p.id)).length}</td><td><div class="actions"><button class="btn mini" data-edit-plan="${p.id}">Editar</button><button class="btn mini danger" data-del-plan="${p.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum plano cadastrado.</div>`}</div>`}
function view_stock(){return `<div class="sectionhead"><div><h2>Estoque</h2><p>Equipamentos, cabos e materiais.</p></div><button class="btn primary" data-action="new-stock">+ Novo item</button></div><div class="panel">${db.stock.length?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Quantidade</th><th>Mínimo</th><th>Custo</th><th>Ações</th></tr></thead><tbody>${db.stock.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.category||'—')}</td><td>${s.quantity} ${esc(s.unit||'un')}</td><td>${s.min_quantity}</td><td>${money(s.unit_price_cents)}</td><td><button class="btn mini" data-edit-stock="${s.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum item cadastrado.</div>`}</div>`}
function view_reports(){return `<div class="sectionhead"><div><h2>Relatórios</h2><p>Exportação dos dados cadastrados.</p></div></div><div class="modules"><div class="card module"><div class="big">👥</div><h3>Clientes</h3><p>Lista de clientes, status, planos e contratos.</p><button class="btn mini" data-export="clients" style="margin-top:12px">Exportar CSV</button></div><div class="card module"><div class="big">💰</div><h3>Financeiro</h3><p>Boletos, pagamentos e inadimplência.</p><div class="actions" style="margin-top:12px"><button class="btn mini" data-export="invoices">CSV</button><button class="btn mini" data-export="overdue">Inadimplentes</button></div></div><div class="card module"><div class="big">🔧</div><h3>Chamados / Estoque</h3><p>Atendimento e posição atual do estoque.</p><div class="actions" style="margin-top:12px"><button class="btn mini" data-export="tickets">Chamados</button><button class="btn mini" data-export="stock">Estoque</button></div></div></div>`}
function view_settings(){return `<div class="sectionhead"><div><h2>Configurações</h2><p>Dados da empresa, bloqueio e segurança dos dados.</p></div><button class="btn primary" data-action="save-settings">Salvar</button></div><div class="panel" style="padding:18px"><div class="formgrid"><div class="field"><label>Nome da empresa</label><input id="s_company" value="${esc(db.settings.company_name)}"></div><div class="field"><label>CNPJ / CPF</label><input id="s_document" value="${esc(db.settings.document)}"></div><div class="field"><label>Telefone</label><input id="s_phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>E-mail</label><input id="s_email" value="${esc(db.settings.email)}"></div><div class="field"><label>Usuário atual</label><input id="s_user" value="${esc(db.settings.current_user_name)}"></div><div class="field"><label>Bloqueio automático</label><select id="s_block"><option value="false" ${!db.settings.auto_block?'selected':''}>Desativado</option><option value="true" ${db.settings.auto_block?'selected':''}>Ativado</option></select></div><div class="field"><label>Dias de atraso para bloqueio</label><input type="number" id="s_days" value="${db.settings.block_days||7}"></div><div class="field"><label>IP do portal local</label><input id="s_portal" value="${esc(db.settings.payment_portal_ip||'')}"></div></div><div class="actions" style="margin-top:18px"><button class="btn" data-action="backup">Criar backup</button><button class="btn" data-action="restore">Restaurar backup</button><button class="btn danger" data-action="clear-all">Limpar base web</button></div></div><div class="panel" style="margin-top:13px"><div class="ph"><b>Auditoria recente</b></div>${db.audit.length?`<div class="tablewrap"><table><thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Item</th></tr></thead><tbody>${db.audit.slice(0,30).map(a=>`<tr><td>${dt(a.at)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} ${a.id||''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum evento de auditoria.</div>`}</div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action));document.querySelectorAll('[data-edit-client]').forEach(x=>x.onclick=()=>clientModal(Number(x.dataset.editClient)));document.querySelectorAll('[data-toggle-client]').forEach(x=>x.onclick=()=>toggleClient(Number(x.dataset.toggleClient)));document.querySelectorAll('[data-del-client]').forEach(x=>x.onclick=()=>delClient(Number(x.dataset.delClient)));document.querySelectorAll('[data-edit-plan]').forEach(x=>x.onclick=()=>planModal(Number(x.dataset.editPlan)));document.querySelectorAll('[data-del-plan]').forEach(x=>x.onclick=()=>delPlan(Number(x.dataset.delPlan)));document.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>payInvoice(Number(x.dataset.pay)));document.querySelectorAll('[data-view-invoice]').forEach(x=>x.onclick=()=>previewInvoice(Number(x.dataset.viewInvoice)));document.querySelectorAll('[data-download-invoice]').forEach(x=>x.onclick=()=>downloadInvoice(Number(x.dataset.downloadInvoice)));document.querySelectorAll('[data-del-invoice]').forEach(x=>x.onclick=()=>delInvoice(Number(x.dataset.delInvoice)));document.querySelectorAll('[data-state-ticket]').forEach(x=>x.onclick=()=>ticketState(Number(x.dataset.stateTicket)));document.querySelectorAll('[data-edit-stock]').forEach(x=>x.onclick=()=>stockModal(Number(x.dataset.editStock)));document.querySelectorAll('[data-edit-router]').forEach(x=>x.onclick=()=>routerModal(Number(x.dataset.editRouter)));document.querySelectorAll('[data-del-router]').forEach(x=>x.onclick=()=>delRouter(Number(x.dataset.delRouter)));document.querySelectorAll('[data-safe-bank]').forEach(x=>x.onclick=()=>safeBank(x.dataset.safeBank));document.querySelectorAll('[data-export]').forEach(x=>x.onclick=()=>exportCsv(x.dataset.export));let cs=document.getElementById('clientSearch'),st=document.getElementById('clientStatus');if(cs){let f=()=>{let q=cs.value.toLowerCase(),v=st.value;document.getElementById('clientTable').innerHTML=clientsTable(db.clients.filter(c=>(!v||c.status===v)&&(`${c.name} ${c.document} ${c.contract_number}`.toLowerCase().includes(q))));bind()};cs.oninput=f;st.onchange=f}let ic=document.getElementById('invoiceClient'),is=document.getElementById('invoiceStatus');if(ic){let f=()=>{let cid=ic.value,st=is.value;document.getElementById('invoiceTable').innerHTML=tableInvoices(db.invoices.filter(i=>(!cid||Number(i.client_id)===Number(cid))&&(!st||i.status===st)),true);bind()};ic.onchange=f;is.onchange=f}}
function openModal(title,body,saveFn,tabs=''){modalTitle.textContent=title;modalTabs.innerHTML=tabs;modalBody.innerHTML=body;modalFoot.innerHTML=`<button class="btn" onclick="closeModal()">Cancelar</button>${saveFn?'<button class="btn primary" id="modalSave">Salvar</button>':''}`;modal.classList.add('open');if(saveFn)document.getElementById('modalSave').onclick=saveFn}function closeModal(){modal.classList.remove('open')}
function clientModal(id=null){let c=id?byId(db.clients,id):{name:'',person_type:'Pessoa física',trade_name:'',document:'',rg_ie:'',birth_date:'',phone:'',whatsapp:'',email:'',cep:'',street:'',address_number:'',complement:'',neighborhood:'',city:'',state:'',address_reference:'',plan_id:'',contract_number:contract(),auto_block:false,installation_date:'',due_day:10,status:'Ativo',connection_type:'PPPoE',pppoe_username:'',pppoe_password:'',mikrotik_profile:'default',ip:'',mac_address:'',notes:'',router_id:''};let tabs=`<div class="tabs"><button class="active" data-tab="dados">Dados</button><button data-tab="plano">Plano</button><button data-tab="conexao">Conexão</button><button data-tab="bloqueio">Bloqueio</button></div>`;let body=`<div class="tab active" data-pane="dados"><div class="formgrid"><div class="field full"><label>Nome / razão social</label><input id="c_name" value="${esc(c.name)}"></div><div class="field"><label>Tipo</label><select id="c_type"><option ${c.person_type==='Pessoa física'?'selected':''}>Pessoa física</option><option ${c.person_type==='Pessoa jurídica'?'selected':''}>Pessoa jurídica</option></select></div><div class="field"><label>CPF / CNPJ</label><input id="c_doc" value="${esc(c.document)}"></div><div class="field"><label>Telefone</label><input id="c_phone" value="${esc(c.phone)}"></div><div class="field"><label>WhatsApp</label><input id="c_whats" value="${esc(c.whatsapp)}"></div><div class="field"><label>E-mail</label><input id="c_email" value="${esc(c.email)}"></div><div class="field"><label>CEP</label><input id="c_cep" value="${esc(c.cep)}"></div><div class="field full"><label>Endereço</label><input id="c_street" value="${esc(c.street)}"></div><div class="field"><label>Número</label><input id="c_number" value="${esc(c.address_number)}"></div><div class="field"><label>Bairro</label><input id="c_neigh" value="${esc(c.neighborhood)}"></div><div class="field"><label>Cidade</label><input id="c_city" value="${esc(c.city)}"></div><div class="field"><label>UF</label><input id="c_state" maxlength="2" value="${esc(c.state)}"></div></div></div><div class="tab" data-pane="plano"><div class="formgrid"><div class="field"><label>Contrato</label><input id="c_contract" value="${esc(c.contract_number)}"></div><div class="field"><label>Plano</label><select id="c_plan"><option value="">Sem plano</option>${db.plans.map(p=>`<option value="${p.id}" ${Number(c.plan_id)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Dia de vencimento</label><input type="number" min="1" max="31" id="c_due" value="${c.due_day||10}"></div><div class="field"><label>Status</label><select id="c_status">${['Ativo','Em atraso','Bloqueado'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Data de instalação</label><input type="date" id="c_install" value="${esc(c.installation_date)}"></div></div></div><div class="tab" data-pane="conexao"><div class="formgrid"><div class="field"><label>Tipo de conexão</label><select id="c_conn">${['PPPoE','IP estático','DHCP'].map(s=>`<option ${c.connection_type===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>MikroTik</label><select id="c_router"><option value="">Sem MikroTik</option>${db.routers.map(r=>`<option value="${r.id}" ${Number(c.router_id)===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Usuário PPPoE</label><input id="c_user" value="${esc(c.pppoe_username)}"></div><div class="field"><label>Senha PPPoE</label><input id="c_pass" value="${esc(c.pppoe_password)}"></div><div class="field"><label>Profile MikroTik</label><input id="c_profile" value="${esc(c.mikrotik_profile||'default')}"></div><div class="field"><label>IP</label><input id="c_ip" value="${esc(c.ip)}"></div><div class="field"><label>MAC</label><input id="c_mac" value="${esc(c.mac_address)}"></div></div></div><div class="tab" data-pane="bloqueio"><div class="notice">Controle de bloqueio por inadimplência preservado da 1.0.17. O comando real no RouterOS será executado pelo agente local seguro.</div><div class="formgrid"><div class="field"><label>Bloqueio automático deste cliente</label><select id="c_auto"><option value="false" ${!c.auto_block?'selected':''}>Desativado</option><option value="true" ${c.auto_block?'selected':''}>Ativado</option></select></div><div class="field full"><label>Observações</label><textarea id="c_notes">${esc(c.notes)}</textarea></div></div></div>`;openModal(id?'Editar cliente':'Novo cliente',body,()=>{let x=id?byId(db.clients,id):{id:next('client'),created_at:new Date().toISOString()};Object.assign(x,{name:c_name.value.trim(),person_type:c_type.value,document:c_doc.value.trim(),phone:c_phone.value.trim(),whatsapp:c_whats.value.trim(),email:c_email.value.trim(),cep:c_cep.value.trim(),street:c_street.value.trim(),address_number:c_number.value.trim(),neighborhood:c_neigh.value.trim(),city:c_city.value.trim(),state:c_state.value.trim().toUpperCase(),contract_number:c_contract.value.trim()||contract(),plan_id:c_plan.value?Number(c_plan.value):null,due_day:Number(c_due.value)||10,status:c_status.value,installation_date:c_install.value,connection_type:c_conn.value,router_id:c_router.value?Number(c_router.value):null,pppoe_username:c_user.value.trim(),pppoe_password:c_pass.value.trim(),mikrotik_profile:c_profile.value.trim()||'default',ip:c_ip.value.trim(),mac_address:c_mac.value.trim().toUpperCase(),auto_block:c_auto.value==='true',notes:c_notes.value.trim()});if(!x.name)return toast('Informe o nome do cliente.');if(!id)db.clients.push(x);audit(id?'Atualizou':'Cadastrou','cliente',x.id);persist();closeModal();render();toast('Cliente salvo.')},tabs);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`[data-pane="${b.dataset.tab}"]`).classList.add('active')})}
function planModal(id=null){let p=id?byId(db.plans,id):{name:'',speed:'',download_mbps:0,upload_mbps:0,price_cents:0};openModal(id?'Editar plano':'Novo plano',`<div class="formgrid"><div class="field full"><label>Nome</label><input id="p_name" value="${esc(p.name)}"></div><div class="field"><label>Descrição da velocidade</label><input id="p_speed" value="${esc(p.speed)}" placeholder="600 Mega"></div><div class="field"><label>Valor mensal (R$)</label><input type="number" step="0.01" id="p_price" value="${(p.price_cents/100).toFixed(2)}"></div><div class="field"><label>Download Mbps</label><input type="number" id="p_down" value="${p.download_mbps}"></div><div class="field"><label>Upload Mbps</label><input type="number" id="p_up" value="${p.upload_mbps}"></div></div>`,()=>{let x=id?byId(db.plans,id):{id:next('plan'),created_at:new Date().toISOString()};Object.assign(x,{name:p_name.value.trim(),speed:p_speed.value.trim(),price_cents:Math.round(Number(p_price.value||0)*100),download_mbps:Number(p_down.value)||0,upload_mbps:Number(p_up.value)||0,active:1});if(!x.name)return toast('Informe o nome do plano.');if(!id)db.plans.push(x);audit(id?'Atualizou':'Cadastrou','plano',x.id);persist();closeModal();render()})}
function invoiceModal(carnet=false){if(!db.clients.length)return toast('Cadastre um cliente primeiro.');openModal(carnet?'Gerar carnê':'Gerar boleto',`<div class="formgrid"><div class="field full"><label>Cliente</label><select id="i_client">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>${carnet?'Primeiro vencimento':'Vencimento'}</label><input type="date" id="i_due"></div><div class="field"><label>Valor por ${carnet?'parcela':'boleto'} (R$)</label><input type="number" step="0.01" id="i_value"></div>${carnet?'<div class="field"><label>Quantidade de parcelas</label><input type="number" min="1" max="60" id="i_total" value="12"></div>':''}<div class="field full"><label>Descrição</label><input id="i_desc" value="${carnet?'Carnê do plano':'Mensalidade'}"></div></div>`,()=>{let cid=Number(i_client.value),due=i_due.value,val=Math.round(Number(i_value.value||0)*100);if(!due||val<=0)return toast('Informe vencimento e valor.');if(carnet){let total=Math.max(1,Math.min(60,Number(i_total.value)||12)),group=`CARNE-${cid}-${Date.now().toString(36).toUpperCase()}`;for(let n=1;n<=total;n++)db.invoices.push({id:next('invoice'),client_id:cid,due_date:addMonths(due,n-1),amount_cents:val,status:'Pendente',document_type:'Boleto',billing_type:'Carnê',description:`${i_desc.value||'Carnê do plano'} · Parcela ${n}/${total}`,installment_group:group,installment_number:n,installment_total:total,payment_method:'',paid_by:'',paid_at:null,created_at:new Date().toISOString()});audit('Gerou','carnê',group)}else{let x={id:next('invoice'),client_id:cid,due_date:due,amount_cents:val,status:'Pendente',document_type:'Boleto',billing_type:'Mensalidade',description:i_desc.value||'Mensalidade',installment_number:1,installment_total:1,payment_method:'',paid_by:'',paid_at:null,created_at:new Date().toISOString()};db.invoices.push(x);audit('Gerou','boleto',x.id)}persist();closeModal();render();toast(carnet?'Carnê gerado.':'Boleto gerado.')})}
function ticketModal(){openModal('Novo chamado',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="t_client"><option value="">Sem cliente</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select id="t_priority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field full"><label>Assunto</label><input id="t_subject"></div></div>`,()=>{if(!t_subject.value.trim())return toast('Informe o assunto.');let x={id:next('ticket'),client_id:t_client.value?Number(t_client.value):null,subject:t_subject.value.trim(),priority:t_priority.value,state:'Aguardando',created_at:new Date().toISOString()};db.tickets.push(x);audit('Abriu','chamado',x.id);persist();closeModal();render()})}
function stockModal(id=null){let s=id?byId(db.stock,id):{name:'',category:'',quantity:0,min_quantity:0,unit:'un',unit_price_cents:0};openModal(id?'Editar item':'Novo item',`<div class="formgrid"><div class="field full"><label>Item</label><input id="st_name" value="${esc(s.name)}"></div><div class="field"><label>Categoria</label><input id="st_cat" value="${esc(s.category)}"></div><div class="field"><label>Unidade</label><input id="st_unit" value="${esc(s.unit)}"></div><div class="field"><label>Quantidade</label><input type="number" step="0.01" id="st_qty" value="${s.quantity}"></div><div class="field"><label>Estoque mínimo</label><input type="number" step="0.01" id="st_min" value="${s.min_quantity}"></div><div class="field"><label>Custo unitário R$</label><input type="number" step="0.01" id="st_price" value="${(s.unit_price_cents/100).toFixed(2)}"></div></div>`,()=>{let x=id?byId(db.stock,id):{id:next('stock')};Object.assign(x,{name:st_name.value.trim(),category:st_cat.value.trim(),unit:st_unit.value.trim()||'un',quantity:Number(st_qty.value)||0,min_quantity:Number(st_min.value)||0,unit_price_cents:Math.round(Number(st_price.value||0)*100)});if(!x.name)return toast('Informe o item.');if(!id)db.stock.push(x);audit(id?'Atualizou':'Cadastrou','estoque',x.id);persist();closeModal();render()})}
function routerModal(id=null){let r=id?byId(db.routers,id):{name:'',host:'',port:8728,username:'',connection_method:'api'};openModal(id?'Editar MikroTik':'Novo MikroTik',`<div class="notice">A senha não será salva nesta página pública. O agente local receberá a credencial diretamente no computador do provedor.</div><div class="formgrid"><div class="field"><label>Nome</label><input id="r_name" value="${esc(r.name)}"></div><div class="field"><label>Método</label><select id="r_method"><option value="api" ${r.connection_method==='api'?'selected':''}>API</option><option value="rest" ${r.connection_method==='rest'?'selected':''}>REST</option></select></div><div class="field"><label>IP / host</label><input id="r_host" value="${esc(r.host)}"></div><div class="field"><label>Porta</label><input type="number" id="r_port" value="${r.port||8728}"></div><div class="field"><label>Usuário</label><input id="r_user" value="${esc(r.username||'')}"></div></div>`,()=>{let x=id?byId(db.routers,id):{id:next('router'),created_at:new Date().toISOString()};Object.assign(x,{name:r_name.value.trim(),connection_method:r_method.value,host:r_host.value.trim(),port:Number(r_port.value)||8728,username:r_user.value.trim(),enabled:1,updated_at:new Date().toISOString()});if(!x.name||!x.host)return toast('Informe nome e IP.');if(!id)db.routers.push(x);audit(id?'Atualizou':'Cadastrou','MikroTik',x.id);persist();closeModal();render()})}
function action(a){if(a==='new-client')clientModal();if(a==='new-plan')planModal();if(a==='new-invoice')invoiceModal(false);if(a==='new-carnet')invoiceModal(true);if(a==='new-ticket')ticketModal();if(a==='new-stock')stockModal();if(a==='new-router')routerModal();if(a==='save-settings'){Object.assign(db.settings,{company_name:s_company.value,document:s_document.value,phone:s_phone.value,email:s_email.value,current_user_name:s_user.value,auto_block:s_block.value==='true',block_days:Number(s_days.value)||7,payment_portal_ip:s_portal.value});audit('Atualizou','configurações','');persist();toast('Configurações salvas.');render()}if(a==='backup')backup();if(a==='restore')restore();if(a==='clear-all'){if(confirm('Apagar todos os dados desta base web?')){db=blank();persist();render();toast('Base limpa.')}}if(a==='delete-client-invoices'){let sel=document.getElementById('invoiceClient');if(!sel?.value)return toast('Selecione um cliente.');let cid=Number(sel.value),c=byId(db.clients,cid);if(confirm(`Excluir todos os boletos de ${c?.name||'este cliente'}?`)){let n=db.invoices.length;db.invoices=db.invoices.filter(i=>Number(i.client_id)!==cid);audit('Excluiu todos','boletos do cliente',cid);persist();render();toast(`${n-db.invoices.length} boleto(s) excluído(s).`)}}}
function toggleClient(id){let c=byId(db.clients,id);c.status=c.status==='Bloqueado'?'Ativo':'Bloqueado';audit(c.status==='Bloqueado'?'Bloqueou':'Desbloqueou','cliente',id);persist();render();toast(c.status==='Bloqueado'?'Cliente bloqueado no sistema.':'Cliente desbloqueado no sistema.')}function delClient(id){let c=byId(db.clients,id);if(confirm(`Excluir ${c.name} e seus boletos?`)){db.clients=db.clients.filter(x=>x.id!==id);db.invoices=db.invoices.filter(i=>i.client_id!==id);audit('Excluiu','cliente',id);persist();render()}}function delPlan(id){if(db.clients.some(c=>c.plan_id===id))return toast('Plano vinculado a cliente.');if(confirm('Excluir plano?')){db.plans=db.plans.filter(p=>p.id!==id);persist();render()}}function payInvoice(id){let i=byId(db.invoices,id);openModal('Baixar boleto',`<div class="formgrid"><div class="field full"><label>Forma de pagamento</label><select id="pay_method"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Baixa manual</option></select></div></div>`,()=>{i.status='Pago';i.payment_method=pay_method.value;i.paid_by=db.settings.current_user_name||'Administrador';i.paid_at=new Date().toISOString();audit('Baixou','boleto',id);persist();closeModal();render();toast('Baixa registrada com data, hora e usuário.')})}function delInvoice(id){if(confirm('Excluir este boleto?')){db.invoices=db.invoices.filter(i=>i.id!==id);audit('Excluiu','boleto',id);persist();render()}}
function invoiceHtml(i){let c=byId(db.clients,i.client_id)||{},p=byId(db.plans,c.plan_id)||{};return `<!doctype html><meta charset=utf-8><title>Boleto #${i.id}</title><style>body{font-family:Arial;padding:30px}.box{max-width:760px;margin:auto;border:1px solid #ddd;padding:28px;border-radius:14px}.r{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:10px 0}@media print{button{display:none}}</style><div class=box><h1>Fibra+ · Provedor Plus</h1><p>${esc(i.billing_type)} · #BOL-${String(i.id).padStart(5,'0')}</p><div class=r><span>Cliente</span><b>${esc(c.name)}</b></div><div class=r><span>Contrato</span><b>${esc(c.contract_number||'—')}</b></div><div class=r><span>Plano</span><b>${esc(p.name||'Sem plano')}</b></div><div class=r><span>Descrição</span><b>${esc(i.description)}</b></div><div class=r><span>Vencimento</span><b>${date(i.due_date)}</b></div><div class=r><span>Valor</span><b>${money(i.amount_cents)}</b></div><div class=r><span>Situação</span><b>${esc(i.status)}</b></div>${i.paid_at?`<div class=r><span>Pagamento</span><b>${dt(i.paid_at)} · ${esc(i.paid_by)}</b></div>`:''}<button onclick=print()>Imprimir / salvar PDF</button></div>`}function previewInvoice(id){let w=open('','_blank');w.document.write(invoiceHtml(byId(db.invoices,id)));w.document.close()}function downloadInvoice(id){download(`boleto-${id}.html`,invoiceHtml(byId(db.invoices,id)),'text/html')}function ticketState(id){let t=byId(db.tickets,id),states=['Aguardando','Em atendimento','Técnico a caminho','Concluído','Fechado'],n=(states.indexOf(t.state)+1)%states.length;t.state=states[n];audit('Alterou status','chamado',id);persist();render()}function delRouter(id){if(db.clients.some(c=>c.router_id===id))return toast('MikroTik vinculado a cliente.');if(confirm('Excluir MikroTik?')){db.routers=db.routers.filter(r=>r.id!==id);persist();render()}}function safeBank(k){openModal(k==='efi'?'Efí Bank':'Mercado Pago',`<div class="notice">A configuração visual está preservada, mas a credencial privada será salva somente no backend seguro. Não vou gravar token, Client Secret ou certificado no navegador nem no repositório público.</div><p>Próxima etapa: ativar o backend bancário e então os testes, geração PIX e sincronização de pagamento serão executados daqui sem alterar esta tela.</p>`,null)}
function download(name,text,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function backup(){download(`Provedor-Plus-1.0.17-Backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,2),'application/json');audit('Criou','backup','');persist()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{db={...blank(),...JSON.parse(r.result)};persist();render();toast('Backup restaurado.')}catch{toast('Arquivo de backup inválido.')}};r.readAsText(f)};i.click()}function exportCsv(kind){let rows=kind==='clients'?db.clients:kind==='invoices'?db.invoices:kind==='overdue'?db.invoices.filter(i=>i.status==='Pendente'&&i.due_date<new Date().toISOString().slice(0,10)):kind==='tickets'?db.tickets:db.stock;if(!rows.length)return toast('Nenhum dado para exportar.');let h=Object.keys(rows[0]),csv='\uFEFF'+h.join(';')+'\r\n'+rows.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(';')).join('\r\n');download(`relatorio-${kind}.csv`,csv,'text/csv;charset=utf-8')}
document.getElementById('menu').onclick=()=>side.classList.toggle('open');document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter'){go('clients');setTimeout(()=>{clientSearch.value=e.target.value;clientSearch.dispatchEvent(new Event('input'))},50)}};let hash=location.hash.slice(1);if(nav.some(n=>n[0]===hash))current=hash;setNav();render();
</script>
</body></html>
