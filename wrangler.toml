# Provedor Plus — Cloudflare Worker de produção
# build: 20260922-d1-binding1
name = "painel"
main = "notification-center-entry-worker.js"
compatibility_date = "2026-08-30"
workers_dev = true

[build]
command = "node --check app.js && node --check mapa.js && node --check src/network-map.js && node --check src/panel-forms.js && node --check notification-center-entry-worker.js && node --check operations-entry-worker.js && node --check push-worker.js && node --check stories-entry-worker.js && node --check billing-cron.js && node --check worker-native-api.js && node --check customer-service-worker.js && node --check trust-release-worker.js && node --check negotiation-worker.js && node -e \"Promise.all([import('./src/api.js'),import('./src/ui.js'),import('./src/network-map.js')])\""

[triggers]
crons = [ "*/5 * * * *", "7 * * * *", "5 6 * * *" ]

[[mtls_certificates]]
binding = "EFI_MTLS"
certificate_id = "c48560c1-b904-4cdd-9d4d-297f34075e9d"

[[d1_databases]]
binding = "PROVEDOR_DB"
database_name = "provedor-plus-migracao"
database_id = "ba63268e-a20b-47b7-8b30-2d1691485c14"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
