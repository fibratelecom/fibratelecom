# Provedor Plus — Cloudflare Worker de produção
# build: 20260922-neon-economy1
name = "painel"
main = "notification-center-entry-worker.js"
compatibility_date = "2026-08-30"
workers_dev = true

[build]
command = "node --check app.js && node --check mapa.js && node --check src/network-map.js && node --check src/panel-forms.js && node -e \"Promise.all([import('./src/api.js'),import('./src/ui.js'),import('./src/network-map.js')])\""

[triggers]
crons = [ "* * * * *", "7,37 * * * *", "5 6 * * *" ]

[[mtls_certificates]]
binding = "EFI_MTLS"
certificate_id = "c48560c1-b904-4cdd-9d4d-297f34075e9d"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
