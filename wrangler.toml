# Cloudflare Provedor Plus - painel
# build: 20260902-due-date-protocols
# Efí Pix: mTLS usa binding EFI_MTLS; o certificado precisa estar cadastrado no Cloudflare.
name = "painel"
main = "customer-service-worker.js"
compatibility_date = "2026-08-30"
workers_dev = true

[triggers]
crons = [ "*/15 * * * *", "5 6 * * *" ]

[[mtls_certificates]]
binding = "EFI_MTLS"
certificate_id = "c48560c1-b904-4cdd-9d4d-297f34075e9d"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
